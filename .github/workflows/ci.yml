name: CI

# Runs on every PR and on pushes to main. Make the "test" check required in
# branch protection so a PR can only merge when build + tests are green.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows is a first-class target: coldstart wires hooks into Claude Code,
    # Cursor and Codex on Windows too. Running ubuntu-only hid an entire class
    # of bugs for months — every hook silently dead (#158), Rails/Laravel/Go/npm
    # workspace resolution silently disabled, and zero evidence collected by the
    # notebook — all invisible because the failures were "not found" branches,
    # not exceptions. None of it surfaced until a Windows user went digging.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: test (${{ matrix.os }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` (tsc --noEmit false) both type-checks AND emits dist/,
      # which some tests need at runtime (e.g. the kb recall hook spawns
      # `node dist/index.js kb search`). It exits non-zero on type errors, so
      # this doubles as the typecheck gate.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
