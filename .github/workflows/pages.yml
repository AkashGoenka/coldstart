name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site-astro/**'
      - '.github/workflows/pages.yml'
      # These feed the notebook/graph pages baked in above — a push here
      # changes site output even though it never touches site-astro/.
      - 'src/**'
      - '.coldstart/notebook/**'
      - 'scripts/kb-viewer/**'
      - 'scripts/graph-viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> comes from each source file's
          # last commit date, which a shallow clone cannot provide.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site-astro/package-lock.json
      - name: Build coldstart
        run: |
          npm ci
          npm run build
      - name: Build a fresh index for this checkout
        run: node dist/index.js index --root .
      - name: Regenerate notebook and graph site pages
        run: |
          node scripts/kb-viewer/build-site-page.mjs
          node scripts/graph-viewer/build-site-page.mjs
      - name: Install site dependencies
        working-directory: site-astro
        run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: site-astro
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-astro/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
