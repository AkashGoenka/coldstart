<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coldstart – Codebase Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      background: #070a11;
      color: #e7eef8;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      width: 100%;
      height: 100%;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .gradient-rule {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4fbfe0, #ef9448);
    }

    .wordmark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .snowflake-svg {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .wordmark-text {
      font-family: "Newsreader", Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #e7eef8;
    }

    .kicker {
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, "Fira Code", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4fbfe0;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .headline {
      font-family: "Newsreader", Georgia, serif;
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: #e7eef8;
      margin-bottom: 22px;
      max-width: 1000px;
    }

    .headline .accent-frost {
      color: #4fbfe0;
    }

    .headline .accent-ember {
      color: #ef9448;
    }

    .sublines {
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: #8b9ab2;
      line-height: 1.6;
      max-width: 900px;
      margin-bottom: 0;
    }

    .subline {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">
      <svg class="snowflake-svg" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <path id="arm" d="M16 14.5L16 4M16 8.2L13 5.6M16 8.2L19 5.6" fill="none" stroke="#4fbfe0" stroke-width="1.6" stroke-linecap="round"/>
          <radialGradient id="core" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffc884"/><stop offset="100%" stop-color="#ef9448"/></radialGradient>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ef9448" stop-opacity=".5"/><stop offset="70%" stop-color="#ef9448" stop-opacity=".1"/><stop offset="100%" stop-color="#ef9448" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="16" cy="16" r="8" fill="url(#glow)"/>
        <use href="#arm"/>
        <use href="#arm" transform="rotate(60 16 16)"/>
        <use href="#arm" transform="rotate(120 16 16)"/>
        <use href="#arm" transform="rotate(180 16 16)"/>
        <use href="#arm" transform="rotate(240 16 16)"/>
        <use href="#arm" transform="rotate(300 16 16)"/>
        <circle cx="16" cy="16" r="6" fill="none" stroke="#4fbfe0" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3" fill="url(#core)"/>
      </svg>
      <span class="wordmark-text">coldstart</span>
    </div>

    <div class="kicker">Codebase memory for AI coding agents</div>

    <h1 class="headline">
      Your agent relearns your codebase from <span class="accent-frost">scratch</span> — every <span class="accent-ember">session.</span>
    </h1>

    <div class="sublines">
      <div class="subline">A notebook the agent writes itself, plus a fast index to find the right file.</div>
      <div class="subline">No embeddings, no API key — it runs on the model you already pay for.</div>
    </div>
  </div>

  <div class="gradient-rule"></div>

  <script>
    // Wait for fonts to load before signaling ready
    document.fonts.ready.then(() => {
      window.fontsReady = true;
    });
  </script>
</body>
</html>
