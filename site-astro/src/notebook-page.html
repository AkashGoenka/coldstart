<title>Coldstart Notebook — coldstart</title>
<style>
  :root{
    --ground:#eaeef3; --surface:#ffffff; --rail:#f5f8fc; --sunk:#eef2f7;
    --ink:#161a22; --ink-soft:#39414f; --muted:#69748a; --faint:#9aa6b8;
    --line:#dce2ec; --line-soft:#e8edf3;
    --accent:#1f4fd8; --accent-soft:#e7ecfd; --accent-ink:#173bab;
    --fresh:#137a3b; --fresh-bg:#e4f4ea;
    --changed:#a85a06; --changed-bg:#fbeedd;
    --missing:#bb1436; --missing-bg:#fbe3e8;
    --unver:#5a6577; --unver-bg:#eceff4;
    --flow:#0b7285; --flow-bg:#dcf1f4;
    --file:#1f4fd8; --file-bg:#e7ecfd;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --sh:0 1px 2px rgba(20,28,45,.05),0 4px 16px rgba(20,28,45,.06);
    --r:9px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  ::selection{background:var(--accent-soft)}

  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;gap:20px;padding:12px 20px;
    background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
  #home{display:inline-flex;align-items:center;gap:5px;margin-right:2px;padding:5px 10px 5px 4px;border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--faint);text-decoration:none;flex:none;transition:color .15s,background .15s}#home:hover{color:var(--accent);background:var(--accent-soft)}.brand{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
  .brand .kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--faint);font-weight:600;line-height:1}
  .brand .repo{display:inline-flex;align-items:center;gap:6px;font-size:17px;
    font-weight:680;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
  .brand .repo::before{content:"";width:7px;height:7px;border-radius:50%;
    background:var(--accent);flex-shrink:0}
  .top .spacer{flex:1}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint)}
  .fresh-meter{display:flex;align-items:center;gap:8px}
  .meter-bar{width:120px;height:8px;border-radius:5px;background:var(--sunk);
    overflow:hidden;display:flex}
  .meter-bar i{display:block;height:100%}
  .segbtns{display:flex;background:var(--sunk);border-radius:8px;padding:3px}
  .segbtns button{padding:5px 13px;border-radius:6px;font-size:12.5px;
    font-weight:500;color:var(--muted)}
  .segbtns button[aria-pressed=true]{background:var(--surface);color:var(--ink);
    box-shadow:0 1px 2px rgba(20,28,45,.12);font-weight:600}

  /* ---- body split ---- */
  .split{display:grid;grid-template-columns:340px 1fr;min-height:0}
  .split.graph-mode{grid-template-columns:1fr}
  .split.graph-mode .rail{display:none}

  /* ---- rail ---- */
  .rail{background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .rail .controls{padding:12px 12px 0;display:flex;flex-direction:column;gap:10px}
  .search{position:relative}
  .search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);
    border-radius:8px;background:var(--surface);font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}

  /* lens tabs (Files / Flows) */
  .lenses{display:flex;gap:4px}
  .lens{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);
    background:var(--sunk);border:1px solid transparent}
  .lens .ct{font-family:var(--mono);font-size:11px;font-weight:700;
    padding:1px 6px;border-radius:20px;background:rgba(105,116,138,.16);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .lens[aria-pressed=true]{background:var(--surface);color:var(--ink);
    border-color:var(--line);box-shadow:var(--sh)}
  .lens.files[aria-pressed=true]{color:var(--file)} .lens.files[aria-pressed=true] .ct{background:var(--file-bg);color:var(--file)}
  .lens.flows[aria-pressed=true]{color:var(--flow)} .lens.flows[aria-pressed=true] .ct{background:var(--flow-bg);color:var(--flow)}
  .lens .ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* status / freshness filter row */
  .statusrow{display:flex;align-items:center;gap:8px;padding:2px}
  .fchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;
    font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .fchip .d{width:8px;height:8px;border-radius:50%;background:var(--fresh)}
  .fchip.has-stale{color:var(--changed);border-color:var(--changed);background:var(--changed-bg)}
  .fchip.has-stale .d{background:var(--changed)}
  .fchip[aria-pressed=true]{outline:2px solid var(--changed);outline-offset:1px}
  .fchip.all-fresh .d{background:var(--fresh)}
  .treetools{margin-left:auto;display:flex;gap:2px}
  .treetools button{font-family:var(--mono);font-size:10px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--faint);padding:4px 7px;border-radius:6px}
  .treetools button:hover{color:var(--accent);background:var(--sunk)}

  .list{overflow-y:auto;padding:8px 8px 60px;flex:1}

  /* tree rows */
  .row{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
    padding:5px 8px;border-radius:7px;min-height:30px}
  .row:hover{background:var(--sunk)}
  .row[aria-current=true]{background:var(--accent-soft)}
  .row[aria-current=true] .lbl{color:var(--accent-ink);font-weight:600}
  .chev{width:14px;height:14px;flex-shrink:0;stroke:var(--faint);fill:none;stroke-width:2;
    transition:transform .12s}
  .row.open>.chev{transform:rotate(90deg)}
  .spacer-ic{width:14px;flex-shrink:0}
  .ficon{width:15px;height:15px;flex-shrink:0;stroke:var(--faint);fill:none;stroke-width:1.6}
  .row.dir .ficon{stroke:var(--accent);fill:var(--accent-soft)}
  .lbl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .row.dir .lbl{font-weight:600;color:var(--ink-soft)}
  .row.dir .lbl .seg-dim{color:var(--faint);font-weight:500}
  .badge{font-family:var(--mono);font-size:10px;color:var(--faint);
    font-variant-numeric:tabular-nums;flex-shrink:0}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot.fresh{background:var(--fresh)} .dot.changed{background:var(--changed)}
  .dot.missing{background:var(--missing)} .dot.unverified{background:var(--unver)}
  .char{font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--faint);
    border:1px solid var(--line);border-radius:3px;padding:0 3px;flex-shrink:0}

  /* flow cards */
  .flowcard{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;
    border:1px solid var(--line-soft);background:var(--surface);margin-bottom:7px}
  .flowcard:hover{border-color:var(--flow);box-shadow:var(--sh)}
  .flowcard[aria-current=true]{border-color:var(--flow);background:var(--flow-bg)}
  .fc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .fc-top .dot{margin-top:0}
  .fc-title{font-size:13px;font-weight:600;line-height:1.35;flex:1;overflow-wrap:anywhere}
  .fc-span{display:flex;flex-wrap:wrap;gap:4px}
  .fc-file{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--sunk);
    padding:1px 6px;border-radius:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fc-more{font-family:var(--mono);font-size:10px;color:var(--faint);padding:1px 3px}
  .empty-note{color:var(--faint);font-size:12px;font-style:italic;padding:20px 10px}

  /* ---- reader ---- */
  .reader{overflow-y:auto;padding:0}
  .reader-inner{max-width:760px;margin:0 auto;padding:38px 40px 120px}
  .eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11px;margin-bottom:14px}
  .eyebrow .id{color:var(--faint);overflow-wrap:anywhere}
  .eyebrow .sep{color:var(--line)}
  .kind{font-family:var(--mono);font-size:9px;letter-spacing:.06em;font-weight:700;
    text-transform:uppercase;padding:1px 5px;border-radius:4px}
  .kind.file{color:var(--file);background:var(--file-bg)}
  .kind.flow{color:var(--flow);background:var(--flow-bg)}
  h1.note-title{font-size:26px;line-height:1.22;letter-spacing:-.02em;
    font-weight:680;margin:0 0 16px;text-wrap:balance;overflow-wrap:anywhere}
  .metabar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line-soft)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    font-weight:600;padding:3px 10px;border-radius:20px;font-family:var(--mono);
    letter-spacing:.02em}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .pill.fresh{color:var(--fresh);background:var(--fresh-bg)} .pill.fresh .d{background:var(--fresh)}
  .pill.changed{color:var(--changed);background:var(--changed-bg)} .pill.changed .d{background:var(--changed)}
  .pill.missing{color:var(--missing);background:var(--missing-bg)} .pill.missing .d{background:var(--missing)}
  .pill.unverified{color:var(--unver);background:var(--unver-bg)} .pill.unverified .d{background:var(--unver)}
  .metabar .mi{font-size:12px;color:var(--muted)}
  .metabar .mi b{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:600}

  .sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);font-weight:600;margin:26px 0 10px}

  .anchor{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
    padding:11px 13px;margin-bottom:8px}
  .anchor-top{display:flex;align-items:center;gap:9px}
  .apath{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;
    overflow-wrap:anywhere;flex:1}
  .apath .p{color:var(--faint)}
  .astate{font-family:var(--mono);font-size:9px;letter-spacing:.06em;font-weight:700;
    text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
  .astate.fresh{color:var(--fresh);background:var(--fresh-bg)}
  .astate.changed{color:var(--changed);background:var(--changed-bg)}
  .astate.missing{color:var(--missing);background:var(--missing-bg)}
  .astate.unverified{color:var(--unver);background:var(--unver-bg)}
  .copy{font-family:var(--mono);font-size:10px;color:var(--faint);padding:2px 6px;
    border-radius:4px;border:1px solid var(--line)}
  .copy:hover{color:var(--accent);border-color:var(--accent)}
  .syms{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .sym{font-family:var(--mono);font-size:11px;background:var(--sunk);
    color:var(--ink-soft);padding:2px 7px;border-radius:5px;cursor:pointer;
    transition:background .1s,color .1s;position:relative}
  .sym:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .sym.copied{background:var(--accent);color:#fff}
  .sym.copied::after{content:"copied";position:absolute;left:50%;bottom:calc(100% + 5px);
    transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9px;
    padding:2px 6px;border-radius:4px;white-space:nowrap;letter-spacing:.04em}

  .aliases{border:1px solid var(--line-soft);border-radius:var(--r);
    background:var(--rail);overflow:hidden}
  .aliases summary{list-style:none;cursor:pointer;padding:9px 13px;
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .aliases summary::-webkit-details-marker{display:none}
  .aliases summary b{color:var(--ink-soft);font-weight:600}
  .aliases summary .chv{margin-left:auto;transition:transform .15s}
  .aliases[open] summary .chv{transform:rotate(90deg)}
  .alias-cloud{display:flex;flex-wrap:wrap;gap:6px;padding:2px 13px 13px}
  .alias-cloud span{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:12px}

  .md{font-size:14.5px;line-height:1.68;color:var(--ink-soft)}
  .md h2{font-size:13px;font-family:var(--mono);letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink);font-weight:700;margin:30px 0 12px;
    padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
  .md h3{font-size:15px;margin:22px 0 8px;color:var(--ink)}
  .md p{margin:0 0 14px}
  .md ul,.md ol{margin:0 0 14px;padding-left:22px}
  .md li{margin:0 0 8px}
  .md li::marker{color:var(--faint)}
  .md code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);
    color:var(--accent-ink);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
  .md strong{color:var(--ink);font-weight:650}
  .wl{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;
    background:var(--accent-soft);padding:1px 6px;border-radius:5px;
    text-decoration:none;overflow-wrap:anywhere}
  .wl:hover{background:var(--accent);color:#fff}
  .wl.dead{color:var(--muted);background:var(--sunk);cursor:default}

  .links-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px;
    padding-top:22px;border-top:1px solid var(--line-soft)}
  @media(max-width:640px){.links-grid{grid-template-columns:1fr}}
  .linkcol .sec-label{margin-top:0}
  .linkbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:8px 10px;border-radius:7px;font-size:12px;margin-bottom:3px}
  .linkbtn:hover{background:var(--sunk)}
  .linkbtn .kind{flex-shrink:0}
  .linkbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--faint);font-size:13px}

  /* ---- graph ---- */
  .graph-wrap{position:relative;overflow:hidden;background:
    radial-gradient(circle at 30% 20%, #f2f5fa, var(--ground))}
  .graph-wrap canvas{display:block;width:100%;height:100%}
  .graph-legend{position:absolute;top:16px;left:16px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
    box-shadow:var(--sh);font-size:12px;max-width:230px}
  .graph-legend .lg-t{font-family:var(--mono);font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .graph-legend .lg-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .graph-legend .lg-row i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .graph-legend .hint{color:var(--muted);margin-top:8px;line-height:1.4}
  .graph-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;
    font-size:11.5px;padding:6px 10px;border-radius:7px;max-width:280px;opacity:0;
    transform:translate(-50%,-140%);transition:opacity .1s;box-shadow:var(--sh);z-index:3}
  .graph-tip .tk{font-family:var(--mono);font-size:9px;letter-spacing:.06em;
    text-transform:uppercase;opacity:.7}

  @media(max-width:860px){
    .split{grid-template-columns:1fr}
    .rail{position:absolute;inset:57px 0 0 0;z-index:4;width:min(340px,86vw);
      box-shadow:var(--sh)}
    .split:not(.rail-open) .rail{display:none}
    .split.graph-mode .rail{display:none}
    .reader-inner{padding:26px 20px 100px}
    .menu-btn{display:inline-flex!important}
  }
  .menu-btn{display:none;align-items:center;gap:6px}
</style>

<div class="app">

    <div class="brand">

  </div>

<script>const DB = {"summary":{"total":118,"byType":{"file":97,"flow":21},"byFreshness":{"fresh":54,"changed":57,"missing":7},"repo":"coldstart","generated":"2026-08-26"},"notes":[{"id":"hooks-evidence-mjs-147e7dd5","type":"file","character":"single","title":"hooks/evidence.mjs","aliases":["mention-only drop","grep hits not reads","sed -i is an edit","tool_result confirmation","cursor no tool results","codex cmd regex","inline script read detection","bashContentRead","bashEditTargets","shell write detection","heredoc tag arbitrary","cat redirect tiered as read","heredoc tag not recognized"],"status":"active","updated":"2026-08-25T18:54:16.712Z","edits":5,"anchors":[{"path":"hooks/evidence.mjs","symbols":["extractEvidence","extractCursorEvidence","extractCodexEvidence","classifyBash","codexCmdStrings","makeCollector","contentReadFiles","segmentStats","segmentStatsCursor","normRel","inlineScriptTier","bashContentRead","redirectTargets","bashEditTargets"],"hash":"sha256:9fbcfb9db13e","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Per-host transcript-to-evidence extractors with tier classification (edit/read/gs/mention), and the one table deciding what shell activity counts as reading or writing a file. Host gotchas verified on real transcripts: Cursor's conversation JSONL has NO tool_result records, so its extractor trusts calls and compensates with a stat-existence check on EVERY claim; Codex pairs custom_tool_call to output by call_id and its exec input embeds shell with the cmd key appearing BOTH quoted and unquoted across rollout versions. Default-deny: an unknown bash verb contributes at most a mention. Reading through the SHELL counts as reading (read verbs, plus inline scripts in any language matched on the file-open call in their body); writing through the shell counts as writing (bashEditTargets: redirect, tee, sed -i, literal write arg). A heredoc tag is an ARBITRARY identifier — the old EOF/PY/JS whitelist missed PATCH, TS and MSG and made those scripts invisible to both surfaces. redirectTargets overrides the verb table so `cat > x <<EOF` is an edit, not a read. Measured while building this: attributing a whole command would over-tier 50.6% of inline reads; output VOLUME does not separate reads from searches (cat's median is 18 lines vs an inline script's 10); and the deterministic write rules cover 89.2% of shell writes, so the single-literal guess for computed paths was rejected at 5.8% marginal gain.","backlinks":[],"anchorLinks":["how-a-shell-mediated-file-read-reaches-the-nudge-and-the-cap","how-notebook-capture-fires-v5-trigger-timed","how-the-co-change-signal-reaches-an-agent-that-never-runs-gs"]},{"id":"hooks-cochange-nudge-mjs-2fa94d26","type":"file","character":"single","title":"hooks/cochange-nudge.mjs","aliases":["co-change edit nudge","edit list per task","cochange sidecar reader","resetEditTrack","mirrored cache dir","shell edit detection","editedFiles list","nudge silent on sed edits","heredoc edit not counted"],"status":"active","updated":"2026-08-25T18:54:16.701Z","edits":2,"anchors":[{"path":"hooks/cochange-nudge.mjs","symbols":["coChangeNudge","resetEditTrack","coChangePath","suggest","render","loadState","editedPath","EDIT_TOOLS","MIN_RATIO","ORPHAN_MS","editedFiles","SHELL_TOOLS"],"hash":"sha256:33dd367fbc19","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Detector (7) of the PostToolUse nudge: records each edited file per (session,agent) and, once a SECOND distinct file is edited, names the files git history says move with them. Three rules, all measured, none to re-derive: the list clears on every new user message; nothing fires below 2 distinct files (trivial one-file jobs); then it fires for any partner not already edited and not already named — those two exclusions are the whole quieting mechanism, no per-session cap is needed. An edit is an edit TOOL or a shell write: editedFiles() returns a LIST, because one command can write two files and reach the 2-file threshold by itself. Two things a future editor will get wrong: (a) the tmp sweep must match the exact key or `<sid>_<aid>`, NEVER a bare `<sid>` prefix, or it clears a different session whose id merely starts the same; (b) the cache-dir derivation is a hand-copy of getCacheDir/cacheKey because hooks cannot import dist/ — change one and tests/cochange-nudge.test.ts is the only thing that notices. Cursor is why EDIT_TOOLS carries `SearchReplace` and editedPath accepts `path` as well as `file_path`; that shape is verified against Cursor transcripts, NOT a live Cursor hook payload.","backlinks":[],"anchorLinks":["how-the-co-change-signal-reaches-an-agent-that-never-runs-gs"]},{"id":"how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","type":"flow","character":null,"title":"how the co-change signal reaches an agent that never runs gs","aliases":["co-change edit nudge","edited together injection","PostToolUse detector 7","unasked co-change","edit-time nudge","shell edits count as edits","sed heredoc edit nudge","nudge silent in auto mode","edited via script no nudge"],"status":"active","updated":"2026-08-25T18:54:16.648Z","edits":2,"anchors":[{"path":"hooks/cochange-nudge.mjs","hash":"sha256:33dd367fbc19","state":"fresh"},{"path":"hooks/nudge-handler.mjs","hash":"sha256:2eefdfc34529","state":"fresh"},{"path":"hooks/kb-recall.mjs","hash":"sha256:7a8923adf6e0","state":"fresh"},{"path":"src/indexer/cochange.ts","hash":"sha256:b77c94aa16f5","state":"fresh"},{"path":"hooks/evidence.mjs","hash":"sha256:9fbcfb9db13e","state":"fresh"},{"path":"tests/cochange-nudge.test.ts","hash":"sha256:bfb50fa6b9bd","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"The \"Edited together\" partners are delivered to the agent WITHOUT it asking, at the moment an edit lands, because agents do not reliably run `gs` before editing. What counts as \"an edit\" is the load-bearing part: an edit TOOL or a deterministic shell write (`>`/`>>`, `tee`, `sed -i`, or a write call naming a literal path, via bashEditTargets in hooks/evidence.mjs). Gating on tool names alone made the whole feature silent for an agent instructed to edit with sed/heredocs/scripts — which is the auto-mode default, so the agent that most needed the nudge was the one guaranteed never to get it. The delivery path shares NO code with the `gs` rendering path: it is detector (7) inside the PostToolUse nudge handler, it reads the keeper's `cochange.json` sidecar directly, and its gate is deliberately LOOSER than `gs` (ratio >= 0.3 of the seed's own commits, shared >= 2, top 5) because \"what am I forgetting\" is a recall question while the `gs` cut is tuned for precision. It needs no `init` wiring: PostToolUse is registered on all three hosts with a match-everything matcher, and cursor-nudge-handler delegates to the Codex one.\n\n## Steps\n\n1. `hooks/cochange-nudge.mjs` (`coChangeNudge`, `editedFiles`, `suggest`, `resetEditTrack`, `coChangePath`, `EDIT_TOOLS`, `SHELL_TOOLS`) — the whole feature: what counts as an edit, the per-task edit list, the gate, the message\n2. `hooks/evidence.mjs` (`bashEditTargets`, `redirectTargets`, `inlineScriptTier`) — decides which repo files a shell command WRITES — the shared table, so the nudge and the capture worklist cannot disagree\n3. `hooks/nudge-handler.mjs` (`handle`) — host entry — calls it as detector (7) at priority 3\n4. `tests/cochange-nudge.test.ts` — pins the shell-edit shapes and the deliberate silences\n\n## Invariants\n\n- UserPromptSubmit is the ONLY clearing signal. Elapsed time is the wrong shape for a task boundary — an auto-mode run edits for hours with no prompt, and a session id survives a resume days later. A settle clock, the session id, and a 30-min TTL were each tried and rejected as proxies for it. The 7-day sweep in resetEditTrack is garbage collection for abandoned files, never a boundary.\n- The nudge (PostToolUse) and the reset (UserPromptSubmit) are wired by SEPARATE init functions — wireClaudeHooks vs wireClaudeKbHooks — so a repo can have the nudge without the reset. There the list never clears; it degrades quietly rather than loudly, because each file is named at most once.\n- The edit list is its own tmp file, never folded into /tmp/find_nudge_<key>.json, which the search detectors and the preguard's deny-key depend on.\n- Hooks never import from dist/, so the hook MIRRORS getCacheDir/cacheKey. tests/cochange-nudge.test.ts asserts the two paths are equal — without it a rename on the TS side kills the feature silently.\n- only DETERMINISTIC shell writes count; a write to a computed path claims nothing. Measured: the deterministic rules cover 89.2% of real shell writes, and inferring the rest from 'the one source path in the script' added 5.8% while making it possible to name a file the script only READ\n- a heredoc tag is an arbitrary identifier (EOF, PATCH, TS, MSG) — never re-introduce a tag whitelist, it made whole scripts invisible\n- a redirect target is an edit even under a read verb, so `cat > x <<EOF` must not tier x as a read","backlinks":[],"anchorLinks":["how-a-shell-mediated-file-read-reaches-the-nudge-and-the-cap","how-notebook-capture-fires-v5-trigger-timed","hooks-cochange-nudge-mjs-2fa94d26","hooks-evidence-mjs-147e7dd5","hooks-kb-recall-mjs-bb2f72e8","hooks-nudge-handler-mjs-9ca0ef0b","how-the-moves-together-signal-reaches-gs-without-going-throu","src-indexer-cochange-ts-87067890"]},{"id":"hooks-codex-nudge-handler-mjs-f48031e6","type":"file","character":"single","title":"hooks/codex-nudge-handler.mjs","aliases":["codex nudge twin","duplicated detector logic","fix applied to one host only"],"status":"active","updated":"2026-08-25T18:44:33.078Z","edits":1,"anchors":[{"path":"hooks/codex-nudge-handler.mjs","symbols":["handle","resultText","grepPattern","kbSpiralHit"],"hash":"sha256:59c42aa2b899","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Codex's PostToolUse nudge. Verified this session by diffing it against hooks/nudge-handler.mjs: the two files are byte-identical apart from two header-comment lines (the filename and the name of the PreToolUse guard). It is a maintained copy, not a re-implementation, so any detector change must be applied to both in the same commit or Codex silently keeps the old behaviour. Cursor has no third copy — hooks/cursor-nudge-handler.mjs delegates here, so this file is the one that governs two of the three hosts.","backlinks":[],"anchorLinks":["how-a-shell-mediated-file-read-reaches-the-nudge-and-the-cap"]},{"id":"hooks-nudge-handler-mjs-9ca0ef0b","type":"file","character":"single","title":"hooks/nudge-handler.mjs","aliases":["postToolUse nudge detectors","grep spiral detector","seen_find_queries registration","cat treated as spiral","nudged while reading files"],"status":"active","updated":"2026-08-25T18:44:33.068Z","edits":1,"anchors":[{"path":"hooks/nudge-handler.mjs","symbols":["handle","resultText","grepPattern","kbSpiralHit","gitFingerprint","gitHead","matchAllGroup"],"hash":"sha256:2eefdfc34529","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Claude's PostToolUse nudge: 7 search-behaviour detectors over a per-(session,agent) /tmp state file, plus registration of every successful find's canonical key for the PreToolUse guard to deny against. What I verified this session is how it decides a call is a READ versus a SEARCH — it used to define a read as `tool === \"Read\"` and list `cat` inside SEARCH_RE, so an agent working through the shell (the auto-mode default) was told it was spiralling for reading files; three cats of three different files fired the anti-grep nudge. Read classification now comes from bashContentRead in evidence.mjs rather than from a regex here, so the nudge and the capture worklist cannot drift on what counts as reading. A command that both reads and searches (`cat x | grep y`) stays a search: the grep is the operative half.","backlinks":[],"anchorLinks":["how-a-shell-mediated-file-read-reaches-the-nudge-and-the-cap","how-the-co-change-signal-reaches-an-agent-that-never-runs-gs"]},{"id":"how-a-shell-mediated-file-read-reaches-the-nudge-and-the-cap","type":"flow","character":null,"title":"how a shell-mediated file read reaches the nudge and the capture worklist","aliases":["shell read classification","reading via bash","inline script read","intent vs attribution","cat counted as grep spiral","shell reads invisible to capture"],"status":"active","updated":"2026-08-25T18:44:33.030Z","edits":1,"anchors":[{"path":"hooks/evidence.mjs","hash":"sha256:d8b68b9a4e7f","state":"changed"},{"path":"hooks/nudge-handler.mjs","hash":"sha256:2eefdfc34529","state":"fresh"},{"path":"hooks/codex-nudge-handler.mjs","hash":"sha256:59c42aa2b899","state":"fresh"},{"path":"hooks/cursor-nudge-handler.mjs","hash":"sha256:745090ec3b11","state":"fresh"},{"path":"hooks/cursor-input.mjs","hash":"sha256:8fb374fcd6b4","state":"fresh"},{"path":"tests/shell-read-evidence.test.ts","hash":"sha256:233464173f1c","state":"fresh"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"One table in hooks/evidence.mjs decides what counts as reading a file, and it deliberately gives two different answers to two consumers: the PostToolUse nudge asks only whether content was put in front of the agent (bashContentRead), while the capture worklist asks which NAMED file was read (the tier attached to each path token). The same command can therefore clear the grep-spiral nudge while anchoring no note at all — `python3 -c 'print(open(sys.argv[1]).read())' src/cli.ts` is a real read with no literal path to attribute. Both surfaces reach that one table by three different host routes, so a fix applied to Claude's path alone leaves Codex and Cursor silently broken.\n\n## Steps\n\n1. `hooks/evidence.mjs` (`classifyBash`, `inlineScriptTier`, `bashContentRead`) — the single classification table: read verbs, inline-script file-open APIs, and per-token tier\n2. `hooks/nudge-handler.mjs` (`handle`) — Claude PostToolUse consumer — asks INTENT only, via bashContentRead\n3. `hooks/codex-nudge-handler.mjs` (`handle`) — Codex consumer, a verbatim twin of the Claude handler\n4. `hooks/cursor-nudge-handler.mjs` (`handle`) — Cursor consumer — delegates to the Codex handler through adaptCursorInput, so it inherits fixes without its own patch\n5. `hooks/cursor-input.mjs` (`adaptCursorInput`) — renames Cursor's Shell tool to Bash so the shared detectors match unchanged\n6. `tests/shell-read-evidence.test.ts` — pins all three hosts x both surfaces, because a one-host fix fails silently\n\n## Invariants\n\n- `cat` must never go back into SEARCH_RE in either nudge handler — it prints a whole file, which is a Read by another name\n- hooks/nudge-handler.mjs and hooks/codex-nudge-handler.mjs are verbatim twins apart from their header comment; patch both in the same change\n- inline scripts are classified BEFORE the segment split — the splitter cuts on `;`/`|` that are the script's own syntax, not shell operators\n- the read tier attaches only to the path named inside the read call; other path tokens in the same command stay mentions","backlinks":[],"anchorLinks":["how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","hooks-codex-nudge-handler-mjs-f48031e6","hooks-evidence-mjs-147e7dd5","hooks-nudge-handler-mjs-9ca0ef0b","how-notebook-capture-fires-v5-trigger-timed"]},{"id":"src-cache-disk-cache-ts-1359262b","type":"file","character":"single","title":"src/cache/disk-cache.ts","aliases":["LoadProfile concept","cache segments","gs vs full profiles","disk persistence","cacheKey derivation","getCacheDir","cache path hash","mirrored by hooks","loadCachedIndex returned null","profile passed as second argument"],"status":"active","updated":"2026-08-25T18:18:29.577Z","edits":3,"anchors":[{"path":"src/cache/disk-cache.ts","symbols":["loadCachedIndex","saveCachedIndex","getCacheDir","cacheKey","LoadProfile"],"hash":"sha256:a309616de81d","state":"fresh"}],"freshness":"fresh","dir":"src/cache","outLinks":[],"body":"On-disk index cache with consumer-scoped segments and lazy loading. LoadProfile: 'find' loads table+core+graph (~200ms), 'gs' adds callgraph (500ms on warm cache), 'full' adds build data (keeper only). CLI readers use 'gs' to avoid keeper-only segments. Cache validity = version + gitHead + keeper watcher (no TTL). loadCachedIndex's SECOND positional parameter is baseCacheDir, not the profile — the profile is third, and passing it second silently yields a null cache that reads exactly like a cache miss. Verified 2026-08-25: cacheKey is `<basename>-<sha256(abs)[0:16]>` under coldstartHome()/indexes, and it now has a consumer the import graph cannot see — hooks/cochange-nudge.mjs HAND-COPIES that derivation, because hooks never import from dist/. tests/cochange-nudge.test.ts asserts the copy still agrees; renaming or rekeying here without running it silently breaks the edit-time nudge rather than failing a build.","backlinks":[],"anchorLinks":[]},{"id":"src-indexer-cochange-ts-87067890","type":"file","character":"single","title":"src/indexer/cochange.ts","aliases":["co-change derivation","git log name-status","rename carry forward","moves together pairs","canonicalizeRenames","co-edited partners","touched denominator","ratio denominator absent","no touched entry","denominator missing for file"],"status":"active","updated":"2026-08-25T18:18:29.565Z","edits":2,"anchors":[{"path":"src/indexer/cochange.ts","symbols":["deriveCoChange","canonicalizeRenames","parseCommits","coChangePartnersFor","loadCoChange","saveCoChange","CO_CHANGE_WINDOW","CO_CHANGE_K","coChangePath","CO_CHANGE_MIN_SUPPORT"],"hash":"sha256:b77c94aa16f5","state":"fresh"}],"freshness":"fresh","dir":"src/indexer","outLinks":[],"body":"Derives \"which files move together\" by walking git log --name-status -M and counting files that change in the same commit; stores 8 partners per file, shows 3, min support 2, 12k-commit window (all measured, don't retune blind). The non-obvious part is canonicalizeRenames: -M labels ONLY the rename commit, so every older commit still records the old path and a renamed file silently splits into two half-histories whose older half is keyed to a path that no longer exists and can never be displayed. Because git log is newest-first, the fix is a single forward pass carrying an alias map — a rename old->new seen at commit i means every LATER entry in the stream (i.e. older commit) that says old means new — resolved transitively and only ever recorded backwards, so a path later reused by a different file keeps its own identity. Verified 2026-08-23 on arches: 12k commits in 596ms, 325KB sidecar. 2026-08-25, for consumers computing a RATIO: `touched` is NOT a count for every file in history — it is trimmed to `keep`, i.e. files that got a partner list plus those partners, so a file whose every pair fell below min-support has NO entry at all and any shared/touched calculation must read that absence as silence rather than a zero denominator. Every file that HAS partners does have its denominator, so a ratio gate needs no extra data.","backlinks":[],"anchorLinks":["how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","how-the-moves-together-signal-reaches-gs-without-going-throu"]},{"id":"github-workflows-ci-yml-899ce9c2","type":"file","character":"single","title":".github/workflows/ci.yml","aliases":["CI workflow","GitHub Actions permissions","workflow permissions block","missing workflow permissions","codeql workflow alert","actions permissions warning"],"status":"active","updated":"2026-08-25T16:34:51.684Z","edits":1,"anchors":[{"path":".github/workflows/ci.yml","hash":"sha256:c93991865d01","state":"fresh"}],"freshness":"fresh","dir":".github/workflows","outLinks":[],"body":"CI workflow running build+test on ubuntu-latest and windows-latest (matrix added in #159, after ubuntu-only CI hid months of Windows-only bugs). Requires an explicit top-level `permissions: contents: read` block — its absence trips CodeQL's actions/missing-workflow-permissions check; the workflow only checks out/builds/tests so read-only is correct, matching the same block in verify-149-windows-hide.yml.","backlinks":[],"anchorLinks":[]},{"id":"tests-content-tokens-test-ts-1b6e539c","type":"file","character":"single","title":"tests/content-tokens.test.ts","aliases":["related section tests","content token tests","deriveRelatedFiles test","name echo test","related section regressed to full view","import neighbour leaked into related"],"status":"active","updated":"2026-08-23T10:33:43.536Z","edits":1,"anchors":[{"path":"tests/content-tokens.test.ts","symbols":["makeIndex","TOKEN_IN_CODE","TOKEN_IN_STRING","deriveRelatedFiles","deriveNameEchoFiles"],"hash":"sha256:2fd1da4eb640","state":"fresh"}],"freshness":"fresh","dir":"tests","outLinks":[],"body":"Covers the content-token channel end to end: extractContentTokens, deriveRelatedFiles, deriveNameEchoFiles, and how handleGetStructure renders the Related section. The rendering block is the regression guard for two rules that were each broken once — Related must appear in every gs view (it was full-view-only, so `--view symbols` on a large file dropped the name-reference neighbours that view is used to find), and an import-edge neighbour must stay excluded even in a view that lists no importers, because the heading promises 'no import edge' and the imports/importers lists cannot back that promise when a narrow view leaves them empty. Both directions of the edge are asserted; the exclusion reads index.outEdges/inEdges, not the rendered lists.","backlinks":[],"anchorLinks":[]},{"id":"src-server-tools-ts-cb60011b","type":"file","character":"hub","title":"src/server/tools.ts","aliases":["gs handler","symbol lookup","file presence check","symbol page rendering","bidirectional edges","moves together rendering","gs page builder","handleGetStructure","gs view gating","related section"],"status":"active","updated":"2026-08-23T10:33:43.525Z","edits":6,"anchors":[{"path":"src/server/tools.ts","symbols":["handleGetStructure","findFileByPath","buildCallersForFile","renderSymbolSlice","compileMatchPredicate"],"hash":"sha256:53676513658f","state":"fresh"}],"freshness":"fresh","dir":"src/server","outLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu"],"body":"handleGetStructure builds the gs symbol page for one file. Uses findFileByPath to lookup file: returns [fileId, IndexedFile] if found, null if not indexed. Distinguishes two states: null → file not in index (untracked), [fileId, file with file.symbols=[]] → file indexed but has zero symbols (e.g., CSS). Handles match filtering, symbol slicing, imports/importers, callers per symbol. Critical for kb write reuse: can call loadCachedIndex('gs') then index.files.get(path) to check presence.\n\n## Facets\n\n- **handleGetStructure** — Builds the gs page. findFileByPath distinguishes two states: null = not indexed, [fileId, file with symbols=[]] = indexed but symbol-less (e.g. CSS). It is SYNCHRONOUS and takes the index only, which is why git-derived co-change arrives as an optional THIRD parameter loaded by each caller. The `view` param gates ONLY the sections describing this file — wantSymbols/wantImports/wantImporters/wantInlineCallers. The two cross-file sections, Edited together and Related, are deliberately ungated and render in every view; both were full-view-only once and both misses were found the same way, by a real session asking for `--view symbols` on a god-file. Related is still computed AFTER co-change so co-change's picks can join its excludeIds and a path never prints under two headings. — [[how-the-moves-together-signal-reaches-gs-without-going-throu]]\n- **buildCallersForFile** — Given fileId and file, returns { exportedSymbol, callers[] } by iterating ALL symbolEdges filtering type==='calls' and checking edge.to is exported in the target. No pre-built reverse index; an O(n) walk of symbolEdges per file lookup.\n- **renderSymbolSlice** — calleesOf(symId) walks symbolEdges filtering type==='calls' && from===symId for outgoing targets — bidirectional pattern: callers via incoming edges, callees via outgoing.\n- **compileMatchPredicate** — Compiles the match filter: /regex/, a|b for OR, else case-insensitive substring. Returns null when no filter was requested.","backlinks":[],"anchorLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu","how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces"]},{"id":"how-the-moves-together-signal-reaches-gs-without-going-throu","type":"flow","character":null,"title":"how the edited-together signal reaches gs without going through the index","aliases":["co-change sidecar","moves together section","cochange.json","git history signal","co-edited files gs","how the moves-together signal reaches gs without going through the index","edited together section","section missing in view symbols","narrowed gs view drops a section"],"status":"active","updated":"2026-08-23T10:33:43.496Z","edits":4,"anchors":[{"path":"src/index-manager.ts","hash":"sha256:cb324edbaeb8","state":"changed"},{"path":"src/indexer/cochange.ts","hash":"sha256:b77c94aa16f5","state":"fresh"},{"path":"src/cli.ts","hash":"sha256:e863c8636403","state":"changed"},{"path":"src/server/mcp.ts","hash":"sha256:3f63d980bc9b","state":"changed"},{"path":"src/server/tools.ts","hash":"sha256:53676513658f","state":"fresh"}],"freshness":"changed","dir":"src","outLinks":[],"body":"The \"Edited together\" pairs shown by gs are NOT part of the code index and never travel through the cache pipeline — they live in a separate keeper-written sidecar (cochange.json) that each reader loads itself and hands to handleGetStructure as a THIRD argument. This is why gs can show them at all: handleGetStructure is synchronous and takes only an index, so there was no way to reach git from inside it. Consequence for anyone adding a similar signal: don't try to hang it off CodebaseIndex — the cache is consumer-scoped and gzip-swept, and a reader that already has an index still needs a second explicit load. It also means a surface that forgets to pass the argument silently renders nothing rather than erroring. The section was called \"Moves together\" until 2026-08-23; the old name survives in identityAliases on purpose so a search for it still lands here.\n\n## Steps\n\n1. `src/index-manager.ts` (`refreshCoChange`, `startWatching`, `scheduleCacheSave`) — keeper derives it at watch start and whenever HEAD moves, then writes the sidecar\n2. `src/indexer/cochange.ts` (`deriveCoChange`, `saveCoChange`, `loadCoChange`, `coChangePartnersFor`) — the git walk, the sidecar read/write, and the render selector\n3. `src/cli.ts` (`runGs`) — CLI reader loads the sidecar and passes it as the third argument\n4. `src/server/mcp.ts` (`registerToolHandlers`) — MCP reader re-loads it per call, since the keeper rewrites it on branch switch\n5. `src/server/tools.ts` (`handleGetStructure`) — renders the section in EVERY view, excluding this file's import-graph neighbours (index.outEdges/inEdges) rather than whichever lists the current view happens to print\n\n## Invariants\n\n- Derivation is keyed on git HEAD, not on file edits — an uncommitted change never re-walks history.\n- Absent sidecar renders NO section at all, never an empty one: silence must not read as 'nothing moves with this file'.\n- The sidecar is plain JSON, not .gz — saveCachedIndex sweeps *.gz on every save and would delete it.\n- The section is full-view only; the narrowed gs views never show it.\n- The section renders in every gs view. It was full-view-only until 2026-08-23, and the first real session that could have used it asked for `--view symbols` on a god-file, so the channel was unreachable at exactly the moment it was wanted. Do not re-gate it on view.\n- The exclusion set is read from index.outEdges/inEdges, NOT from importsOut/importersShown. The heading claims these pairs carry no import edge, and that claim is only true if every graph neighbour is excluded — narrow views populate neither list, and full view's importer list is capped, so a view-scoped exclusion leaks importers into the section under a false heading.\n- Absent sidecar renders NO section at all, never an empty one: silence must not read as 'nothing was edited with this file'.\n- The user-facing name is 'Edited together' everywhere: the gs heading, the graph viewer's relation label, `status`, the site docs and the agent guidance in coldstart.md and templates/. The graph viewer's label lives in scripts/graph-viewer/sphere.template.html and reaches src/graph/view-template.ts only via build-template.mjs, so a rename that skips that script silently leaves the old word in the shipped viewer.\n- BOTH cross-file sections — Edited together and Related — render in every gs view. Each was full-view-only once, and each time the miss surfaced the same way: a real session asked for `--view symbols` on a god-file, which is exactly when the other-file channels matter most. Only the sections describing THIS file (symbols/imports/importers/callers) are view-gated. Do not re-gate either one.\n- Both sections build their exclusion set from index.outEdges/inEdges, NOT from importsOut/importersShown. Both headings claim the pair carries no import edge, and that is only true if every graph neighbour is excluded — narrow views populate neither list, and full view's importer list is capped at IMPORTERS_LIST_CAP.","backlinks":["src-server-tools-ts-cb60011b"],"anchorLinks":["how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces","how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","src-cli-ts-c443bc51","src-index-manager-ts-e298456b","src-indexer-cochange-ts-87067890","src-server-mcp-ts-18031783","src-server-tools-ts-cb60011b","where-the-required-note-shape-is-defined-and-how-it-reaches"]},{"id":"scripts-graph-viewer-build-site-page-mjs-9bf323da","type":"file","character":"single","title":"scripts/graph-viewer/build-site-page.mjs","aliases":["site graph page generator","build-site-page","graph viewer site build","home link missing on graph page","MODULE_NOT_FOUND dist import"],"status":"active","updated":"2026-08-23T08:55:06.098Z","edits":1,"anchors":[{"path":"scripts/graph-viewer/build-site-page.mjs","symbols":["OUT","distImport","GRAPH_TEMPLATE"],"hash":"sha256:06a14e3a2f4e","state":"fresh"}],"freshness":"fresh","dir":"scripts/graph-viewer","outLinks":[],"body":"Generates the site's copy of the graph viewer by importing the BUILT dist/ modules (loadCachedIndex, loadCoChange, buildGraphPayload, renderGraphHtml, GRAPH_TEMPLATE), so `npm run build` must run first or it fails with MODULE_NOT_FOUND. Two constraints learned by getting them wrong: it passes an empty notes array, because the notebook is this repo's private working memory and note titles are not marketing copy; and it substitutes the home link into GRAPH_TEMPLATE BEFORE calling renderGraphHtml, since renderGraphHtml clears that slot for the standalone CLI page which has nowhere to link back to. Output is site-astro/src/graph-page.html, not public/, so an Astro route can serve /graph/ in dev.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-src-pages-graph-index-astro-797635e1","type":"file","character":"single","title":"site-astro/src/pages/graph/index.astro","aliases":["graph route","graph page astro","serve graph html","graph 404 in astro dev","public dir directory index 404"],"status":"active","updated":"2026-08-23T08:55:06.087Z","edits":1,"anchors":[{"path":"site-astro/src/pages/graph/index.astro","symbols":["html","raw"],"hash":"sha256:b3841695f407","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/pages/graph","outLinks":[],"body":"Serves /graph/ by inlining site-astro/src/graph-page.html (a complete standalone document with its own head, CSS and canvas script) via a ?raw import into a bare <Fragment set:html>. It exists as a ROUTE rather than as public/graph/index.html because `astro dev` serves public/ by exact path with no directory-index fallback: the file answered /graph/index.html and 404'd on /graph/, the URL the nav links to, while production resolved it fine — a dev-only break invisible in CI. Being a route also puts /graph/ in the sitemap. It strips the generated file's leading doctype because Astro emits its own ahead of the template.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-src-components-docssidebar-astro-93ed0ec3","type":"file","character":"single","title":"site-astro/src/components/DocsSidebar.astro","aliases":["docs sidebar","progressive disclosure sidebar","active group prop","empty sidebar section headers","group header with no items"],"status":"active","updated":"2026-08-23T08:55:06.073Z","edits":2,"anchors":[{"path":"site-astro/src/components/DocsSidebar.astro","symbols":["Props","groups",".gh-link","gh-link","is-active"],"hash":"sha256:114a6d940ca0","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/components","outLinks":[],"body":"Reusable docs sidebar: an `active` prop ('getting-started'|'navigation'|'notebook'|'under-the-hood') selects which group expands its anchor sub-list; other groups collapse to a single link. Only the ACTIVE group's label carries the `gh` class (uppercase, tracked, muted — docs.css `.side-group .gh`). Every group used to carry it, so on any page the three inactive groups rendered as section headers with nothing beneath them: headings labelling nothing. The `.gh-link` scoped override still exists and is load-bearing for a different reason — it cancels docs.css's global `.side a.active` pill so the active group header is not double-highlighted on top of the active sub-link's own pill.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs"]},{"id":"tests-cochange-test-ts-09288f99","type":"file","character":"single","title":"tests/cochange.test.ts","aliases":["cochange tests","git fixture repo","moves together tests","moves together test","deriveCoChange test","flaky only in full suite","vitest timeout leaks fixture state"],"status":"active","updated":"2026-08-23T08:55:06.059Z","edits":2,"anchors":[{"path":"tests/cochange.test.ts","symbols":["git","commit","makeIndex","gsText"],"hash":"sha256:df9963d3865c","state":"changed"}],"freshness":"changed","dir":"tests","outLinks":[],"body":"Covers deriveCoChange (the git walk) and the gs rendering of the Moves together section. Two things a future editor needs: the helpers `git`/`commit` take the repo dir as an explicit parameter and must keep doing so — they once read a module-level `repo` that each scratch-repo test swapped and restored, and when the ~90-commit partner-cap test overran vitest's 5s default under full-suite load vitest moved on while the swap was live, so later tests silently ran against the wrong repo and the suite failed only under load. That test now carries an explicit 60s timeout for the same reason. The rendering block asserts co-change appears in EVERY gs view and that import-graph neighbours stay excluded even in a view that lists neither imports nor importers.","backlinks":[],"anchorLinks":[]},{"id":"src-kb-view-ts-1fba6747","type":"file","character":"single","title":"src/kb/view.ts","aliases":["notebook view rewritten","index.html mtime churn","notebook view","wikilink graph","note graph edges","buildViewData","notebook viewer data","note graph links","shared anchor links","kb view html","empty note graph","nine nodes only","keeper overwrites index.html"],"status":"active","updated":"2026-08-23T07:09:22.385Z","edits":8,"anchors":[{"path":"src/kb/view.ts","symbols":["kbView","renderViewHtml","buildViewData","toClientNote","ignoreIndexHtml","openInBrowser","bodyMarkdown","ViewOptions","linkByAnchor"],"hash":"sha256:41ece77f27ac","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":["wikilinks"],"body":"Builds the baked JSON for `kb view` and writes/opens the notebook's index.html. The non-obvious part is linkByAnchor: the note graph used to draw ONLY hand-typed [[wikilinks]], and agents write almost none — on this repo that was 8 links across 108 notes, so the graph showed nine nodes. It now also links any two notes that anchor the same file, capped at 8 per note ordered by how many files they share, because one hub file with twenty notes on it is a 190-edge clique that says nothing. The write is content-conditional and `generated` is date-stamped rather than clock-stamped so identical notes render identical bytes; the keeper re-renders this file after every cache save, which means a stale dist/ will silently overwrite a freshly generated page until the keeper is restarted.","backlinks":[],"anchorLinks":[]},{"id":"src-graph-view-ts-9f9d75ac","type":"file","character":"single","title":"src/graph/view.ts","aliases":["graph view writer","self-contained html output","open in browser","graph html placeholder substitution","home link stripped","link back missing"],"status":"active","updated":"2026-08-23T07:09:22.374Z","edits":1,"anchors":[{"path":"src/graph/view.ts","symbols":["graphView","renderGraphHtml","noteAnchors","defaultGraphPath"],"hash":"sha256:88b3349a57cc","state":"changed"}],"freshness":"changed","dir":"src/graph","outLinks":[],"body":"The write-and-open half of `coldstart graph`: reads the notebook for note anchors, calls buildGraphPayload, bakes the result into GRAPH_TEMPLATE and writes a single self-contained HTML file (default `<root>/.coldstart/graph.html`), then opens it in the OS browser. renderGraphHtml escapes `<\/` inside the baked JSON so a path or note title containing a closing script tag cannot break out of the script block. It also substitutes `<!--__HOME_LINK__-->` with the empty string — the standalone CLI page has nowhere to link back to, so any caller that wants that link (the site build) must substitute it into the TEMPLATE before calling this.","backlinks":[],"anchorLinks":[]},{"id":"src-graph-dump-ts-043aa709","type":"file","character":"single","title":"src/graph/dump.ts","aliases":["graph payload builder","directory band assignment","adaptive clustering","relation kinds","codebase sphere data"],"status":"active","updated":"2026-08-23T07:09:22.362Z","edits":1,"anchors":[{"path":"src/graph/dump.ts","symbols":["assignClusters","buildGraphPayload","REL_IMPORT","REL_CALLS","REL_COEDIT","REL_NOTE"],"hash":"sha256:b74220e57359","state":"changed"}],"freshness":"changed","dir":"src/graph","outLinks":[],"body":"Turns an already-built index (plus the co-change sidecar and note anchors handed in by the caller) into the compact payload `coldstart graph` draws. Two things here are load-bearing and were both arrived at by getting them wrong: directory bands are chosen ADAPTIVELY by assignClusters (split any band over 13% one segment deeper, then fold slivers into a terminal 'other' that is itself allowed to stay small), because a fixed depth-2 cut put 1093 of arches's 1615 files in one band; and the named verbs on call edges come from aggregating index.symbolEdges per FILE PAIR, because every edge in index.edges is a plain import and carries no verb. This module deliberately loads nothing — no index build, no notebook read — so it stays a pure function that tests can drive.","backlinks":[],"anchorLinks":[]},{"id":"src-server-mcp-ts-18031783","type":"file","character":"single","title":"src/server/mcp.ts","aliases":["required note fields","no-shell client notes","TOOL_DEFINITIONS","mcp cli parity","kb_repair_aliases tool","offset browsing only","aliasesVerified closing move","MCP wiring","tool registration","handler dispatch","tool schema","long-lived server stale read","mcp tool missing section","stale sidecar in mcp"],"status":"active","updated":"2026-08-22T19:02:26.308Z","edits":9,"anchors":[{"path":"src/server/mcp.ts","symbols":["TOOL_DEFINITIONS","registerToolHandlers","missingFieldsWarning","flowStepsWarning","kb_repair_aliases"],"hash":"sha256:3f63d980bc9b","state":"changed"}],"freshness":"changed","dir":"src/server","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"MCP server tool registration and handler dispatch. TOOL_DEFINITIONS declares every tool (name, description, inputSchema); the CallToolRequestSchema switch dispatches by name to handlers that call shared engines and wrap results as {__rawText} for text or JSON. Adding a query command = one TOOL_DEFINITIONS entry + one case + a shared engine; REMOVING one means both, and the tool description too, since the description is the only place an MCP client learns a section exists. Verified 2026-08-23: unlike the CLI, this server is long-lived, so a sidecar it reads (co-change) must be re-loaded per call — a copy cached at startup goes stale the moment the keeper rewrites it on a branch switch.\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — kb_write description injects the required-fields line","backlinks":[],"anchorLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu","how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces","where-the-required-note-shape-is-defined-and-how-it-reaches"]},{"id":"src-cli-ts-c443bc51","type":"file","character":"single","title":"src/cli.ts","aliases":["CLI entry point","command routing","keeper spawning","cache read strategy","parseQueryArgs","reader loads sidecar"],"status":"active","updated":"2026-08-22T19:02:12.600Z","edits":3,"anchors":[{"path":"src/cli.ts","symbols":["runGs","runConsumers","getIndex","runFind","parseQueryArgs"],"hash":"sha256:e863c8636403","state":"changed"}],"freshness":"changed","dir":"src","outLinks":[],"body":"CLI command routing and execution — entry point for `find`, `gs`, `index`, `consumers`, and `kb`. Key pattern: runGs calls ensureKeeper before the cache load (keeps the index fresh for uncommitted edits) while runConsumers loads the cache directly with no keeper (pure read for capture hooks); the choice turns on whether the command needs live freshness. runGs also loads the co-change sidecar itself and passes it into handleGetStructure — reader-side, because handleGetStructure cannot reach disk. parseQueryArgs is a flat switch over every flag any subcommand accepts, so a flag added for one command is silently accepted by all of them; removing a command means removing its flags here too or they linger as dead accepted input.","backlinks":[],"anchorLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu","how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces"]},{"id":"src-status-ts-8c69c9ca","type":"file","character":"single","title":"src/status.ts","aliases":["npm update didn't take","update not picked up","keeper running old version","install health","wired hook path missing","version drift","moves-together not derived","gs shows no moves together","co-change silent shallow clone"],"status":"active","updated":"2026-08-22T19:02:12.589Z","edits":5,"anchors":[{"path":"src/status.ts","symbols":["runStatus","wiredHookPaths","indexFreshness","deriveRoot","relativeAge","fileSize"],"hash":"sha256:d9ea936f4f43","state":"changed"}],"freshness":"changed","dir":"src","outLinks":[],"body":"Renders `coldstart status`: a network-free table of every keeper (liveness via lockfile PID check, index freshness from cache meta.json mtime, keeper-state.json/repair.jsonl activity). The install-health section diagnoses the 'npm update didn't take' class — it compares each keeper's lock version to getCurrentVersion() and flags drift with a `coldstart restart` remedy, and via wiredHookPaths() scans .claude/settings.json as RAW TEXT (structure-agnostic regex for /…/hooks/<name>.mjs) to flag dangling wired hook paths with a `coldstart init` remedy. The per-root activity block also prints a moves-together line (2026-08-23) for a specific reason: co-change is silent on shallow clones and non-git dirs, and without a line saying how many commits were scanned that silence is indistinguishable from a bug.","backlinks":[],"anchorLinks":[]},{"id":"src-index-manager-ts-e298456b","type":"file","character":"single","title":"src/index-manager.ts","aliases":["keeper regenerates view","notes refresh HTML","kb-notes sidecar","auto mechanical symbol repair","mechanicalRepairStreak","auto symbol backfill keeper","MAX_AUTO_REPAIR_STREAK","sidecar refresh hook","autoMechanicalSymbolRepair","keeper sidecar refresh","refreshCoChange","co-change keyed on HEAD","auto repair silently off","keeper stopped backfilling"],"status":"active","updated":"2026-08-22T19:02:12.568Z","edits":6,"anchors":[{"path":"src/index-manager.ts","symbols":["IndexManager","refreshKbNotesIndex","regenerateKbViewIfPresent","handleNotebookRawBatch","handleBatch","triggerRebuild","scheduleCacheSave","auditFingerprints","startCacheWatcher","startWatching","scheduleRebuildRetry","IndexContext","autoMechanicalSymbolRepair","MAX_AUTO_REPAIR_STREAK","refreshCoChange"],"hash":"sha256:cb324edbaeb8","state":"changed"}],"freshness":"changed","dir":"src","outLinks":[],"body":"Keeper state machine: watch, patch-vs-rebuild, atomic cache save, plus the notebook sidecar refresh and (2026-08-23) the co-change sidecar refresh. autoMechanicalSymbolRepair fires right after every kb-notes-index rebuild and passes the just-built sidecar in memory; its MAX_AUTO_REPAIR_STREAK=3 guard is one-way — once the streak reaches the cap the method returns before running, so the pass that would reset it never happens and auto-backfill stays off for the keeper's lifetime (safe direction, now logged once naming `coldstart kb repair`). refreshCoChange is deliberately keyed on git HEAD rather than on the debounced file batch: history only changes when a commit lands, so re-walking on every patch would burn ~600ms for a byte-identical result. It is called from startWatching (seed) and from inside scheduleCacheSave's getGitHead().then, which is the one place the keeper already knows HEAD moved.","backlinks":[],"anchorLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu"]},{"id":"src-indexer-invariants-ts-7c3ad34a","type":"file","character":"single","title":"src/indexer/invariants.ts","aliases":["invariant lint","index corruption check","lintIndexInvariants","rebuild trigger","constant rebuilds","index keeps rebuilding"],"status":"active","updated":"2026-08-22T17:11:07.187Z","edits":1,"anchors":[{"path":"src/indexer/invariants.ts","symbols":["lintIndexInvariants","assertedFile"],"hash":"sha256:f1ad4a72cd14","state":"fresh"}],"freshness":"fresh","dir":"src/indexer","outLinks":[],"body":"Post-patch structural lint whose output is a rebuild trigger, not a warning — so any check it fails must be fixable by rebuilding, or the keeper loops. assertedFile encodes that trade-off explicitly: bare extends/implements targets are exempt from the file-existence check because flagging them would make every repo with inheritance rebuild forever, and the same reasoning applies to any new edge kind whose endpoints are not guaranteed to be indexed files.","backlinks":[],"anchorLinks":["how-synthetic-edges-stay-alive-across-incremental-patches"]},{"id":"src-indexer-patch-ts-d18fe20b","type":"file","character":"single","title":"src/indexer/patch.ts","aliases":["incremental patch","patchIndex","index patching","changed file batch","stale edges after edit","synthetic edges missing after patch"],"status":"active","updated":"2026-08-22T17:11:07.177Z","edits":1,"anchors":[{"path":"src/indexer/patch.ts","symbols":["patchIndex"],"hash":"sha256:c7955d82d0b1","state":"fresh"}],"freshness":"fresh","dir":"src/indexer","outLinks":[],"body":"Incremental index patcher: pre-plans delete/update/skip for the whole batch before mutating anything, so a parse failure never strips a file's existing state. Its synthetic-edge re-derivation at the end is language-gated — each family only re-runs when a file of its language changed — which is what keeps derived edges alive across edits and also what would silently skip a family driven by a non-source input.","backlinks":[],"anchorLinks":["how-synthetic-edges-stay-alive-across-incremental-patches"]},{"id":"how-synthetic-edges-stay-alive-across-incremental-patches","type":"flow","character":null,"title":"how synthetic edges stay alive across incremental patches","aliases":["synthetic edges","rails synthetic edges","edge re-derivation","patch symbol edges","changedLangs gate","edges disappear after edit","endless rebuild loop","edge points at deleted file"],"status":"active","updated":"2026-08-22T17:11:07.149Z","edits":1,"anchors":[{"path":"src/indexer/patch.ts","hash":"sha256:c7955d82d0b1","state":"fresh"},{"path":"src/indexer/invariants.ts","hash":"sha256:f1ad4a72cd14","state":"fresh"}],"freshness":"fresh","dir":"src/indexer","outLinks":[],"body":"Synthetic edges are never stored in the index — they are re-derived from scratch on every build AND every incremental patch, which is the only reason they survive an edit at all, because patchIndex replaces a changed file's symbolEdges wholesale and strips both directions of its flat edges on delete. The re-derivation inside patch is gated on the CHANGED FILE'S LANGUAGE (changedLangs.has('ruby') etc.), so any future synthetic-edge family whose input is not a source file of that language — e.g. one derived from the notebook — would never be refreshed by an ordinary code edit and needs its own trigger. A synthetic edge whose endpoint file no longer exists is not merely ignored: lintIndexInvariants check 3 reports it and the keeper queues a full rebuild, and since a rebuild re-runs the same derivation, a derivation that keeps emitting a dead endpoint rebuilds forever. Derivations must therefore filter endpoints against index.files themselves.\n\n## Steps\n\n1. `src/indexer/patch.ts` (`patchIndex`) — replaces a changed file's symbol edges wholesale, then re-runs each synthetic-edge family gated on the changed languages\n2. `src/indexer/invariants.ts` (`lintIndexInvariants`, `assertedFile`) — flags any symbol edge whose asserted file side is absent from index.files; a violation makes the keeper rebuild\n\n## Invariants\n\n- Synthetic edges are a derivation, never persisted data — anything written into the index by hand is wiped on the next patch of that file.\n- Every synthetic-edge derivation must drop endpoints not present in index.files, or invariant check 3 turns into a rebuild loop.\n- assertedFile deliberately exempts bare extends/implements targets from the existence check; only refs carrying a '#' (and the exports edge's from-side) assert a file.","backlinks":[],"anchorLinks":["src-indexer-invariants-ts-7c3ad34a","src-indexer-patch-ts-d18fe20b"]},{"id":"src-kb-lookup-ts-772ecb1e","type":"file","character":"single","title":"src/kb/lookup.ts","aliases":["notebook query","kb lookup","flow step resolution","flow anchoring","flow-note bridging","anchor derivation"],"status":"active","updated":"2026-08-18T13:32:29.093Z","edits":1,"anchors":[{"path":"src/kb/lookup.ts","symbols":["kbLookup","LookupFlowHit"],"hash":"sha256:e38615ce2a2b","state":"fresh"}],"freshness":"fresh","dir":"src/kb","outLinks":[],"body":"Query interface for the notebook at a specific file-or-symbol address. The `kbLookup` function returns everything anchored there: file notes (facets, features, character), flow notes with their step positions, and lessons—all with live freshness stamps. Flow note anchors are derived at query time from flow steps, so backlinks never go stale. Flow notes bridge files the code graph cannot connect (same tmpdir, hand-typed names, convention-only links), operationalizing the design rule that notebook is the source of truth for runtime/data/convention-only edges.","backlinks":[],"anchorLinks":[]},{"id":"how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces","type":"flow","character":null,"title":"how to wire a new query command to both CLI and MCP surfaces","aliases":["add query command","CLI MCP wiring","dual-surface query pattern"],"status":"active","updated":"2026-08-18T13:26:14.581Z","edits":1,"anchors":[{"path":"src/cli.ts","hash":"sha256:98bdb7bfb4d0","state":"changed"},{"path":"src/server/tools.ts","hash":"sha256:5a3326747281","state":"changed"},{"path":"src/server/find.ts","hash":"sha256:ec1c7ebf22d1","state":"changed"},{"path":"src/server/mcp.ts","hash":"sha256:f8995189f3a1","state":"changed"},{"path":"src/index.ts","hash":"sha256:d4b06f304d61","state":"changed"}],"freshness":"changed","dir":"src","outLinks":[],"body":"To add a new query command (e.g., `trace`), implement a shared engine returning {__rawText} that both CLI and MCP call through thin wrappers. The pattern: CLI registration in main() → parse args → load cache → call shared engine → emit __rawText; MCP registration in TOOL_DEFINITIONS + CallToolRequestSchema → parse params → call shared engine → wrap __rawText in MCP response. This ensures identical results on both surfaces from one implementation.\n\n## Steps\n\n1. `src/cli.ts` (`runFind`, `runGs`, `getIndex`) — CLI wrapper: parseQueryArgs, load cache, call shared engine, print __rawText\n2. `src/server/tools.ts` (`handleFind`, `handleGetStructure`) — MCP adapter: calls shared engines, wraps __rawText in response object\n3. `src/server/find.ts` (`buildRichPage`) — shared engine (find): business logic, returns __rawText\n4. `src/server/mcp.ts` (`TOOL_DEFINITIONS`, `registerToolHandlers`) — MCP registration: tool schema definition and CallToolRequestSchema case handler\n5. `src/index.ts` (`main`, `makeCacheReader`) — entry dispatch: subcommand check for CLI, cache reader factory for MCP\n\n## Invariants\n\n- Every query command's shared engine returns {__rawText: string} with optional {error: string}\n- CLI: emit __rawText directly to stdout; MCP: wrap unchanged in content[0].text\n- Cache loading: getIndex (CLI, per-query) vs makeCacheReader (MCP, long-lived with mtime polling)","backlinks":[],"anchorLinks":["how-the-moves-together-signal-reaches-gs-without-going-throu","src-cli-ts-c443bc51","src-index-ts-c5fb8502","src-server-find-ts-d168bf57","src-server-mcp-ts-18031783","src-server-tools-ts-cb60011b","where-the-required-note-shape-is-defined-and-how-it-reaches"]},{"id":"src-server-find-ts-d168bf57","type":"file","character":"hub","title":"src/server/find.ts","aliases":["why does find not show my note","note exists but find did not surface it","buildNoteMap path keyed","find notebook lane","ranking algorithm","term scoring"],"status":"active","updated":"2026-08-18T13:25:59.595Z","edits":4,"anchors":[{"path":"src/server/find.ts","symbols":["buildNoteMap","noteLine","buildRichPage","convergencePreview","collectCoverage","firstSentence","parseTerms","pickSearcher","computeImportRelations","docFreq"],"hash":"sha256:ec1c7ebf22d1","state":"changed"}],"freshness":"changed","dir":"src/server","outLinks":[],"body":"find's notebook lane is PATH-KEYED, not query-keyed: buildNoteMap() iterates active notes and maps anchor path -> note, so a note can only ever surface if its anchor file ALREADY ranked in find's code-side results. The query terms are used solely to break ties on hub files that anchor several notes (the `hits` count on the note's title+aliases+facet symbols), never to admit a note. Consequence verified 2026-07-28: a note whose file find does not rank is invisible to find no matter how strongly the note matches -- measured on 16 relevant hook injections, 7 (44%) anchored to a file find did NOT rank on the same terms (e.g. prompt words 'images beyond text maybe increase' -> site/docs.css, which contains no matching code token). The prompt-time recall hook, not find, is what reaches those. noteLine() renders the inline 'Summary:' at the read-decision point deliberately (ruling recorded at find.ts:457) -- do not hoist notes into a header block.\n\n## Facets\n\n- **buildNoteMap** — PATH-KEYED: iterates active notes and maps anchor path -> note. A note can only surface if its anchor file ALREADY ranked in find's code-side results. Query terms used only to break ties on hub files (hits count on title+aliases+facet symbols), never to admit a note. Consequence: a file find does not rank is invisible to find no matter how strongly the note matches.\n- **buildRichPage** — Lines 553–932: Main entry point. Calls collectCoverage() for term matching (body+name+path), then score() to rank candidates. score() (lines 588–603) = (term_coverage_set.size × 3) + (separator-folded name/path match weight / maxIdf). Ranking: idf (BM25-style log rarity) weights symbol name matches (NAME_W=3) and path matches (PATH_W=2). Re-rankable for frontier traversal via idf(), docFreq(), term coverage sets, separator-folded matching (foldSep strips -_).\n- **collectCoverage** — Lines 260–321: Returns Map<fileId, Set<queryTerms>>. External searchers (rg/git grep/grep) for body-content matches (lines 271–292) + symbol name/path index matches (lines 304–319). Node fallback reads indexed files.\n- **convergencePreview** — Lines 379–456: Scores matched lines by rarity-weighted LOCAL CONVERGENCE—sum of 1/DF over distinct query terms within ±WINDOW lines. Import lines boosted (1.5×). Clusters kept hits by proximity, ranked by peak score. Returns line-level evidence for file preview.","backlinks":[],"anchorLinks":["how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces"]},{"id":"src-index-ts-c5fb8502","type":"file","character":"hub","title":"src/index.ts","aliases":["command hangs","unknown command","MCP reader boots unexpectedly","command dispatch","graph building","index accumulation"],"status":"active","updated":"2026-08-18T13:25:59.573Z","edits":5,"anchors":[{"path":"src/index.ts","symbols":["main","buildIndex"],"hash":"sha256:d4b06f304d61","state":"changed"}],"freshness":"changed","dir":"src","outLinks":[],"body":"## Facets\n\n- **main** — Dispatch order is load-bearing, not stylistic. Everything past the subcommand block is treated as a flag-driven invocation (--daemon / --no-daemon / --probe / the default stdio MCP reader), and the unknown-command guard deliberately rejects only a first arg that does NOT start with '-'. So any bare flag falls through and BOOTS THE MCP READER. Fixed by handling --version/-v and --help/-h first by exact match.\n- **buildIndex** — Lines 221–223: allSymbolEdgesBuilt = buildSymbolEdges() accumulates into symbolEdges array, then assigned to CodebaseIndex.symbolEdges at line 274. Lines 225–268: isBarrel flag set on TS/JS files (reexportRatio > 0.5 && importedByCount > 1 && exports.length > 0), then domain-map cleaned and transitiveImportedByCount computed for graph traversal. These setup cycle-guard structures: isBarrel + reexportRatio + transitiveImportedByCount are load-bearing for traversal algorithms that need to bypass re-export hubs.","backlinks":[],"anchorLinks":["how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces"]},{"id":"src-indexer-symbol-edges-ts-907b1d63","type":"file","character":"single","title":"src/indexer/symbol-edges.ts","aliases":["edge building","call resolution","symbol edge creation","bare-name edges dropped"],"status":"active","updated":"2026-08-18T13:25:59.561Z","edits":1,"anchors":[{"path":"src/indexer/symbol-edges.ts","symbols":["buildSymbolEdges"],"hash":"sha256:8c0cbcb23ac3","state":"fresh"}],"freshness":"fresh","dir":"src/indexer","outLinks":[],"body":"Builds symbol-level edges (calls/extends/implements/exports) by resolving call targets against imported files' exports. Critical: unresolvable bare-name 'calls' edges are dropped as noise (line 100–102) because query-time lookups use qualified symbolIds and bare names never match. Call resolution: Pass 1 tests direct export match; Pass 2 tests suffix match (Java 'Class.method', Ruby 'Module::Class') across qualified exports. Extends/implements bare names are kept (resolved at query time).","backlinks":[],"anchorLinks":[]},{"id":"src-types-ts-cdcae080","type":"file","character":"single","title":"src/types.ts","aliases":["edge types","SymbolEdge interface","IndexedFile structure","edge model"],"status":"active","updated":"2026-08-18T13:25:59.526Z","edits":1,"anchors":[{"path":"src/types.ts","symbols":["SymbolEdgeType","SymbolEdge","IndexedFile","CodebaseIndex"],"hash":"sha256:ad5ba9213feb","state":"fresh"}],"freshness":"fresh","dir":"src","outLinks":[],"body":"Defines the edge types, SymbolEdge/Edge interfaces, and IndexedFile structure that all traversal and indexing logic builds on. SymbolEdge carries from/to (qualified symbolId or fileId), type (calls/extends/implements/exports), and optional line number. IndexedFile holds symbols, exports, isBarrel flag, reexportRatio, and importedByCount—these are load-bearing for cycle guards and barrier detection in graph traversal.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-src-pages-docs-under-the-hood-astro-9d2b1520","type":"file","character":"single","title":"site-astro/src/pages/docs/under-the-hood.astro","aliases":["under the hood docs page","supported languages section","lifecycle commands docs"],"status":"active","updated":"2026-08-16T16:51:41.613Z","edits":2,"anchors":[{"path":"site-astro/src/pages/docs/under-the-hood.astro","symbols":["#freshness","#lifecycle","#mcp","#languages"],"hash":"sha256:7eeb7e9309f7","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/pages/docs","outLinks":[],"body":"One of the 4 docs sub-pages: covers index freshness (with the inline architecture SVG), lifecycle commands, MCP tool exposure, bring-your-own-semantics, and supported languages. The language chips (.langs/.chip) previously had a .chip.hot tier arbitrarily coloring some languages blue with no explanation — removed so all chips render uniformly. Its closing sidebar-highlight script is one of 4 duplicated copies, now scroll-position-based rather than IntersectionObserver-based (see flow: docs pages share a hand-duplicated sidebar scrollspy script, not an import).","backlinks":[],"anchorLinks":["docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs"]},{"id":"site-astro-src-pages-docs-navigation-astro-e37c5fa9","type":"file","character":"single","title":"site-astro/src/pages/docs/navigation.astro","aliases":["docs navigation","find command reference","gs command reference","docs sub-page"],"status":"active","updated":"2026-08-16T16:51:41.602Z","edits":3,"anchors":[{"path":"site-astro/src/pages/docs/navigation.astro","symbols":["techArticleJsonLd"],"hash":"sha256:76baa0869608","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages/docs","outLinks":[],"body":"Docs sub-page for coldstart find and gs commands. Follows docs.astro template: frontmatter imports (Head, SvgDefs, Nav, Footer, DocsSidebar), TechArticle JSON-LD, two doc sections (#find and #gs) with command signature, terminal examples, flags, and callouts. DocsSidebar uses active=\"navigation\". Its closing sidebar-highlight script is one of 4 duplicated copies, now scroll-position-based rather than IntersectionObserver-based (see flow: docs pages share a hand-duplicated sidebar scrollspy script, not an import).","backlinks":[],"anchorLinks":["docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs"]},{"id":"site-astro-src-pages-docs-notebook-astro-474cc129","type":"file","character":"single","title":"site-astro/src/pages/docs/notebook.astro","aliases":["notebook docs","kb reference","docs sub-page template"],"status":"active","updated":"2026-08-16T16:51:41.586Z","edits":3,"anchors":[{"path":"site-astro/src/pages/docs/notebook.astro","symbols":["techArticleJsonLd"],"hash":"sha256:b28346763f30","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/pages/docs","outLinks":[],"body":"Notebook reference page. Section ids (notebook, kb-search, kb-lookup, kb-write, kb-commit, kb-view, kb-maint, sharing) are linked by DocsSidebar and must be preserved. Trimmed this session: the 'why it can be trusted' bullet list, capture-internals detail (worklist lifecycle, per-agent keying), and a marketing callout were cut or condensed — that rationale now lives only a
