t /how-it-works/notebook/, linked from this page instead of duplicated inline. The closing sidebar-highlight script is a scroll-position check, not IntersectionObserver — it's copied verbatim into 3 other docs pages (see flow: docs pages share a hand-duplicated sidebar scrollspy script, not an import).","backlinks":[],"anchorLinks":["docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script"]},{"id":"site-astro-src-pages-docs-astro-d1cf6fe9","type":"file","character":"single","title":"site-astro/src/pages/docs.astro","aliases":["docs page","structured data","brand terminology binding","docs landing page"],"status":"active","updated":"2026-08-16T16:51:41.575Z","edits":5,"anchors":[{"path":"site-astro/src/pages/docs.astro","symbols":["techArticleJsonLd","doc-sec#notebook","doc-sec#freshness","overview","install","flow","next"],"hash":"sha256:9faa0af4d67d","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages","outLinks":[],"body":"Docs landing page — sidebar reference layout on docs.css, with its own TechArticle JSON-LD and its own Google Fonts <link> block (not centralised in Head.astro). Sections are #overview, #install, #flow, #next; #next's fcards link out to the 3 docs sub-pages (navigation, notebook, under-the-hood) — there is no #notebook or #freshness section on this page itself, that content lives in the sub-pages now. Inline links in docs prose are styled per-link with style=\"color:var(--frost)\" — there is no link class in docs.css. Its closing sidebar-highlight script is one of 4 duplicated copies (see flow: docs pages share a hand-duplicated sidebar scrollspy script, not an import).","backlinks":[],"anchorLinks":["docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","type":"flow","character":null,"title":"docs pages share a hand-duplicated sidebar scrollspy script, not an import","aliases":["docs sidebar scrollspy script","sidebar active section highlight","duplicated docs script","docs sidebar highlight mechanism","last sidebar item never highlighted","sidebar highlight stuck wrong item","docs sidebar highlight bug"],"status":"active","updated":"2026-08-16T16:51:41.501Z","edits":1,"anchors":[{"path":"site-astro/src/pages/docs.astro","hash":"sha256:9faa0af4d67d","state":"changed"},{"path":"site-astro/src/pages/docs/navigation.astro","hash":"sha256:76baa0869608","state":"changed"},{"path":"site-astro/src/pages/docs/notebook.astro","hash":"sha256:b28346763f30","state":"fresh"},{"path":"site-astro/src/pages/docs/under-the-hood.astro","hash":"sha256:7eeb7e9309f7","state":"fresh"}],"freshness":"changed","dir":"site-astro/src/pages","outLinks":[],"body":"The sidebar active-section highlight script on the 4 docs pages (docs.astro, docs/navigation.astro, docs/notebook.astro, docs/under-the-hood.astro) is copy-pasted verbatim into each page's own closing <script> block, not extracted into a shared component or module — so any behavior change or bug fix has to be hand-applied to all 4 files identically. Verified this session while fixing a bug where the previous IntersectionObserver version (rootMargin '-70px 0px -70% 0px', i.e. a trigger band covering only the top ~30% of the viewport) never highlighted the LAST section's sidebar link on normal/large screens: a short last section's heading could stop being scrolled toward (footer below it, or the user simply stopping once it's comfortably in view) before its top ever crossed into that narrow band. Replaced the mechanism in all 4 files with a scroll/resize-driven position check that walks sections top-to-bottom and marks active the last one whose top has crossed a fixed offset line (70px + 30% of viewport height) — same visual trigger point as before, but not dependent on an element re-entering a band, so the last section reliably activates once scrolled to, regardless of footer height or viewport size.\n\n## Steps\n\n1. `site-astro/src/pages/docs.astro` (`setActive`) — one of 4 duplicate copies of the scrollspy script\n2. `site-astro/src/pages/docs/navigation.astro` (`setActive`) — duplicate copy\n3. `site-astro/src/pages/docs/notebook.astro` (`setActive`) — duplicate copy\n4. `site-astro/src/pages/docs/under-the-hood.astro` (`setActive`) — duplicate copy\n\n## Invariants\n\n- The script is not shared via import or component — changing scrollspy behavior means editing all 4 files identically, or a future page will silently regress.\n- The offset (70px + 30% of viewport height) intentionally mirrors the old IntersectionObserver's visual crossing point, so the highlight timing feels unchanged even though the mechanism is now scroll-position-based, not intersection-based.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","site-astro-has-two-independent-stylesheets-that-must-be-hand","site-astro-src-pages-docs-astro-d1cf6fe9","site-astro-src-pages-docs-navigation-astro-e37c5fa9","site-astro-src-pages-docs-notebook-astro-474cc129","site-astro-src-pages-docs-under-the-hood-astro-9d2b1520"]},{"id":"scripts-win-repro-detachedlauncher-cs-2d8b5bf1","type":"file","character":"single","title":"scripts/win-repro/DetachedLauncher.cs","aliases":["DETACHED_PROCESS launcher","Win32 CreateProcess repro","hooks-shape console repro","hooks flash confirmed fixed","DETACHED_PROCESS resolves inconclusive repro"],"status":"active","updated":"2026-08-11T05:36:34.763Z","edits":1,"anchors":[{"path":"scripts/win-repro/DetachedLauncher.cs","symbols":["Main"],"hash":"sha256:e65597a5876f","state":"fresh"}],"freshness":"fresh","dir":"scripts/win-repro","outLinks":[],"body":"Replaces an earlier launcher (NoConsoleLauncher.cs, deleted) that used .NET's ProcessStartInfo.CreateNoWindow and produced an inconclusive A/B (no flash in either branch, since CreateNoWindow leaves a hidden-but-attached console that a grandchild process just reuses). This launcher calls Win32 CreateProcess directly with the real DETACHED_PROCESS flag (0x00000008), giving the launched node.exe genuinely no console object at all — the actual condition an Electron app's (Claude Code/Cursor) hooks/*.mjs child process runs under. Verified on real Windows 11 hardware: unpatched shows a new console window, patched shows nothing, confirmed by both the automated IsWindowVisible poll and direct visual observation.","backlinks":[],"anchorLinks":[]},{"id":"scripts-win-repro-watch-ps1-7c70124a","type":"file","character":"single","title":"scripts/win-repro/watch.ps1","aliases":["windowsHide repro driver","IsWindowVisible watcher","Run-Case"],"status":"active","updated":"2026-08-11T05:36:34.734Z","edits":3,"anchors":[{"path":"scripts/win-repro/watch.ps1","symbols":["Run-Case"],"hash":"sha256:f5632bae5e65","state":"fresh"}],"freshness":"fresh","dir":"scripts/win-repro","outLinks":[],"body":"PowerShell driver for the #149 A/B repro flow: compiles DetachedLauncher.cs via csc.exe, then Run-Case runs 4 cases (unpatched/patched daemon-shape via orchestrator.mjs, unpatched/patched hooks-shape by launching DetachedLauncher.exe directly) and polls the real Win32 IsWindowVisible API. Both pairs now produce a confirmed flash/no-flash split — the earlier winexe+CreateNoWindow launcher (NoConsoleLauncher.cs/orchestrator-noconsole.mjs, both since deleted) gave an inconclusive result and was replaced by DetachedLauncher.cs, which uses the real Win32 DETACHED_PROCESS flag instead. See the flow note for the full root-cause story.","backlinks":[],"anchorLinks":["how-the-149-windowshide-a-b-repro-verifies-windows-console-f"]},{"id":"github-workflows-verify-149-windows-hide-yml-9fbe00a7","type":"file","character":"single","title":".github/workflows/verify-149-windows-hide.yml","aliases":["#149 verification workflow","windows-latest repro job"],"status":"active","updated":"2026-08-11T05:36:34.722Z","edits":3,"anchors":[{"path":".github/workflows/verify-149-windows-hide.yml","hash":"sha256:50753c85a820","state":"fresh"}],"freshness":"fresh","dir":".github/workflows","outLinks":[],"body":"Windows-latest CI workflow driving the #149 windowsHide A/B repro (see flow note), shipped in PR #151 (merged into main). workflow_dispatch-only — a branch-scoped push trigger was used temporarily to iterate before this was on the default branch, and was removed once the PR was ready. Now carries an explicit `permissions: contents: read` block, added to resolve a CodeQL 'missing-workflow-permissions' finding raised on the PR (the job only checks out code and runs a local script, so read-only contents access is sufficient).","backlinks":[],"anchorLinks":["how-the-149-windowshide-a-b-repro-verifies-windows-console-f"]},{"id":"how-the-149-windowshide-a-b-repro-verifies-windows-console-f","type":"flow","character":null,"title":"how the #149 windowsHide A/B repro verifies Windows console-flash on CI and real hardware","aliases":["windowsHide repro","windows-latest A/B test","console flash verification","how the #149 windowsHide A/B repro verifies Windows console-flash on CI","DETACHED_PROCESS launcher","hooks flash confirmed fixed","CreateNoWindow false negative","DETACHED_PROCESS resolves inconclusive repro"],"status":"active","updated":"2026-08-11T05:36:34.697Z","edits":3,"anchors":[{"path":".github/workflows/verify-149-windows-hide.yml","hash":"sha256:50753c85a820","state":"fresh"},{"path":"scripts/win-repro/orchestrator.mjs","hash":"sha256:af1639e9fed1","state":"fresh"},{"path":"scripts/win-repro/harness.mjs","hash":"sha256:1186af440d49","state":"fresh"},{"path":"scripts/win-repro/watch.ps1","hash":"sha256:f5632bae5e65","state":"fresh"},{"path":"scripts/win-repro/orchestrator-noconsole.mjs","hash":"sha256:43cbb5390ab5","state":"missing"},{"path":"scripts/win-repro/NoConsoleLauncher.cs","hash":"sha256:c8b642b5d6de","state":"missing"}],"freshness":"missing","dir":".github/workflows","outLinks":[],"body":"A windows-latest CI workflow (workflow_dispatch-only, now with an explicit `permissions: contents: read` block) empirically confirms whether a child_process option shape flashes a visible console window by polling the real Win32 IsWindowVisible API, and this now works for BOTH shapes coldstart needed to prove: the daemon/CLI shape (Node's own detached:true spawn, matching keeper.js's self-relaunch) AND the hooks/*.mjs shape (a plain child of a console-less Electron host like Claude Code/Cursor). The hooks shape required two failed attempts before landing: a GUI-subsystem (winexe) launcher using .NET's ProcessStartInfo.CreateNoWindow gave the intermediate node.exe a HIDDEN-but-still-attached console rather than none, so its own child (ping.exe) just reused that hidden console regardless of windowsHide — an inconclusive A/B (no flash in either branch). The fix was DetachedLauncher.cs, which calls Win32 CreateProcess directly with the real DETACHED_PROCESS flag (0x8), giving the child genuinely no console object. Under that condition the split is exactly as expected: unpatched flashes, patched doesn't. Confirmed both by the automated IsWindowVisible poll and direct human visual observation on real Windows 11 hardware — this closes the 'hooks shape not independently proven' gap and the fix shipped as part of PR #151 (merged).\n\n## Steps\n\n1. `.github/workflows/verify-149-windows-hide.yml` — windows-latest job entry point; workflow_dispatch-only, now scoped to `permissions: contents: read` (added to address a CodeQL missing-workflow-permissions finding on PR #151)\n2. `scripts/win-repro/orchestrator.mjs` — spawns harness.mjs via Node's detached:true+stdio:'ignore' spawn, mirroring keeper.js's own self-relaunch shape — proven mechanism for the daemon-shape A/B\n3. `scripts/win-repro/harness.mjs` — runs execFileSync with the option shape under test, with or without windowsHide\n4. `scripts/win-repro/DetachedLauncher.cs` (`Main`) — replaces the earlier CreateNoWindow-based launcher; calls Win32 CreateProcess directly with DETACHED_PROCESS so the launched node.exe has genuinely no console object — the actual condition hooks/*.mjs runs under when spawned by a console-less GUI host. This is what finally produced a clean, confirmed flash/no-flash split for the hooks shape\n5. `scripts/win-repro/watch.ps1` (`Run-Case`) — compiles DetachedLauncher.cs via csc.exe, then polls Win32 IsWindowVisible before/after each of the 4 cases (2 daemon-shape via orchestrator.mjs + 2 hooks-shape via DetachedLauncher.exe directly)\n\n## Invariants\n\n- workflow_dispatch only lets you trigger workflows already present on the default branch (GitHub platform restriction, confirmed via a live 404) — a temp verification workflow scoped to a feature branch must use `on: push: branches: [<branch>]` instead\n- the cleanup step between A/B cases must never Stop-Process match conhost/WindowsTerminal/OpenConsole broadly — those can back the runner's own pwsh session; killing them crashed the very next `node` invocation with a console-pipe error. Only kill the actual test straggler (e.g. ping.exe) by name\n- workflow_dispatch only lets you trigger workflows already present on the default branch (GitHub platform restriction, confirmed via a live 404) — iterate with a branch-scoped push trigger pre-merge, then drop it once merged\n- a console-flash A/B test only proves something when the code under test is the FIRST thing to request a console in the whole ancestor chain — Node's detached:true spawn (used unpatched, held constant across the A/B pair) satisfies this for the daemon shape, but layering ANY additional console-suppression (CreateNoWindow=true on an intermediate hop, or just launching through an already-console-having process like pwsh) gives that intermediate process a console — hidden or inherited — which then absorbs any downstream child's console need regardless of that child's own windowsHide setting, making the A/B pair indistinguishable\n- workflow_dispatch only lets you trigger workflows already present on the default branch (GitHub platform restriction) — iterate with a branch-scoped push trigger pre-merge, then drop it once merged\n- a console-flash A/B test only proves something when the code under test is the FIRST thing to request a console in the whole ancestor chain — CreateNoWindow (.NET ProcessStartInfo) suppresses the WINDOW but still leaves a hidden console object attached, which downstream children silently reuse; only the raw Win32 DETACHED_PROCESS flag via CreateProcess gives a child genuinely zero console, which is the condition that makes the A/B pair distinguishable\n- run watch.ps1 with pwsh (PowerShell 7+), not Windows PowerShell 5.1 — the file is UTF-8 without a BOM (em-dashes in comments), and powershell.exe reads no-BOM files using the system codepage, mangling those bytes and breaking parsing","backlinks":[],"anchorLinks":["github-workflows-verify-149-windows-hide-yml-9fbe00a7","scripts-win-repro-harness-mjs-c2b8facb","scripts-win-repro-orchestrator-mjs-599e3c8d","scripts-win-repro-watch-ps1-7c70124a"]},{"id":"hooks-elicit-core-mjs-f3f159c1","type":"file","character":"single","title":"hooks/elicit-core.mjs","aliases":["shared elicit helpers","pending file handoff","worklist annotations","fail open annotation"],"status":"active","updated":"2026-08-11T04:28:44.606Z","edits":5,"anchors":[{"path":"hooks/elicit-core.mjs","symbols":["worklistEntries","noteAnnotations","consumerCounts","freshNotedSet","gitHead","logCaptureEvent","writePendingCapture","takePendingCapture","pendingPath","MAX_WORKLIST"],"hash":"sha256:cdd69e058357","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Host-neutral v5 capture helpers shared by all three elicit hooks AND the recall hooks: worklist annotation (kb status --json --paths + coldstart consumers --json, both fail-open to no-annotation), fresh-noted discount set, git-HEAD fingerprint, capture metrics (capture.jsonl), and the pending-capture handoff (writePendingCapture/takePendingCapture, one file per session id, 24h TTL). Consumed via relative import from sibling hook files — invisible to the TS import graph, which is why consumers reports zero for it. Re-read in full this session (unrelated task) and confirmed still accurate — re-stamping freshness only, no content change.","backlinks":[],"anchorLinks":[]},{"id":"claude-commands-capture-notes-md-3f9e019a","type":"file","character":"single","title":".claude/commands/capture-notes.md","aliases":["capture notes command","manual capture invocation"],"status":"active","updated":"2026-08-11T04:28:44.595Z","edits":1,"anchors":[{"path":".claude/commands/capture-notes.md","hash":"sha256:c2dbcaf67055","state":"changed"}],"freshness":"changed","dir":".claude/commands","outLinks":[],"body":"The /capture-notes command: its `!`-prefixed bash line passes ${CLAUDE_SESSION_ID} to kb-elicit.mjs --manual --session, which is the proof (used this session while building an unrelated plugin) that Claude Code substitutes a command's own session id into its bash execution body even though this isn't documented for slash commands generally — see the '${CLAUDE_SESSION_ID}' flow note.","backlinks":[],"anchorLinks":["how-commands-get-their-own-session-id-claude-session-id"]},{"id":"claude-worktrees-token-consumption-tracker-token-consumption-63c61af9","type":"file","character":"single","title":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/README.md","aliases":["plugin design caveats","clear boundary limitation","token tracker readme"],"status":"active","updated":"2026-08-11T04:28:44.584Z","edits":1,"anchors":[{"path":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/README.md","hash":"sha256:dc6277333e9e","state":"missing"}],"freshness":"missing","dir":".claude/worktrees/token-consumption-tracker/token-consumption-tracker","outLinks":[],"body":"Documents the token-consumption-tracker plugin prototype's open caveats, verified this session by grepping real ~/.claude/projects/*.jsonl transcripts directly: /clear leaves no queryable trace inside the transcript JSONL (no SessionStart/clear record is ever written to the file, even though a SessionStart hook fires with source=\"clear\") even though it also confirmed /clear does not start a new transcript file — so v1 sums the whole session file rather than tracking a clear boundary, deferring a hook-based precision fix.","backlinks":[],"anchorLinks":[]},{"id":"claude-worktrees-token-consumption-tracker-token-consumption-72bc87ba","type":"file","character":"single","title":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/commands/token-consumption.md","aliases":["token consumption command","slash command plugin"],"status":"active","updated":"2026-08-11T04:28:44.573Z","edits":1,"anchors":[{"path":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/commands/token-consumption.md","hash":"sha256:3c855346ac97","state":"missing"}],"freshness":"missing","dir":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/commands","outLinks":[],"body":"The /token-consumption slash command for the token-consumption-tracker plugin prototype. Its `!`-prefixed bash execution invokes scripts/usage.mjs with ${CLAUDE_SESSION_ID} and $(pwd) — see the '${CLAUDE_SESSION_ID}' flow note for why that substitution works despite not being documented for slash commands.","backlinks":[],"anchorLinks":["how-commands-get-their-own-session-id-claude-session-id"]},{"id":"claude-worktrees-token-consumption-tracker-token-consumption-4bc9d206","type":"file","character":"single","title":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/scripts/usage.mjs","aliases":["token usage parser","transcript token counter","cwd path encoding"],"status":"active","updated":"2026-08-11T04:28:44.561Z","edits":1,"anchors":[{"path":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/scripts/usage.mjs","symbols":["encodeCwd","transcriptPathFor","main"],"hash":"sha256:84a8f33b46ed","state":"missing"}],"freshness":"missing","dir":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/scripts","outLinks":[],"body":"New Phase-0/1 spike for a standalone token-consumption-tracker plugin: stream-parses the current session's transcript JSONL (assistant records' message.usage) to sum real token counts, with a turn-level (not call-level) coldstart-attribution pass keyed on tool names starting with mcp__coldstart__. Derives its own transcript path deterministically — cwd-encoded (each \"/\" and \".\" replaced with \"-\", confirmed against a real ~/.claude/projects dir name) plus an exact session id passed in by the caller, never a \"most recently modified file\" guess. Validated this session: output matched a manual jq sum over this session's own live transcript exactly.","backlinks":[],"anchorLinks":[]},{"id":"how-commands-get-their-own-session-id-claude-session-id","type":"flow","character":null,"title":"how commands get their own session id (${CLAUDE_SESSION_ID})","aliases":["CLAUDE_SESSION_ID substitution","session id in commands","command bash execution"],"status":"active","updated":"2026-08-11T04:28:44.521Z","edits":1,"anchors":[{"path":".claude/commands/capture-notes.md","hash":"sha256:c2dbcaf67055","state":"changed"},{"path":".claude/worktrees/token-consumption-tracker/token-consumption-tracker/commands/token-consumption.md","hash":"sha256:3c855346ac97","state":"missing"}],"freshness":"missing","dir":".claude/commands","outLinks":[],"body":"Claude Code substitutes ${CLAUDE_SESSION_ID} into a command markdown file's `!`-prefixed bash execution body, giving a slash command its own session id even though the official docs say hook-style stdin fields (session_id, transcript_path) are documented as available to hooks only, not slash commands — this repo has two independent, working proofs of the substitution.\n\n## Steps\n\n1. `.claude/commands/capture-notes.md` — first proof: passes ${CLAUDE_SESSION_ID} to kb-elicit.mjs --manual --session\n2. `.claude/worktrees/token-consumption-tracker/token-consumption-tracker/commands/token-consumption.md` — second independent proof: passes ${CLAUDE_SESSION_ID} to scripts/usage.mjs --session\n\n## Invariants\n\n- Not documented for slash commands by the official Claude Code docs (checked hooks.md) — only confirmed empirically via these two files' working behavior.\n- A companion gap: there is no equivalent substitution for a command's own transcript_path — it must be derived (cwd-encoding + session id), not read directly.","backlinks":[],"anchorLinks":["claude-commands-capture-notes-md-3f9e019a","claude-worktrees-token-consumption-tracker-token-consumption-72bc87ba"]},{"id":"scripts-win-repro-orchestrator-mjs-599e3c8d","type":"file","character":"single","title":"scripts/win-repro/orchestrator.mjs","aliases":["keeper spawn shape mirror"],"status":"active","updated":"2026-08-11T03:47:24.257Z","edits":2,"anchors":[{"path":"scripts/win-repro/orchestrator.mjs","symbols":["mode","dir","harness","child"],"hash":"sha256:af1639e9fed1","state":"fresh"}],"freshness":"fresh","dir":"scripts/win-repro","outLinks":[],"body":"Spawns harness.mjs detached with stdio:'ignore' and no windowsHide of its own, deliberately reproducing keeper.js's own self-relaunch shape so the repro tests child processes under the same no-console condition the real daemon runs under.","backlinks":[],"anchorLinks":["how-the-149-windowshide-a-b-repro-verifies-windows-console-f"]},{"id":"scripts-win-repro-harness-mjs-c2b8facb","type":"file","character":"single","title":"scripts/win-repro/harness.mjs","aliases":["windowsHide option-shape harness"],"status":"active","updated":"2026-08-11T03:47:24.247Z","edits":2,"anchors":[{"path":"scripts/win-repro/harness.mjs","symbols":["mode","baseOpts","opts"],"hash":"sha256:1186af440d49","state":"fresh"}],"freshness":"fresh","dir":"scripts/win-repro","outLinks":[],"body":"Runs a single execFileSync call whose option shape matches either the unpatched src/indexer/git.ts call sites or the seven #149-patched sites, selected by a CLI arg ('windowsHide' | 'no-windowsHide'); swaps `ping` in for `git`/`rg` purely so the visibility poll in watch.ps1 has runtime to observe.","backlinks":[],"anchorLinks":["how-the-149-windowshide-a-b-repro-verifies-windows-console-f"]},{"id":"src-indexer-git-ts-398eed6c","type":"file","character":"single","title":"src/indexer/git.ts","aliases":["getGitHead","getGitChangedFiles","getGitExactRenames","getGitNewFiles","getGitDirtyFiles","windowsHide missing git.ts","console flash on reconcile","#149 unpatched gap"],"status":"active","updated":"2026-08-11T03:47:23.747Z","edits":1,"anchors":[{"path":"src/indexer/git.ts","symbols":["getGitHead","getGitChangedFiles","getGitExactRenames","getGitNewFiles","getGitDirtyFiles"],"hash":"sha256:7feccf2f2bb6","state":"changed"}],"freshness":"changed","dir":"src/indexer","outLinks":[],"body":"Four execFileAsync('git', ...) calls (getGitHead, getGitChangedFiles, getGitExactRenames, getGitNewFiles/getGitDirtyFiles) that omit windowsHide — confirmed via a real windows-latest CI repro (see the #149 flow note in scripts/win-repro/) that this exact option shape DOES flash a visible console window on Windows. getGitHead runs on every debounced keeper cache save and the others run on every keeper-start reconcile, so this is a live, high-frequency instance of issue #149's bug, left unpatched by the initial 7-site fix. Not yet fixed as of this note.","backlinks":[],"anchorLinks":[]},{"id":"gitignore-a5cc2925","type":"file","character":"single","title":".gitignore","aliases":["repo root gitignore","docs folder ignore pattern","new files missing from git status","untracked files silently excluded","gitignore matching wrong nested directory"],"status":"active","updated":"2026-08-10T18:51:51.993Z","edits":1,"anchors":[{"path":".gitignore","hash":"sha256:6fdc237ac252","state":"fresh"}],"freshness":"fresh","dir":".","outLinks":[],"body":"Repo-root gitignore. Line 9 was a bare `docs/` pattern intended only for the repo-root internal-docs folder, but an unanchored gitignore pattern matches a directory of that name ANYWHERE in the tree — it was silently excluding `site-astro/src/pages/docs/` from git too, so 3 new page files created there this session never showed up in `git status` and would have been dropped from the PR entirely. Fixed by anchoring it to `/docs/`.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-src-pages-how-it-works-notebook-astro-7be582fd","type":"file","character":"single","title":"site-astro/src/pages/how-it-works/notebook.astro","aliases":["how-it-works notebook page","notebook loop page","ring figure","freshness states page","notebook mock section","kb view recreation","wanted screenshot not image recreation"],"status":"active","updated":"2026-08-10T18:51:51.967Z","edits":2,"anchors":[{"path":"site-astro/src/pages/how-it-works/notebook.astro","symbols":["ring-svg","ring-card","loopGrad","state-grid","how-aside","nb-mock"],"hash":"sha256:ac83d3352f95","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/pages/how-it-works","outLinks":[],"body":"Concept-level explainer for the notebook loop: a four-station ring figure, then four cards for what happens to a note when its file changes (the [fresh]/[evidence changed]/[moved]/[anchor missing] strings are hand-copied from freshnessLine() in src/kb/freshness.ts and must be mirrored by hand). This session added a screenshot-free section right after the hero (.nb-mock, styled in how.css) — a built recreation of `kb view` showing a real note (src/server/tools.ts) from coldstart's own notebook, grounding the abstract loop explanation before it starts.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"site-astro-src-styles-how-css-f5f7fefc","type":"file","character":"single","title":"site-astro/src/styles/how.css","aliases":["how-it-works stylesheet","how.css","ring figure styles","temperature figure styles","how-page scope","notebook mock styles"],"status":"active","updated":"2026-08-10T18:51:51.958Z","edits":2,"anchors":[{"path":"site-astro/src/styles/how.css","symbols":[".how-page .wrap",".how-sec",".how-sec-head",".ring-fig",".ring-card",".temp-fig",".temp-seam",".state-grid",".how-aside","@media (prefers-reduced-motion: reduce)",".nb-mock"],"hash":"sha256:518ebee8e16f","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/styles","outLinks":[],"body":"Stylesheet for the /how-it-works/ pages. Defines no design tokens of its own — rides docs.css's tokens/nav chrome, everything scoped under .how-page. Holds the two signature figures (.ring-* notebook loop, .temp-* index split) plus, added this session, .nb-mock — a hand-built HTML/CSS recreation of the notebook's `kb view` UI (top bar, file sidebar, note detail panel) used on the notebook how-it-works page instead of an embedded screenshot; it follows the same ride-on rule, using only --frost/--ember/--surface/--line from docs.css's bare :root.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"site-astro-src-components-nav-astro-9dfe3071","type":"file","character":"single","title":"site-astro/src/components/Nav.astro","aliases":["nav component","site navigation","header nav","variant prop","active nav tab","nav variant union","how variant"],"status":"active","updated":"2026-08-10T18:51:51.949Z","edits":4,"anchors":[{"path":"site-astro/src/components/Nav.astro","symbols":["Props","nav-burger","nav-mobile","installHref","nav-links"],"hash":"sha256:7412a1f7527d","state":"changed"}],"freshness":"changed","dir":"site-astro/src/components","outLinks":[],"body":"Shared nav component, markup only — all of its appearance comes from the page's stylesheet (landing.css for home, docs.css everywhere else). The `variant` prop ('home'|'docs'|'blog'|'how', default 'docs') picks which link gets the `active` class. The npm link is plain text (an SVG icon version was tried and reverted); GitHub stays icon-only on desktop but both render as plain text in the mobile menu — a known, not-yet-fixed inconsistency.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs"]},{"id":"site-astro-src-styles-docs-css-e5e1acf9","type":"file","character":"single","title":"site-astro/src/styles/docs.css","aliases":["docs styles","blog styles","documentation CSS","docs stylesheet","blog stylesheet","nav-wrap bug","essay card grid","docs.css bare root","chrome stylesheet","dark token source","header resizes between pages","sidebar group header double boxed","language chips arbitrarily highlighted","terminal lines merged onto one row"],"status":"active","updated":"2026-08-10T18:51:51.939Z","edits":6,"anchors":[{"path":"site-astro/src/styles/docs.css","symbols":[":root",".side",".term","@media (max-width: 768px)",".nav-burger",".nav-mobile","body.essay-page","footer",".foot-in","nav",".nav-in",".side a.active",".chip",".term-body .ln"],"hash":"sha256:cabd593fda98","state":"changed"}],"freshness":"changed","dir":"site-astro/src/styles","outLinks":[],"body":"Docs+blog stylesheet, token-synced to landing.css: Newsreader/IBM Plex Sans/JetBrains Mono, nav chrome now byte-identical to landing.css (64px height, 28px gap, z-index 50 — was drifted to 60px/20px/30, fixed this session). The docs-page sidebar lives here (.side, .side-group, .side a.active applies a background+left-border 'pill' to ANY active <a> under .side) — DocsSidebar.astro's group-header links share that selector and must explicitly opt out or they double-box. .chip.hot (an arbitrary blue-highlight tier on the supported-languages chips) was removed this session; all .chip now render uniformly. .term-body .ln needed display:block alongside white-space:pre or sibling command lines visually merge onto one row.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","type":"flow","character":null,"title":"how a new site-astro page acquires nav, footer and SVG defs","aliases":["new site-astro page","page chrome wiring","nav footer styling","SvgDefs filter defs","docs sidebar component pattern"],"status":"active","updated":"2026-08-10T18:51:51.928Z","edits":2,"anchors":[{"path":"site-astro/src/pages/how-it-works/notebook.astro","hash":"sha256:ac83d3352f95","state":"fresh"},{"path":"site-astro/src/pages/how-it-works/navigation.astro","hash":"sha256:fe084da82216","state":"changed"},{"path":"site-astro/src/components/Nav.astro","hash":"sha256:7412a1f7527d","state":"changed"},{"path":"site-astro/src/components/Footer.astro","hash":"sha256:d72628133dd4","state":"changed"},{"path":"site-astro/src/components/SvgDefs.astro","hash":"sha256:855fadd756ae","state":"fresh"},{"path":"site-astro/src/styles/docs.css","hash":"sha256:cabd593fda98","state":"changed"},{"path":"site-astro/src/styles/how.css","hash":"sha256:518ebee8e16f","state":"fresh"},{"path":"site-astro/src/components/DocsSidebar.astro","hash":"sha256:8044650fa72f","state":"changed"},{"path":"site-astro/src/pages/docs/navigation.astro","hash":"sha256:d43204e50261","state":"changed"},{"path":"site-astro/src/pages/docs/under-the-hood.astro","hash":"sha256:a7ffe7021ad0","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages/how-it-works","outLinks":[],"body":"Nav.astro, Footer.astro and SvgDefs.astro carry no styling or defs of their own — the chrome CSS lives entirely in whichever page-level stylesheet the page imports, so a new page must import landing.css or docs.css for the nav/footer to look right EVEN IF it ships its own stylesheet, and must render <SvgDefs /> or every url(#rough)/url(#glow) reference in its own markup silently resolves to nothing. Confirmed again this session building 3 new docs sub-pages (/docs/navigation/, /docs/notebook/, /docs/under-the-hood/): each imports docs.css + how's own DocsSidebar.astro component, no per-page chrome CSS needed.\n\n## Steps\n\n1. `site-astro/src/components/DocsSidebar.astro` — reusable sidebar (active prop), only new component this session — the one exception to 'components carry no styling': it ships a small scoped <style> block of its own on top of docs.css's .side rules\n2. `site-astro/src/pages/docs/navigation.astro` — new docs sub-page: imports docs.css for chrome, DocsSidebar for nav, Nav/Footer/SvgDefs same as any page\n3. `site-astro/src/pages/docs/under-the-hood.astro` — new docs sub-page, same pattern\n4. `site-astro/src/components/Nav.astro` — markup only; variant prop picks active link\n5. `site-astro/src/styles/docs.css` — carries the nav/footer chrome CSS and dark tokens for every non-home page\n\n## Invariants\n\n- Nav/Footer/SvgDefs are unstyled markup — their appearance comes entirely from the page's stylesheet, never from the component\n- url(#rough) on a page that does not render <SvgDefs /> fails silently: no error, the element just draws without the filter\n- Nav and Footer each declare their own variant union and Footer keys a taglines map off it — adding a page family means widening BOTH unions and adding the taglines key, or the tagline lookup returns undefined\n- Nav/Footer/SvgDefs are unstyled markup — appearance comes entirely from the page's stylesheet\n- url(#rough) on a page that does not render <SvgDefs /> fails silently\n- DocsSidebar.astro is the one component so far that DOES ship its own scoped <style> — see its own note for why (a docs.css global rule it must locally override)","backlinks":[],"anchorLinks":["site-astro-has-two-independent-stylesheets-that-must-be-hand","docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","site-astro-src-components-docssidebar-astro-93ed0ec3","site-astro-src-components-footer-astro-98a77858","site-astro-src-components-nav-astro-9dfe3071","site-astro-src-pages-docs-navigation-astro-e37c5fa9","site-astro-src-pages-docs-under-the-hood-astro-9d2b1520"]},{"id":"site-astro-has-two-independent-stylesheets-that-must-be-hand","type":"flow","character":null,"title":"site-astro has two independent stylesheets that must be hand-kept in sync","aliases":["landing.css docs.css split","site-astro design system","two stylesheet architecture","how.css ride-on pattern","third stylesheet","unscoped root tokens","nav layout dimension drift","header resizes between pages","nav height changes on navigation","header jumps switching pages"],"status":"active","updated":"2026-08-10T18:51:51.882Z","edits":6,"anchors":[{"path":"site-astro/src/pages/index.astro","hash":"sha256:84935811908d","state":"changed"},{"path":"site-astro/src/styles/landing.css","hash":"sha256:2d67c90c7632","state":"changed"},{"path":"site-astro/src/styles/docs.css","hash":"sha256:cabd593fda98","state":"changed"},{"path":"site-astro/src/pages/docs.astro","hash":"sha256:d404bd2d8258","state":"changed"},{"path":"site-astro/src/pages/blog/index.astro","hash":"sha256:ad1a1743e444","state":"fresh"},{"path":"site-astro/src/layouts/BlogPostLayout.astro","hash":"sha256:9b42858ab2ab","state":"fresh"},{"path":"site-astro/src/styles/how.css","hash":"sha256:518ebee8e16f","state":"fresh"},{"path":"site-astro/src/pages/how-it-works/notebook.astro","hash":"sha256:ac83d3352f95","state":"fresh"}],"freshness":"changed","dir":"site-astro/src/pages","outLinks":[],"body":"site-astro has no shared global stylesheet or CSS custom-property source of truth: index.astro imports landing.css while docs.astro, blog/index.astro and BlogPostLayout.astro import docs.css instead — the two define the same-named tokens (--display/--sans/--mono/--frost/--ember/etc) AND the same nav layout rules (height, gap, z-index, mobile-menu offsets) independently, so a change to one leaves the other silently stale. A third stylesheet, how.css, rides docs.css's tokens/chrome instead of duplicating them and is the pattern to prefer for new page families.\n\n## Steps\n\n1. `site-astro/src/pages/index.astro` — imports landing.css; the only page on that stylesheet\n2. `site-astro/src/styles/landing.css` — home page token + nav-layout source (height:64px, gap:28px, z-index:50)\n3. `site-astro/src/styles/docs.css` (`:root`, `nav`, `.nav-in`, `.side`) — docs+blog stylesheet; redefines the same tokens AND nav dimensions independently\n4. `site-astro/src/pages/docs.astro` — imports docs.css plus its own Google Fonts <link> block\n5. `site-astro/src/styles/how.css` — the third pattern: zero tokens/nav rules of its own, rides docs.css\n6. `site-astro/src/pages/how-it-works/notebook.astro` — imports docs.css AND how.css together — the ride-on pattern in use\n\n## Invariants\n\n- Nav.astro and Footer.astro are shared components styled purely through CSS custom properties — changing their look for one page family means editing that family's stylesheet, never the component itself\n- landing.css and docs.css intentionally share identical hex values for --frost/--ember/--line/--void — if landing.css's palette changes, docs.css needs the matching edit by hand or the dark palette diverges silently (this already happened once: docs.css still had a pre-redesign SF Mono/system-ui font stack after landing.css was fully re-themed to Newsreader/IBM Plex Sans/JetBrains Mono)\n- landing.css and docs.css intentionally share identical hex values for --frost/--ember/--line/--void — if landing.css's palette changes, docs.css needs the matching edit by hand or the dark palette diverges silently\n- Nav.astro and Footer.astro are styled purely through CSS custom properties — changing their look for one page family means editing that family's stylesheet, never the component\n- landing.css and docs.css intentionally share identical hex values for --frost/--ember/--line/--void; a palette change in one needs the matching edit by hand or the dark palette diverges silently\n- how.css declares no token of its own and must stay that way — its only local definitions are --paper/--paper-ink/--paper-line/--faint/--ember-dim under body.how-page, which docs.css does not define\n- anything added to how.css must stay scoped under .how-page or it leaks into docs and blog, which load the same docs.css\n- docs.css's palette sits on a bare :root — a new page family gets the dark theme by importing it under ANY body class; only body.essay-page re-scopes to light\n- landing.css and docs.css intentionally share identical hex values for --frost/--ember/--line/--void — a palette change in one needs the matching edit by hand or the dark palette diverges silently\n- landing.css and docs.css ALSO independently duplicate nav layout dimensions (nav-in height/gap, z-index, .nav-mobile top offset, .side sticky top) — verified this session: docs.css's nav had drifted to 60px height/20px gap/z-index 30 while landing.css was 64px/28px/50, so the header visibly resized crossing from home to /docs/. Fixed by making docs.css's nav block byte-identical to landing.css's again (including .side's sticky top/max-height, which must track the nav height too)\n- how.css declares no token or nav rule of its own and must stay that way\n- docs.css's palette and nav rules sit on bare selectors (:root, nav) with no body-class qualifier — a new page family gets them just by importing docs.css","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","site-astro-src-pages-blog-index-astro-eeb82beb","site-astro-src-pages-docs-astro-d1cf6fe9","site-astro-src-pages-how-it-works-notebook-astro-7be582fd","site-astro-src-pages-index-astro-08d662bc","site-astro-src-styles-docs-css-e5e1acf9"]},{"id":"new-vs-comparison-pages-are-hand-linked-from-existing-conten","type":"flow","character":null,"title":"new /vs/ comparison pages are hand-linked from existing content, not from Nav","aliases":["vs page linking","comparison page discovery","vector rag page"],"status":"active","updated":"2026-08-10T18:44:42.033Z","edits":1,"anchors":[{"path":"site-astro/src/pages/vs/vector-rag.astro","hash":"sha256:8df78e50986b","state":"fresh"},{"path":"site-astro/src/pages/how-it-works/index.astro","hash":"sha256:19c4fdcc0bca","state":"fresh"},{"path":"site-astro/src/content/blog/why-coldstart-makes-zero-llm-calls.md","hash":"sha256:95f97d6898f5","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages/vs","outLinks":[],"body":"A /vs/ page (e.g. vector-rag.astro) has no entry in Nav.astro or Footer.astro — discoverability is entirely from inline links placed in whichever existing pages already discuss the same tradeoff, not from a dedicated nav slot.\n\n## Steps\n\n1. `site-astro/src/pages/vs/vector-rag.astro` — the standalone comparison page itself, reuses how.css/docs.css chrome, no Nav/Footer entry\n2. `site-astro/src/pages/docs/under-the-hood.astro` — links to it from the 'Bring your own semantics' callout, next to the PHILOSOPHY.md link\n3. `site-astro/src/content/blog/why-coldstart-makes-zero-llm-calls.md` — links to it inline, at the sentence conceding RAG's fuzzy-conceptual-query advantage\n4. `site-astro/src/pages/how-it-works/index.astro` — links to it as a second ghost link in the closing CTA row, next to the blog link\n\n## Invariants\n\n- a new /vs/ page needs its own manual link-in placements chosen by content fit — there is no shared nav slot that auto-lists /vs/ pages","backlinks":[],"anchorLinks":[]},{"id":"github-workflows-pages-yml-80c02bfb","type":"file","character":"single","title":".github/workflows/pages.yml","aliases":["pages deploy workflow","github pages build","site deploy ci","fetch-depth checkout","sitemap lastmod wrong in ci","shallow clone build"],"status":"active","updated":"2026-08-09T17:41:18.462Z","edits":1,"anchors":[{"path":".github/workflows/pages.yml","symbols":["deploy"],"hash":"sha256:273b39654c8a","state":"changed"}],"freshness":"changed","dir":".github/workflows","outLinks":[],"body":"Builds site-astro and deploys it to GitHub Pages on pushes touching site-astro/** (or this file). The actions/checkout step carries an explicit `fetch-depth: 0` that is load-bearing rather than cosmetic: astro.config.mjs derives the sitemap's <lastmod> from per-file git history, and checkout's default shallow clone would silently reduce that to one uniform date. Deploy is fail-safe — if the build errors, deploy-pages never runs and the live site is left untouched.","backlinks":[],"anchorLinks":["how-the-sitemap-gets-its-lastmod-dates"]},{"id":"site-astro-astro-config-mjs-8801ef8e","type":"file","character":"single","title":"site-astro/astro.config.mjs","aliases":["astro config","sitemap integration","coldstartmcp.dev domain","site url config","site canonical url","lastmod serialize hook","sitemap missing lastmod","uniform lastmod dates"],"status":"active","updated":"2026-08-09T17:41:18.452Z","edits":2,"anchors":[{"path":"site-astro/astro.config.mjs","symbols":["defineConfig","historyUsable","sourceFileForRoute","lastCommitDate"],"hash":"sha256:268671d3ade6","state":"fresh"}],"freshness":"fresh","dir":"site-astro","outLinks":[],"body":"Astro site config: sets canonical `site` to https://coldstartmcp.dev (consumed by @astrojs/sitemap for absolute URLs) and registers the @astrojs/sitemap + @astrojs/tailwind integrations. The sitemap is generated at build time from the site's routes — no hand-maintained sitemap file. It now passes a serialize() hook that stamps each URL's <lastmod> from its source file's last git commit date: sourceFileForRoute() maps a route back to src/pages/*.astro (or src/content/blog/<slug>.md for posts), and lastCommitDate() shells out to git log. historyUsable is computed ONCE at module load via `git rev-parse --is-shallow-repository` — this guard exists because git log does not fail in a shallow clone, it returns that clone's single commit date for every file, which would stamp all 16 URLs with the same wrong timestamp.","backlinks":[],"anchorLinks":["how-the-sitemap-gets-its-lastmod-dates"]},{"id":"how-the-sitemap-gets-its-lastmod-dates","type":"flow","character":null,"title":"how the sitemap gets its lastmod dates","aliases":["sitemap lastmod","sitemap generation","fetch-depth shallow clone","astro sitemap serialize","uniform lastmod dates","identical timestamps sitemap","missing lastmod"],"status":"active","updated":"2026-08-09T17:41:18.427Z","edits":1,"anchors":[{"path":".github/workflows/pages.yml","hash":"sha256:273b39654c8a","state":"changed"},{"path":"site-astro/astro.config.mjs","hash":"sha256:268671d3ade6","state":"fresh"}],"freshness":"changed","dir":".github/workflows","outLinks":[],"body":"The sitemap's <lastmod> values are not produced by Astro or by the deploy workflow alone — they come from git history read at build time, so the correctness of every date depends on a setting in a DIFFERENT file: actions/checkout's fetch-depth in .github/workflows/pages.yml. A shallow clone does not make git log fail; it answers every path with the single commit it has, so per-file dates come back uniform and wrong rather than absent. That is why astro.config.mjs probes `git rev-parse --is-shallow-repository` up front and emits NO lastmod at all when history is unusable: a wrong lastmod on every URL is worse than none, because it trains Google to ignore the field.\n\n## Steps\n\n1. `.github/workflows/pages.yml` (`checkout`) — fetch-depth: 0 makes full git history available to the build; removing it silently disables lastmod\n2. `site-astro/astro.config.mjs` (`historyUsable`, `sourceFileForRoute`, `lastCommitDate`) — maps each route to its source file and stamps that file's last-commit date, guarded on clone depth\n\n## Invariants\n\n- fetch-depth: 0 in pages.yml is load-bearing for lastmod, not an optimisation\n- lastmod is omitted entirely rather than faked when git history is unusable\n- blog posts stamp from their markdown in src/content/blog, never from [slug].astro, so template edits do not restamp every post","backlinks":[],"anchorLinks":["github-workflows-pages-yml-80c02bfb","site-astro-astro-config-mjs-8801ef8e"]},{"id":"site-astro-src-styles-landing-css-cc3a29d9","type":"file","character":"single","title":"site-astro/src/styles/landing.css","aliases":["landing page CSS","design system","design tokens","frost ember theme","frost ember palette","landing stylesheet","paper card","copy to clipboard button","faq section styling","how-link button","raised not recessed","brand tinted button","button looks faded","button not clickable","hover effect too subtle"],"status":"active","updated":"2026-08-09T10:14:48.231Z","edits":9,"anchors":[{"path":"site-astro/src/styles/landing.css","symbols":[":root",".hero",".commands-grid",".notebook","@media (max-width: 768px)",".nb-main",".nav-burger",".nav-mobile",".faq",".faq-head",".faq-list",".faq-item",".faq-q",".faq-a","@media (max-width: 640px)",".how-link",".nb-exhibit-label",".btn-ghost",".nav-cta"],"hash":"sha256:bd70ef86ae7d","state":"changed"}],"freshness":"changed","dir":"site-astro/src/styles","outLinks":[],"body":"Homepage stylesheet and token source of truth (--display Newsreader, --sans IBM Plex Sans, --mono JetBrains Mono; --frost/--ember palette, --void #070a11). Styles hero, notebook paper-card, flow/index section, nav, footer and the .faq block. Holds .how-link, the centred pill linking each section to its /how-it-works/ page: it is a DEEP BRAND-TINTED fill, not a neutral chip and not a translucent outline — the section's own hue mixed ~13% into the near-black ground at rest (frost for the index section, .warm/ember for the notebook), rising to ~22% on hover with the border going 33%->63%. Deliberately kept deep rather than bright so it does not compete with the solid-frost Install CTA in the nav. An earlier translucent-outline version read as faded and was rejected.","backlinks":[],"anchorLinks":["site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"site-astro-src-components-footer-astro-98a77858","type":"file","character":"single","title":"site-astro/src/components/Footer.astro","aliases":["footer component","footer tagline","home footer","footer variant","taglines map"],"status":"active","updated":"2026-08-09T10:05:32.816Z","edits":3,"anchors":[{"path":"site-astro/src/components/Footer.astro","symbols":["Props","taglines","tagline"],"hash":"sha256:d72628133dd4","state":"changed"}],"freshness":"changed","dir":"site-astro/src/components","outLinks":[],"body":"Shared footer, markup only. The `variant` prop keys directly into a `taglines` object literal to pick the footer tagline text — so unlike Nav, widening Footer's variant union is NOT enough: a variant with no matching taglines key silently renders an undefined tagline. Both were widened together this session when the 'how' variant was added.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-coordinates-seo-entity-binding-of-coldstart-to-co"]},{"id":"site-astro-src-pages-index-astro-08d662bc","type":"file","character":"single","title":"site-astro/src/pages/index.astro","aliases":["homepage","index page","hero section","landing page","landing page astro","home page astro","faq section","faq json-ld source","how-it-works entry links","faq schema not visible","json-ld out of sync with html"],"status":"active","updated":"2026-08-09T10:05:32.788Z","edits":7,"anchors":[{"path":"site-astro/src/pages/index.astro","symbols":["class hero","class commands-grid","class notebook","class philosophy","section#notebook","section#flow","section#philosophy","section#install","faqs","faqJsonLd","Head title","class kicker","section#faq","softwareAppJsonLd","how-link"],"hash":"sha256:8d22655929c5","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages","outLinks":[],"body":"Homepage — v4 centred hero. Section order: hero -> notebook -> flow (index) -> philosophy -> FAQ -> install. The single `faqs` array is the source for BOTH the rendered <details> list and the FAQPage JSON-LD (the JSON-LD maps over it and strips backticks), so adding a question means editing that one array and nothing else — this is what keeps the two from drifting, the defect the FAQ block exists to fix (JSON-LD declaring Q&A that appeared nowhere in the body, which Google's structured-data policy disallows). Verified this session by parsing dist/index.html: every FAQPage question string is present in the rendered body. The notebook and flow sections each end with a centred .how-link into the matching /how-it-works/ page.","backlinks":[],"anchorLinks":["site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"site-astro-src-pages-how-it-works-navigation-astro-b7403337","type":"file","character":"single","title":"site-astro/src/pages/how-it-works/navigation.astro","aliases":["how-it-works navigation page","temperature figure","index explainer page","find gs explainer"],"status":"active","updated":"2026-08-09T10:05:32.780Z","edits":1,"anchors":[{"path":"site-astro/src/pages/how-it-works/navigation.astro","symbols":["temp-fig","temp-seam","temp-col","zoom","zpan"],"hash":"sha256:fe084da82216","state":"changed"}],"freshness":"changed","dir":"site-astro/src/pages/how-it-works","outLinks":[],"body":"Concept-level explainer for the navigation layer: a two-column 'temperature' figure splitting what the index keeps exact (paths, symbols, imports, calls) from what it leaves to the model, then three panels for the map, find and gs. The seam between the columns is a plain 1px gradient div, not an SVG stroke — a rough-filtered wavy stroke was tried first and read as a stray scratch at this size. Same page shell as its sibling: docs.css + how.css, SvgDefs, Nav/Footer variant 'how'.","backlinks":[],"anchorLinks":["how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs"]},{"id":"site-astro-scripts-generate-og-sh-37447c1d","type":"file","character":"single","title":"site-astro/scripts/generate-og.sh","aliases":["OG card generator","chrome-devtools screenshot","social card regeneration","og.png rebuild","chrome-devtools screenshot script","stale og card copied","screenshot failed silently","wrong fonts in og image"],"status":"active","updated":"2026-08-08T16:57:41.333Z","edits":3,"anchors":[{"path":"site-astro/scripts/generate-og.sh","symbols":["TEMPLATE_FILE","OUTPUT_FILE","TEMP_PNG","VIEWPORT","SCRIPT_DIR","REPO_ROOT"],"hash":"sha256:4eb03fafa437","state":"fresh"}],"freshness":"fresh","dir":"site-astro/scripts","outLinks":[],"body":"Regenerates public/og.png (the 1200x630 social card) from scripts/og.html by driving chrome-devtools-cli. Two environment constraints are the reason this is a script and not a one-liner: chrome-devtools REFUSES to write outside its allowed workspace roots, so the capture goes to a TMPDIR path and is copied into the repo afterwards; and resize_page silently does not apply, so the viewport must be set with 'emulate --viewport'. Rewritten this session after the first version could ship a stale card silently: it combined 'set -e' with '|| true' on every chrome-devtools call and used a FIXED temp path, so a failed capture left the previous run's PNG in place, passed the -f existence guard, and copied an old card into the repo while reporting success — which is also why 'ran it twice, identical output' was not evidence of reproducibility. Now uses a PID-unique temp path removed up-front and on EXIT via trap, no '|| true' swallowing, and hard failure if the viewport is not 1200x630 or the captured PNG is not 1200x630. It also awaits document.fonts.ready, without which the serif headline silently renders in a fallback face.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-public-llms-txt-0a80f88e","type":"file","character":"single","title":"site-astro/public/llms.txt","aliases":["llms.txt","LLM discovery file","agent-readable site summary","answer engine discovery","similarity score contrast lost"],"status":"active","updated":"2026-08-08T16:57:29.336Z","edits":3,"anchors":[{"path":"site-astro/public/llms.txt","hash":"sha256:7b4d30155654","state":"changed"}],"freshness":"changed","dir":"site-astro/public","outLinks":[],"body":"Machine-readable project summary for LLM crawlers/answer-engines, served at coldstartmcp.dev/llms.txt per the llms.txt convention. Its opening blockquote is a governed category slot and now leads 'coldstart is codebase memory for AI coding agents', where it previously led with navigation ('Codebase navigation and a codebase notebook'). When rewriting that line, keep the 'ranked with checkable evidence instead of a similarity score' contrast — it is the sharpest anti-embedding differentiator on the site and an earlier rewrite this session dropped it by accident before it was restored. Body lists core operations, doc links, and agent-facing usage notes; carries no numbers and no comparison language, consistent with the standing no-published-numbers and no-comparison-pages locks.","backlinks":[],"anchorLinks":["site-astro-coordinates-seo-entity-binding-of-coldstart-to-co"]},{"id":"site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","type":"flow","character":null,"title":"site-astro coordinates SEO entity binding of 'coldstart' to 'codebase memory' across multiple surfaces","aliases":["coldstart brand positioning","codebase memory branding","SEO entity binding","site messaging consistency","category slot","codebase memory bigram","brand entity binding","memory led navigation second","memory plus navigation pair","generic memory wording"],"status":"active","updated":"2026-08-08T16:57:29.289Z","edits":2,"anchors":[{"path":"site-astro/src/components/Footer.astro","hash":"sha256:9dbf16ed662d","state":"changed"},{"path":"site-astro/src/pages/blog/index.astro","hash":"sha256:ad1a1743e444","state":"fresh"},{"path":"site-astro/public/llms.txt","hash":"sha256:7b4d30155654","state":"changed"},{"path":"site-astro/src/layouts/Head.astro","hash":"sha256:43e48691fd9a","state":"fresh"},{"path":"site-astro/src/pages/index.astro","hash":"sha256:d30a2555c5e0","state":"changed"},{"path":"site-astro/src/pages/docs.astro","hash":"sha256:28ef179f54d6","state":"changed"}],"freshness":"changed","dir":"site-astro/src/components","outLinks":[],"body":"The site distinguishes 'category slots' from body copy, and only category slots are governed: the title tag, hero kicker, footer tagline, llms.txt opening line, og.png kicker, and every meta/og/twitter description must carry the exact bigram 'codebase memory' and nothing may compete with it there. Positioning is memory-led with navigation second, so body copy is still free to describe navigation (the FAQ answer in index.astro says 'navigation and memory layer' and that is deliberate, not a miss). The phrase is applied to roughly six high-value slots ONLY — pushing it everywhere is keyword stuffing, which measurably reduces answer-engine visibility. Verified this session: the bigram was previously absent from every one of these slots because each generic surface pitched 'memory + navigation' as a co-equal pair, which is why npm/GitHub (one-sentence descriptions, forced to choose) were on-message while the site was not.\n\n## Steps\n\n1. `site-astro/src/pages/index.astro` (`Head title`, `class kicker`) — home title tag, hero kicker, and the three meta/og/twitter descriptions\n2. `site-astro/src/pages/docs.astro` — docs title/description/keywords — keywords must lead with the bigram, not generic 'agent memory'\n3. `site-astro/src/pages/blog/index.astro` — blog index title and descriptions\n4. `site-astro/src/components/Footer.astro` — home-variant tagline only; docs/blog taglines are not category slots\n5. `site-astro/public/llms.txt` — opening blockquote — the single highest-leverage line for answer engines\n6. `site-astro/src/layouts/Head.astro` — og:image:alt, which must match the og.png card text\n\n## Invariants\n\n- Brand string is lowercase 'coldstart' everywhere (matches npm, CLI, GitHub, wordmark) — title tags are category-first, brand last.\n- og:image:alt in Head.astro and the kicker baked into public/og.png must say the same thing; changing one means regenerating the other via scripts/generate-og.sh.","backlinks":[],"anchorLinks":["site-astro-has-two-independent-stylesheets-that-must-be-hand","docs-pages-share-a-hand-duplicated-sidebar-scrollspy-script","how-a-new-site-astro-page-acquires-nav-footer-and-svg-defs","site-astro-public-llms-txt-0a80f88e","site-astro-src-components-footer-astro-98a77858","site-astro-src-layouts-head-astro-41b37e1f","site-astro-src-pages-blog-index-astro-eeb82beb","site-astro-src-pages-docs-astro-d1cf6fe9"]},{"id":"site-astro-scripts-og-html-5839ef55","type":"file","character":"single","title":"site-astro/scripts/og.html","aliases":["OG social card","1200x630","social preview"],"status":"active","updated":"2026-08-08T16:44:45.217Z","edits":1,"anchors":[{"path":"site-astro/scripts/og.html","hash":"sha256:d5c456e784ea","state":"fresh"}],"freshness":"fresh","dir":"site-astro/scripts","outLinks":[],"body":"Self-contained HTML template that renders coldstart's 1200×630 social media preview card. The design combines Newsreader serif for the headline (48px), JetBrains Mono for the kicker (uppercase, cyan, letterspaced), and IBM Plex Sans for muted sub-lines. The headline uses dual accent colors — frost cyan (#4fbfe0) on 'scratch' and warm amber (#ef9448) on 'session' — matching the live homepage hero styling. The snowflake SVG mark is inlined from SvgDefs.astro's path definition but rendered in cyan (#4fbfe0). Fonts are loaded from Google Fonts over HTTPS; the container is exactly 1200×630 with dark background (#070a11) and a bottom gradient rule (cyan → amber). Rendered to PNG by generate-og.sh.","backlinks":[],"anchorLinks":[]},{"id":"site-astro-src-pages-blog-index-astro-eeb82beb","type":"file","character":"single","title":"site-astro/src/pages/blog/index.astro","aliases":["blog index page","blog listing","post collection"],"status":"active","updated":"2026-08-08T16:36:06.116Z","edits":2,"anchors":[{"path":"site-astro/src/pages/blog/index.astro","symbols":["posts","site","jsonLd"],"hash":"sha256:ad1a1743e444","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/pages/blog","outLinks":[],"body":"Blog index page. The <Head /> component props (title, description, ogDescription) contain SEO strings that bind 'coldstart' to 'codebase memory' as part of the site's coordinated brand-positioning strategy. These strings must stay in sync with corresponding strings in Footer.astro, public/llms.txt, and Head.astro when the brand messaging evolves. Note: this file also imports docs.css and duplicates the Google Fonts <link> block, tracked separately in the stylesheet-split flow.","backlinks":[],"anchorLinks":["site-astro-coordinates-seo-entity-binding-of-coldstart-to-co","site-astro-has-two-independent-stylesheets-that-must-be-hand"]},{"id":"site-astro-src-layouts-head-astro-41b37e1f","type":"file","character":"single","title":"site-astro/src/layouts/Head.astro","aliases":["Head layout","shared meta tags","og:image:alt"],"status":"active","updated":"2026-08-08T16:36:06.109Z","edits":2,"anchors":[{"path":"site-astro/src/layouts/Head.astro","symbols":["Props","site","canonical","ogImage"],"hash":"sha256:43e48691fd9a","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/layouts","outLinks":[],"body":"Shared head layout component defining meta tags for all pages. The og:image:alt content attribute ('coldstart — codebase memory for AI coding agents') binds the coldstart brand to 'codebase memory' for social sharing, part of a coordinated SEO entity binding across the site.","backlinks":[],"anchorLinks":["site-astro-coordinates-seo-entity-binding-of-coldstart-to-co"]},{"id":"site-astro-src-content-config-ts-72ba7b55","type":"file","character":"single","title":"site-astro/src/content/config.ts","aliases":["blog collection schema","content config","frontmatter schema","readingTime convention"],"status":"active","updated":"2026-08-08T11:38:56.256Z","edits":3,"anchors":[{"path":"site-astro/src/content/config.ts","symbols":["blog","collections"],"hash":"sha256:4508d7ae272e","state":"fresh"}],"freshness":"fresh","dir":"site-astro/src/content","outLinks":[],"body":"Declares the `blog` content collection's zod schema — the single source of truth for what frontmatter every post file must carry (title, description, lead, keywords, kicker, ogDescription, publishDate, readingTime, tags, next, optional wordCount). `publishDate` uses `z.coerce.date()` so a plain YAML date string parses to a real Date for sorting. `readingTime` is a free-text string with no computation or validation behind it — verified this session by computing word-count-vs-stated-minutes across all 10 posts, the unenforced convention in use is roughly 200-230 words/minute; a new post's value should be checked against a similar-length existing post, not eyeballed.","backlinks":[],"anchorLinks":["blog-posts-chain-via-a-hand-maintained-circular-next-field"]},{"id":"site-astro-src-content-blog-how-your-own-benchmark-lies-to-y-196459c3","type":"file","character":"single","title":"site-astro/src/content/blog/how-your-own-benchmark-lies-to-you-first.md","aliases":["benchmark methodology post","how your own benchmark lies","benchmark guardrails post","reading time too long","wrong minutes estimate"],"status":"active","updated":"2026-08-08T11:38:38.797Z","edits":1,"anchors":[{"path":"site-astro/src/content/blog/how-your-own-benchmark-lies-to-you-first.md","hash":"sha256:8a4f613d59c4","state":"changed"}],"freshness":"changed","dir":"site-astro/src/content/blog","outLinks":[],"body":"Companion post to the critique piece above, aimed at whoever is building a benchmark rather than reading one: one section per guardrail (answer-blind queries, one-variable-per-arm including sub-agent ground-truth corruption, environment/rules-file drift between arms, establishing a nondeterminism floor before trusting a delta), each grounded in a real past incident rather than invented for the post. The answer-blind-query anecdote's source repo is deliberately left unnamed for privacy. Its own `readingTime` was first set to 9 min (about 163 words/minute for its length), inconsistent with the ~200-230 wpm the rest of the site's posts use, and corrected to 8 min before publishing.","backlinks":[],"anchorLinks":["blog-posts-chain-via-a-hand-maintained-circular-next-field"]},{"id":"site-astro-src-content-blog-why-most-token-savings-tools-lie-1fc86b94","type":"file","character":"single","title":"site-astro/src/content/blog/why-most-token-savings-tools-lie.md","aliases":["token savings critique post","why most token savings tools lie","benchmark honesty post"],"status":"active","updated":"2026-08-08T11:38:38.788Z","edits":1,"anchors":[{"path":"site-astro/src/content/blog/why-most-token-savings-tools-lie.md","hash":"sha256:308716b65de7","state":"changed"}],"freshness":"changed","dir":"site-astro/src/content/blog","outLinks":[],"body":"The renamed and rewritten critique post (was `what-the-numbers-actually-say.md`), arguing a token-savings number is only honest when measured across a whole session's usage record, not one call — covers the ~90%-cache-read/2%-tool-output cost ratio and a prompt-caching-invalidation mechanism (rewriting earlier context converts cheap cache reads into full-price cache writes) before landing on coldstart's own Arches (-64%) / JMRI (-31%) sweep numbers as the worked example. Deliberately names no competitor tool or anecdote, and deliberately omits an old, since-rebuilt notebook-capture-cost figure — both scoped out on purpose, stated as open gaps in the post itself rather than silently left out.","backlinks":[],"anchorLinks":["blog-posts-chain-via-a-hand-maintained-circular-next-field"]},{"id":"blog-posts-chain-via-a-hand-maintained-circular-next-field","type":"flow","character":null,"title":"blog posts chain via a hand-maintained circular next field","aliases":["blog next field","post navigation chain","next post link"],"status":"active","updated":"2026-08-08T11:38:38.740Z","edits":1,"anchors":[{"path":"site-astro/src/content/config.ts","hash":"sha256:4508d7ae272e","state":"fresh"},{"path":"site-astro/src/content/blog/why-most-token-savings-tools-lie.md","hash":"sha256:308716b65de7","state":"changed"},{"path":"site-astro/src/content/blog/how-your-own-benchmark-lies-to-you-first.md","hash":"sha256:8a4f613d59c4","state":"changed"}],"freshness":"changed","dir":"site-astro/src/content","outLinks":[],"body":"Every blog post's `next` frontmatter field is a manually-authored pointer to another post's slug, and across the whole collection these links form exactly one closed loop (not derived from publishDate order, not validated at build time) that renders as the 'Next' link at the bottom of each post page.\n\n## Steps\n\n1. `site-astro/src/content/config.ts` — declares `next` as an optional plain string on the blog collection schema; nothing here checks that the value is a real, existing slug\n2. `site-astro/src/content/blog/why-most-token-savings-tools-lie.md` — one link in the loop; its `next` was repointed this session to splice a newly added post in after it, instead of straight to its old target\n3. `site-astro/src/content/blog/how-your-own-benchmark-lies-to-you-first.md` — new post spliced into the loop; its own `next` was set to the old target of the post before it, so the loop closes again with one more link\n\n## Invariants\n\n- the `next` chain across ALL posts must form exactly one closed loop with no missing or duplicate slug — inserting or removing a post means re-pointing the neighboring post(s) by hand, not just adding/deleting the one file\n- `next` values are raw slugs, unvalidated against real content-collection entries at build time — a stale slug after a rename or delete fails silently (a dead 'Next' link) rather than failing the build","backlinks":[],"anchorLinks":["site-astro-src-content-blog-how-your-own-benchmark-lies-to-y-196459c3","site-astro-src-content-blog-why-most-token-savings-tools-lie-1fc86b94","site-astro-src-content-config-ts-72ba7b55"]},{"id":"hooks-kb-elicit-mjs-08de0677","type":"file","character":"single","title":"hooks/kb-elicit.mjs","aliases":["findRepoRoot","frozen root marker","acompact","manual capture","baseline","nested subagent transcripts","kb-elicit","capture orchestrator","Stop hook","SubagentStop hook","manual capture entry point","soleMarkerUnderRoot","worklist deletion loses coverage forever","hand-deleted worklist file"],"status":"active","updated":"2026-08-06T12:54:32.329Z","edits":22,"anchors":[{"path":"hooks/kb-elicit.mjs","symbols":["findRepoRoot","freshestMarkerUnderRoot","resolveSubagentTranscript","markerMtime","argValue","readStdin"],"hash":"sha256:a6d2a6103578","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Claude Stop/SubagentStop capture orchestrator AND the shared --manual/on-demand entry point ALL THREE HOSTS invoke: reads the session marker, slices the transcript by stored lineCount, filters evidence through .coldstartignore, and steps the trigger state machine; most stops tick silently. Resume hazards handled: /compact shrinkage (stored lineCount > current lines -> reset) and a fresh marker meeting an already-large transcript (baseline, fire nothing). The repo root is FROZEN in the marker (state.root, via findRepoRoot walk-up to the nearest `.coldstart/notebook` ancestor) so a mid-session `cd` cannot admit a foreign absolute path into the worklist. --manual requires --session (2026-07-?? PR #133 tightened this — it no longer 'self-discovers the freshest marker', which guessed wrong across concurrent sessions), or falls back to `soleMarkerUnderRoot` when exactly one candidate marker exists under --root (refuses on 2+, ambiguous) — this is what lets Cursor/Codex's hook-injected /capture-notes work without a real --session on their command surface. --manual marks LISTED files captured while leaving armed/activeStops/stopsSinceFire/quietRun untouched, so it cannot change WHEN automatic capture next fires. 2026-08-06 FIX: the manual branch now also checks `worklistLost = !existsSync(worklistJsonPath(root, sid, 'main'))` (imported from hooks/capture-payload.mjs) and includes a captured READ-ONLY file in the listing when true — previously, hand-deleting `.worklist-<sid>-<aid>.json` left those files permanently invisible to manual capture even though they still needed a note, since captured=true was otherwise treated as done.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"how-notebook-capture-fires-v5-trigger-timed","type":"flow","character":null,"title":"how notebook capture fires (v5 trigger-timed)","aliases":["capture-notes","manual capture","capture on demand","fire capture now","durable worklist","worklist","capture sentinel","unified marker","cross-host session id","capture instructions","capture-instructions.md","permanent instructions file"],"status":"active","updated":"2026-08-06T11:17:53.830Z","edits":15,"anchors":[{"path":"hooks/kb-elicit.mjs","hash":"sha256:a6d2a6103578","state":"fresh"},{"path":"hooks/evidence.mjs","hash":"sha256:de7c023db93c","state":"changed"},{"path":"hooks/ignore.mjs","hash":"sha256:6b5fde7d5dc4","state":"fresh"},{"path":"hooks/trigger.mjs","hash":"sha256:d5d41f6fd44c","state":"fresh"},{"path":"hooks/capture-payload.mjs","hash":"sha256:cb889f7d6a57","state":"changed"},{"path":"hooks/kb-recall.mjs","hash":"sha256:41cc77ff40a0","state":"changed"},{"path":"hooks/cursor-kb-recall.mjs","hash":"sha256:81eb647451fe","state":"changed"},{"path":"hooks/codex-kb-recall.mjs","hash":"sha256:bfee03e28713","state":"changed"},{"path":"hooks/cursor-kb-elicit.mjs","hash":"sha256:4e5bdaa79e39","state":"fresh"},{"path":"hooks/codex-kb-elicit.mjs","hash":"sha256:b3f62e471f3f","state":"fresh"},{"path":"hooks/capture-sentinel.mjs","hash":"sha256:9ec243a69ec0","state":"fresh"},{"path":"src/init.ts","hash":"sha256:667ecf980a53","state":"changed"},{"path":"src/kb/write-guide.ts","hash":"sha256:9a8d307fce87","state":"fresh"},{"path":"src/kb/durable-worklist.ts","hash":"sha256:f3458ced167c","state":"fresh"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"Capture is trigger-timed, not per-stop: every Stop silently updates per-file evidence and a score, and only when the trigger fires is the checklist payload delivered - the stop itself is never blocked; only git-HEAD drift blocks. Writing a note is really THREE decoupled writes (trigger-state marker, durable worklist file, notebook note) across 3 hosts x 2 agent roles x 2 fire modes, and this pipeline has regressed a different cell of that matrix on almost every past fix. As of 2026-08-06 all three hosts share ONE marker namespace, manual /capture-notes on Cursor/Codex is hook-injected with the real session id rather than typed by the agent, and the static instructions half of the payload lives in one permanent file instead of being duplicated per session - see Invariants for the full incident list before changing anything here.\n\n## Steps\n\n1. `hooks/kb-elicit.mjs` — (`step`, `soleMarkerUnderRoot`) — Claude's Stop/SubagentStop orchestrator AND the shared --manual/on-demand entry point ALL THREE HOSTS invoke (src/init.ts's USER_COMMANDS.capture.invocation is host-agnostic - it always shells out to this one file, never a host-specific elicit script). --manual requires --session, or falls back to soleMarkerUnderRoot when exactly one candidate marker exists under --root, refusing when 2+ are ambiguous.\n2. `hooks/evidence.mjs` — tiered evidence (edit/read/gs; mentions never count) for Claude's transcript format\n3. `hooks/ignore.mjs` — filters ignored files out of evidence at the root\n4. `hooks/trigger.mjs` — (`step`) — pure state machine (Claude/Cursor only - Codex does NOT import this, see cursor-kb-elicit.mjs/codex-kb-elicit.mjs below): score = uncaptured files + 2x settled edits + ALL stops since last fire; arm at 10; fire on descent, cap, or headDrift. A fire is ONE-SHOT: marks offered files captured=true and resets counters in the same call kb-elicit.mjs persists to the marker UNCONDITIONALLY, regardless of whether the worklist write below succeeds.\n5. `hooks/capture-payload.mjs` — (`writeDurableWorklist`, `buildCapturePayload`, `ensureCaptureInstructions`) — renders the FULL checklist for THIS turn (unchanged: always inlines the complete instructions text) and best-effort writes the durable pair .worklist-<sid>-<aid>.{json,md}. If that write is lost (hand-deleted, disk error), the marker still believes those files were offered, so nothing regenerates the pair short of a fresh edit. 2026-08-06: the static DECIDE-FIRST/per-note/FLOWS/WRITE instructions (~150 lines, byte-identical every fire) are no longer duplicated into every session's .md. They live ONCE in the permanent, gitignored `.coldstart/notebook/.capture-instructions.md` (shippedInstructionsTemplate, version-tagged via INSTRUCTIONS_VERSION so a future template edit self-heals a stale on-disk copy). renderCapturePayload substitutes {{CLI}}/{{ROOT}}/{{SID}}/{{AID}}/{{WORKLIST}} into that permanent body - the same placeholder mechanism the pre-existing `.coldstart/checklist.md` user-override already used; loadChecklistOverride still takes precedence when present. The per-session .worklist-<sid>-<aid>.md shrank to just the worklist + a pointer at the permanent file (~10KB -> ~400 bytes); the JSON half (files/tier/needsNote - what the worklist-deletion fix above actually protects) is untouched.\n6. `src/kb/durable-worklist.ts` — TS contract twin of the worklist writer/shape; kb write reads it to credit/trim/clear coverage on finalize\n7. `hooks/kb-recall.mjs` — Claude's UserPromptSubmit: consumes the pending file and injects capture FIRST\n8. `hooks/cursor-kb-elicit.mjs` — (`marker`) — Cursor's OWN Stop/SubagentStop capture logic (does not use trigger.mjs at all - has its own inline evidence/fire logic). As of 2026-08-06 writes its session-state marker to the SAME path kb-elicit.mjs's --manual reads: tmpdir()/coldstart-kb-<sid>-<aid>.json (previously coldstart-cursor-kb-<sid>-<aid>.json, a DIFFERENT file --manual could never see - see Invariants). The per-turn dedupe file (coldstart-cursor-kb-turn-<tid>-<aid>.done) is unrelated and keeps its own cursor-specific prefix.\n9. `hooks/codex-kb-elicit.mjs` — (`marker`) — Codex's OWN Stop/SubagentStop capture logic - also does not import trigger.mjs; ALWAYS fires decision:block on evidence (no arm/descent threshold at all, unlike Claude/Cursor's v5 trigger - a real asymmetry, not yet unified). As of 2026-08-06 writes to the same unified tmpdir()/coldstart-kb-<sid>-<aid>.json marker (previously coldstart-codex-kb-<sid>-<aid>.json).\n10. `hooks/capture-sentinel.mjs` — (`CAPTURE_SENTINEL`) — the literal string `<!-- coldstart:capture-notes -->` embedded in the Cursor/Codex capture command body (src/init.ts wireCursorCommand/wireCodexSkill, gated on UserCommand.hookInjected) so a host's own pre-prompt recall hook can recognize the submitted prompt IS /capture-notes and act on it.\n11. `hooks/cursor-kb-recall.mjs` — Cursor's beforeSubmitPrompt: when the submitted prompt contains CAPTURE_SENTINEL and a real session_id is present (which this hook always has, unlike the command surface itself), it runs `kb-elicit.mjs --manual --session <real sid> --root <root>` itself and injects the output via the existing additional_context/pending channel - deterministic, no LLM has to type a correct --session. Falls back to the command's own 'run this in the terminal' wording if the hook is disabled/fails.\n12. `hooks/codex-kb-recall.mjs` — Codex's UserPromptSubmit: same C
