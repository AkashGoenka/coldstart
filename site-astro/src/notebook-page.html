APTURE_SENTINEL detection and self-run of kb-elicit.mjs --manual, injected via hookSpecificOutput.additionalContext. Every early-exit (no notebook yet, empty query, search failed, no recall hits) falls back to delivering the manual-capture text alone via deliverManualOnlyAndExit, instead of exiting silently and swallowing an explicit /capture-notes.\n13. `src/init.ts` — (`wireCursorCommand`, `wireCodexSkill`, `UserCommand`) — UserCommand gained hookInjected?:boolean (true only for the capture command, not repair/repairAliases which need no session). When set, the Cursor/Codex command body opens with CAPTURE_SENTINEL and reworded fallback text instead of unconditionally telling the agent to run the terminal command.\n14. `src/kb/write-guide.ts` — (`MARKER_PREFIXES`, `flowEvidenceCount`) — the flow-evidence check that unions markers across a session's agents. Simplified 2026-08-06 from 3 per-host prefixes to the one unified prefix now that all hosts write the same marker file.\n\n## Invariants\n\n- mentions (grep hits, bare path tokens) never enter evidence — content tiers only\n- cap fires INJECT not block — validated spec deviation: dense sessions starve descent and repeated cap-blocks re-create the v4 agitation\n- pending file = tmpdir coldstart-kb-pending-<sid>.json, 24h TTL, consumed (deleted) on delivery\n- capture survives Claude Code /compact: a transcript shorter than the stored lineCount is reprocessed from its new start rather than dropping evidence (kb-elicit shrink guard)\n- manual capture is READ-ONLY on the session marker, so an on-demand capture can never perturb automatic firing\n- the manual path prints the payload directly - it does NOT write a pending file and does not go through kb-recall\n- manual self-discovers the session (no hook stdin): freshest tmpdir marker whose recorded relative files still resolve under --root\n- mentions (grep hits, bare path tokens) never enter evidence - content tiers only\n- cap fires INJECT not block - dense sessions starve descent and repeated cap-blocks re-create v4 agitation\n- pending file = tmpdir coldstart-kb-pending-<sid>.json, 24h TTL, consumed on delivery\n- capture survives Claude Code /compact via the kb-elicit shrink guard\n- manual capture is READ-ONLY on the session marker, so it cannot perturb automatic firing\n- the manual path prints the payload directly - no pending file, no kb-recall\n- manual self-discovers the session: freshest tmpdir marker whose recorded files resolve under --root\n- EMPIRICAL: descent has never fired in this repo; head-drift (commits) and cap (huge sessions) are the only automatic paths\n- score counts ALL stops since the last fire (engagement); quietRun counts only non-active stops (wind-down) - two different questions, two different counters\n- MIN_FILES_ARM=1 governs arming and descent (non-blocking); MIN_FILES=2 still governs head-drift and cap, because a one-file BLOCKING prompt is the v4 agitation the design exists to kill\n- a session that touches ZERO files never fires, however long it runs\n- manual capture marks the files it LISTED as captured, but leaves armed/activeStops/stopsSinceFire/quietRun untouched - it cannot change WHEN automatic capture fires, only what is still outstanding\n- evidence is attributed to the FROZEN repo root (marker state.root, derived once via findRepoRoot walk-up to .coldstart/notebook), so a mid-session `cd` out of the repo cannot admit a foreign absolute path into the worklist\n- capture survives Claude Code /compact via the kb-elicit shrink guard (a transcript shorter than stored lineCount is reprocessed from its new start, not dropped) - PR #81 fixed this after evidence collection silently died post-compact for the rest of a session\n- manual capture does NOT call trigger.step() and does not touch armed/activeStops/stopsSinceFire/quietRun - it only reads the marker and lists/marks worklist files, so it cannot change WHEN automatic capture next fires, only what is still outstanding\n- manual capture requires --session (or exactly one unambiguous marker under --root via soleMarkerUnderRoot); it no longer 'self-discovers the freshest marker' - that guessed wrong when multiple sessions had evidence, which PR #133 closed\n- EMPIRICAL: descent had NEVER fired in this repo for 6 weeks (104 stops/24 fires, all head-drift or cap) - not a threshold problem. Root cause (PR #96): a 2026-07-21 edit reclassified synthesis turns as quiet (correct, feeds descent) but left the score's engagement term reading activeStops instead of ALL stops since fire, deleting the only score-growth term a pure-discussion session has. Fixed by splitting into two counters: score uses stopsSinceFire (has enough happened), quietRun uses only non-active stops (has it wound down).\n- evidence is attributed to the FROZEN repo root (marker state.root, derived once via findRepoRoot walk-up), so a mid-session `cd` out of the repo cannot admit a foreign absolute path into the worklist - PR #102 fixed a real case where a session that `cd`'d into ~/.claude/.../memory got those files recorded as if repo-local\n- captured=true means OFFERED by a fire, not WRITTEN by kb write - the manual path used to filter out every captured file, which silently dropped a session's own just-edited/new files from /capture-notes (PR #113); do not conflate the two states when touching either path\n- SubagentStop's capture prompt runs as the subagent's OWN turn, and a subagent's return value to its coordinator IS its last message - blocking a SubagentStop for the notebook step overwrote the actual deliverable until a subagent-only 'restate your result last' tail was added (PR #61); any new SubagentStop-blocking behavior needs the same tail or it will re-break this\n- the flow-note gate is a precision/recall knob that has swung to both extremes on the SAME axis with no automated test: PR #70 tightened it after a 32% junk-flow rate, then PR #100 found it had overcorrected to a hard zero (0 new flows in 6 days, every flow write folding into one pre-existing flow) six weeks later - only caught by eyeballing capture.jsonl rates by hand each time\n- concurrency identity: the durable worklist and the tmpdir evidence marker MUST share the exact key <sid>-<aid> (aid defaults to 'main'), never sid alone and never root alone - a subagent shares its parent's session id, so a looser key lets a subagent's capture clobber the main agent's list (PR #127 -> re-keyed by PR #133)\n- every worklist/marker write in this pipeline is deliberately best-effort (try/catch, 'capture must never fail because these could not be written') - correct for not blocking the agent, but means write failures are silent by design. There is no repair/reconciliation command today that checks marker state against worklist-file existence the way `kb repair` checks note shape against the sidecar - a hand-deleted .worklist-<sid>-<aid>.{json,md} stays gone forever for those files.\n- any change to this pipeline should be checked against the full matrix: 3 hosts (Claude/Cursor/Codex) x 2 roles (main/subagent) x 2 fire modes (automatic score-based / manual on-demand) - a fix scoped to one cell has regressed a different cell almost every time in this file's history (PRs #61, #64, #70, #81, #85, #96, #100, #102, #113, #127, #133)\n- capture survives Claude Code /compact via the kb-elicit shrink guard - PR #81 fixed evidence collection silently dying post-compact for the rest of a session\n- manual capture does NOT call trigger.step() and cannot change WHEN automatic capture next fires, only what is still outstanding\n- manual capture requires --session (or exactly one unambiguous marker under --root via soleMarkerUnderRoot)\n- EMPIRICAL (Claude/Cursor only): descent had NEVER fired in this repo for 6 weeks (104 stops/24 fires, all head-drift or cap) - PR #96 fixed a wrong score counter (activeStops instead of stopsSinceFire)\n- MIN_FILES_ARM=1 governs arming and descent (non-blocking); MIN_FILES=2 still governs head-drift and cap\n- re-instructions.md` (hooks/capture-payload.mjs ensureCaptureInstructions/shippedInstructionsTemplate), version-tagged so a future edit to the template self-heals a stale on-disk copy instead of silently drifting. This is a pure disk-I/O simplification (USER's own proposal, deferred to after the prior PR merged) - it does NOT change what the agent reads on any given fire (buildCapturePayload's return value still inlines the full instructions every time) and does NOT touch the worklist-deletion recovery fix above (that protects the per-session JSON half - files/tier/needsNote - which must stay per-session and deletable; only the static prose half moved to a permanent file). The per-session .worklist-<sid>-<aid>.md shrank from a full ~10KB duplicate to a ~400-byte worklist+pointer","backlinks":["src-init-ts-a867acfe"],"anchorLinks":["how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about","hooks-capture-payload-mjs-9f99e00d","hooks-capture-sentinel-mjs-944d6bea","hooks-codex-kb-elicit-mjs-9cb55b18","hooks-codex-kb-recall-mjs-cd4df13f","hooks-cursor-kb-elicit-mjs-151bef1e"]},{"id":"hooks-capture-payload-mjs-9f99e00d","type":"file","character":"single","title":"hooks/capture-payload.mjs","aliases":["rule 7","under capture","capture coverage denominator","worklist manifest tmpdir","inline spec shapes","checklist override","worklist scope rule","envelope","capture instructions","capture-instructions.md","permanent instructions file","shipped instructions template"],"status":"active","updated":"2026-08-06T11:16:13.455Z","edits":27,"anchors":[{"path":"hooks/capture-payload.mjs","symbols":["buildCapturePayload","recordWorklistManifest","worklistManifestPath","worklistLines","loadChecklistOverride"],"hash":"sha256:cb889f7d6a57","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"Builds the capture prompt (v5) for every host. 2026-08-06: the static DECIDE-FIRST/per-note/FLOWS/WRITE instructions (~150 lines, byte-identical every fire) no longer get duplicated onto disk per session. shippedInstructionsTemplate() is written ONCE to the permanent, gitignored `.coldstart/notebook/.capture-instructions.md` (ensureCaptureInstructions — version-tagged via INSTRUCTIONS_VERSION so a future template change self-heals a stale on-disk copy instead of drifting silently). renderCapturePayload substitutes {{CLI}}/{{ROOT}}/{{SID}}/{{AID}}/{{WORKLIST}} into that permanent body — the SAME placeholder mechanism the pre-existing `.coldstart/checklist.md` user-override path already used (loadChecklistOverride now takes precedence, ensureCaptureInstructions is the fallback; both paths share one substitution pass now instead of two near-duplicate branches). The per-session `.worklist-<sid>-<aid>.md` (writeDurableWorklist/renderDurableMd) is now SMALL — just the worklist + a pointer to the permanent file — instead of the full rendered payload. Nothing changes for the CURRENT fire: buildCapturePayload's return value (what the agent actually reads this turn) still inlines the complete instructions text every time; only what gets persisted to disk for a LATER re-Read shrank (~10KB -> ~400 bytes per session). This does not touch the worklist-deletion recovery fix from the same week (see the flow note) — that's about the JSON half (files/tier/needsNote), which must stay per-session and deletable; this split only concerns the static prose half.\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — renders the compact shapes inline into the capture prompt","backlinks":[],"anchorLinks":["how-an-agent-finds-out-it-under-captured","how-notebook-capture-fires-v5-trigger-timed","src-kb-search-ts-272e86f3","where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"hooks-capture-sentinel-mjs-944d6bea","type":"file","character":"single","title":"hooks/capture-sentinel.mjs","aliases":["capture sentinel","capture-notes marker string","hook-injected command detection"],"status":"active","updated":"2026-08-06T09:53:32.824Z","edits":1,"anchors":[{"path":"hooks/capture-sentinel.mjs","symbols":["CAPTURE_SENTINEL"],"hash":"sha256:9ec243a69ec0","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Exports the single literal string CAPTURE_SENTINEL (<!-- coldstart:capture-notes -->) that src/init.ts embeds in the Cursor/Codex /capture-notes command body and that cursor-kb-recall.mjs/codex-kb-recall.mjs grep the submitted prompt for, so a host's pre-prompt recall hook can recognize its own capture command and run it with a real session id instead of leaving the agent to type one blind.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"why-a-file-note-s-extra-anchors-can-never-carry-symbols","type":"flow","character":null,"title":"why a file note's extra anchors can never carry symbols","aliases":["one addressable anchor per file note","verified creates anchors","anchor fill targets wrong note","repair pass never converges","symbols land on another note"],"status":"active","updated":"2026-08-03T04:18:58.898Z","edits":1,"anchors":[{"path":"src/kb/write.ts","hash":"sha256:d14c1dd5b965","state":"changed"},{"path":"src/kb/repair.ts","hash":"sha256:5f6602bab1c5","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"A file note can accumulate anchors it is structurally incapable of ever filling: every path listed in a write's `verified` becomes an anchor, but only ONE of them — the anchor whose path derives the note id — is addressable by a later write. kbWrite routes a file note by spec.path and overwrites the record's anchors with a single entry at that path, so there is no spec that attaches symbols to a secondary anchor; a write aimed at one lands on whatever note that path derives to instead. Any code that walks a note's anchors and tries to fill them one by one is therefore writing to the wrong note and never converging, which is exactly how the keeper's auto-backfill disabled itself. Observed live 2026-08-03: a note written with verified:[src/alpha.ts, src/beta.ts] gained two anchors, and only the alpha one could ever be given symbols.\n\n## Steps\n\n1. `src/kb/write.ts` (`kbWrite`) — routes a file note by spec.path (fileNoteId) and overwrites record.anchors with one entry at that path — the constraint everything else inherits\n2. `src/kb/raw-log.ts` — stamps an anchor for every path in `verified`, which is how secondary anchors appear at all (observed via behaviour this session, file not read)\n3. `src/kb/repair.ts` (`mechanicalSymbolRepair`) — the consumer that must respect it — fills only the anchor whose path derives the note id, skipping the rest\n\n## Invariants\n\n- exactly one anchor per file note is addressable by a write: the one where fileNoteId(anchor.path) === note.id\n- a fill loop over note.anchors must skip every other anchor or it writes to a different note and re-fires forever","backlinks":[],"anchorLinks":["how-a-note-s-freshness-gets-claimed-and-checked","src-kb-repair-ts-a197bcce","src-kb-write-ts-d5968d80","where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"tests-kb-repair-test-ts-35dbd7b5","type":"file","character":"single","title":"tests/kb-repair.test.ts","aliases":["repair tests","lesson scope terms rejected","retract needs target","hub facet symbols","kbWrite call shape","repair writes nothing","kb repair tests","seedSidecar helper","backfill regression tests","secondary anchor test","convergence assertion"],"status":"active","updated":"2026-08-03T04:18:38.158Z","edits":3,"anchors":[{"path":"tests/kb-repair.test.ts","symbols":["planRepairs","repairWorklist","rawSnapshot","seedSidecar"],"hash":"sha256:71771b79bc32","state":"fresh"}],"freshness":"fresh","dir":"tests","outLinks":[],"body":"Covers kb repair: planRepairs/repairWorklist (pure, never writes) and mechanicalSymbolRepair (the one writing path). Verified 2026-08-03: the mechanical block seeds a fake sidecar directly via saveKbNotesIndex, so no real code index is needed. Two tests added for the wrong-note backfill bug — one asserts a secondary anchor (created by listing a second path in `verified`) is skipped, no note is conjured at its path, and a second pass fixes nothing; the other asserts a note already carrying aliasesVerified stays out of planAliasRepair after a backfill. The convergence assertion is the load-bearing one: a non-converging pass is what trips the keeper's streak cap.","backlinks":[],"anchorLinks":[]},{"id":"src-kb-write-ts-d5968d80","type":"file","character":"single","title":"src/kb/write.ts","aliases":["verified auto stamp","note freshness reset by edit","file note id from path","two-phase write gate","kb write validation","anchors overwritten on file note","file IS the anchor","secondary anchor unwritable","spec.path addresses the note","extra anchors dropped silently","symbols went to the wrong path"],"status":"active","updated":"2026-08-03T04:18:16.605Z","edits":4,"anchors":[{"path":"src/kb/write.ts","symbols":["kbWrite","WriteSpec","WriteOptions","WriteResult","WriteCandidate","exactAddressCandidates","pathWarnings"],"hash":"sha256:d14c1dd5b965","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"Validates and routes a kb write spec, then hands a record to the raw log. Two non-obvious rules live in the file-note branch. (1) It auto-fills `verified` with the anchor path, which makes raw-log stamp the file's live hash and reset freshness — conditional since 2026-07-30 on the spec carrying knowledge implying a read (summary, facets, body), so a metadata-only edit stamps nothing; an explicit `verified` is always honoured. (2) Verified 2026-08-03: the same branch OVERWRITES record.anchors with a single entry at spec.path and reads symbols only from spec.anchors[0] — so a file note's extra anchors are unwritable through this path. Secondary anchors exist (raw-log stamps one per `verified` path) but can never be given symbols, and a spec whose anchors[0] is not spec.path has those symbols silently attributed to spec.path instead. File-note ids derive from the path (never supplied); the two-phase candidate gate runs only for non-file notes.","backlinks":[],"anchorLinks":["how-a-note-s-freshness-gets-claimed-and-checked","why-a-file-note-s-extra-anchors-can-never-carry-symbols","why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"src-kb-repair-ts-a197bcce","type":"file","character":"single","title":"src/kb/repair.ts","aliases":["notes not findable","missing aliases","unfindable notes","repair worklist","Nothing to repair here","flow steps unanchored","repair prompt wording","preloadedSidecar param","anchor symbol backfill","mechanicalSymbolRepair","own anchor only","SYMBOL_BACKFILL_CAP","backfill wrote to wrong note","auto-backfill stopped firing","streak 3/3 disabled","secondary anchor never filled","repair never converges"],"status":"active","updated":"2026-08-03T04:18:16.473Z","edits":5,"anchors":[{"path":"src/kb/repair.ts","symbols":["planRepairs","repairWorklist","RepairFinding","RepairReport","subjectPaths","mechanicalSymbolRepair","SYMBOL_BACKFILL_CAP"],"hash":"sha256:5f6602bab1c5","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"kb repair: detection worklist + the one mechanical exception, mechanicalSymbolRepair, which backfills anchors[].symbols on single-character file notes from the kb-notes-index sidecar (hub notes excluded, never overrides existing symbols, capped at SYMBOL_BACKFILL_CAP=15). Takes an optional preloadedSidecar so the keeper skips a redundant disk read. 2026-08-03: it can only ever fill the note's OWN anchor — the one whose path derives the note id (fileNoteId). It used to loop every anchor and re-put each under ITS own path; because kbWrite addresses a file note by spec.path, a secondary anchor's record landed on a different note, the real anchor stayed empty, and the pass re-fired every watcher cycle until the keeper's streak cap tripped and disabled auto-backfill permanently. It also now carries aliasesVerified forward when the note was already verified at its current edit, so a machine write does not push edits past aliasesVerifiedAtEdit and resurface the note in kb repair-aliases.\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — runs missingInNote over the folded notebook","backlinks":[],"anchorLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-file-note-s-extra-anchors-can-never-carry-symbols"]},{"id":"src-kb-alias-repair-ts-f079a186","type":"file","character":"single","title":"src/kb/alias-repair.ts","aliases":["planAliasRepair","aliasRepairWorklist","hiddenIdentityAliases","pagination offset limit","aliasesVerifiedAtEdit stamp","stopping point","resume contract","offset advance unsafe","notes repeat forever","same note every run","pagination skips notes","offset skips notes after marking"],"status":"active","updated":"2026-08-02T18:21:55.330Z","edits":3,"anchors":[{"path":"src/kb/alias-repair.ts","symbols":["planAliasRepair","aliasRepairWorklist"],"hash":"sha256:78de3ecf8f3c","state":"fresh"}],"freshness":"fresh","dir":"src/kb","outLinks":[],"body":"kb repair-aliases' engine. Distinct from kb repair's missing-identity-aliases check (that one catches notes with NO aliases; this is for aliases that EXIST but no longer describe the file/flow). planAliasRepair(root, offset, limit) paginates every active file/flow note, computing hiddenIdentityAliases via {capIdentity:false} so an agent sees what a blind retract would resurface. 2026-08-02 FIX: the command had no memory of 'already reviewed' — a note judged still-accurate reappeared on every future run forever, since that judgment left no trace (unlike kb repair's mechanical checks). Fixed with FoldedNote.aliasesVerifiedAtEdit (fold.ts): eligible now excludes a note where nothing has changed since its stamp. USER caught the real trap before this shipped: naively filtering that way breaks pagination, because `eligible` shrinks as notes get marked verified, so continuing to advance --offset by the page size (the OLD documented flow) silently skips whatever slides into that position next. Fix changed the RESUME CONTRACT, not the slicing: mark a batch verified, then re-run with offset 0 (default) — reviewed notes are simply gone from the list. offset/nextOffset still work for read-only browsing, just are no longer how you advance through a reconciling pass. Verified end to end same session: backfilled aliasesVerified:true onto all 53 notes this repo had already reconciled; kb repair-aliases now correctly reports 'No file/flow notes to reconcile.'","backlinks":[],"anchorLinks":[]},{"id":"src-init-ts-a867acfe","type":"file","character":"single","title":"src/init.ts","aliases":["repair-notes command","slash command wiring","capture-notes command","wireClaudeCommand","codex skill frontmatter","cursor no bang expansion","REPAIR_COMMAND","USER_COMMANDS table","repair-aliases command","already imports @coldstart.md","aliasesVerified instructions","no offset resume"],"status":"active","updated":"2026-08-02T18:21:55.074Z","edits":11,"anchors":[{"path":"src/init.ts","symbols":["wireClaudeImport","ensureColdstartignore","captureInvocation","wireClaudeCaptureCommand","wireCursorCaptureCommand","wireCodexCaptureSkill","USER_COMMANDS","REPAIR_COMMAND","CAPTURE_COMMAND","wireClaudeCommand","wireCursorCommand","wireCodexSkill","writeOwnedFile","installRoot","coldstartMd"],"hash":"sha256:d89dfee0ae35","state":"changed"}],"freshness":"changed","dir":"src","outLinks":["how-notebook-capture-fires-v5-trigger-timed"],"body":"init.ts owns coldstart init/setup for all three hosts. USER_COMMANDS is the single source of truth for every user-invoked slash-command/skill (capture-notes, repair-notes, repair-aliases): one row (invocation/description/skillDescription/instructions) per command, rendered by wireClaudeCommand/wireCursorCommand/wireCodexSkill into each host's own format. Deliberately thin `instructions`: the actual guidance lives in the command's own worklist output, never restated here. init's main flow also calls mechanicalSymbolRepair once on the upgrade path. 2026-08-02: USER_COMMANDS.repairAliases.instructions rewritten — it used to tell the agent to advance --offset across calls, which silently skips notes once repair-aliases starts excluding reviewed ones (the eligible list shrinks under a fixed offset). Now says: mark the batch aliasesVerified:true, then re-run with NO offset.\n\n## Facets\n\n- **wireClaudeImport** — BUG live in 2.2.0 (fix open in PR #80): presence check is substring includes(), so a CLAUDE.md that merely MENTIONS @coldstart.md in backticked prose (coldstart's own repo does) makes init report 'already imports' and skip writing the real import line — and Claude Code does not resolve imports inside code spans, so the guidance never loads. Fix = standalone-line check, symmetric with unwire's line-based strip.\n- **ensureColdstartignore** — Writes .coldstart/.coldstartignore (comments-only template; defaults live in hooks/ignore.mjs) and ensures a sibling .coldstart/.gitignore carries the .coldstartignore line so the file stays personal even in shared-notebook repos.\n- **captureInvocation** — bakes ONLY the absolute install path (resolveHooksDir) into the capture command - never a repo path. The hook defaults --root to cwd, so one identical invocation works for every host and every repo, and npm updates are picked up automatically. — [[how-notebook-capture-fires-v5-trigger-timed]]\n- **wireClaudeCaptureCommand** — writes .claude/commands/capture-notes.md. Uses Claude's leading-! expansion so the checklist is injected into the prompt at submit time rather than the agent having to run it. Fully-owned file, overwritten every init.\n- **wireCursorCaptureCommand** — writes .cursor/commands/capture-notes.md as a PLAIN prompt template - Cursor commands have no ! expansion, so the body must ask the agent to run the command itself.\n- **wireCodexCaptureSkill** — writes .agents/skills/capture-notes/SKILL.md, NOT a Codex prompt: Codex custom prompts live in global ~/.codex/prompts and are deprecated, so they cannot carry repo-scoped wiring. Skills are repo-scoped (walked up to the repo root) and REQUIRE name + description frontmatter.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"src-kb-fold-ts-cc536263","type":"file","character":"single","title":"src/kb/fold.ts","aliases":["note ordering","union never trims","alias cap","where did my aliases go","fold options","capIdentity flag","uncapped alias union","notebook merge conflict","raw log fold","aliasesVerified flag","aliasesVerifiedAtEdit stamp","post-increment edits check"],"status":"active","updated":"2026-08-02T18:21:54.944Z","edits":13,"anchors":[{"path":"src/kb/fold.ts","symbols":["fold","applyPut","applyRetract","capAliases","ALIAS_MAX","ALIAS_MAX_WORDS","stableStringify","FoldResult","PUT_KEYS"],"hash":"sha256:fe634a6ddd04","state":"fresh"}],"freshness":"fresh","dir":"src/kb","outLinks":[],"body":"The fold — render is a fold, and the fold IS the merge. identityAliases union-forever + capped (capAliases, ALIAS_MAX=12); incidentAliases replaced wholesale by any write carrying summary/body. fold() takes an optional {capIdentity:false} to skip the cap and return the FULL historical union — the one consumer is kb repair-aliases, which needs to show an agent what's hidden past the render cap before it retracts anything. 2026-08-02: a put carrying aliasesVerified:true stamps note.aliasesVerifiedAtEdit = note.edits, set in the MAIN fold loop AFTER the edits++ increment (not inside applyPut, which still sees the pre-increment count) — this is the signal kb repair-aliases uses to stop resurfacing a note nothing has changed on since it was reviewed. 'aliasesVerified' is added to PUT_KEYS purely so it is not dumped into note.extra; it carries no stored content of its own.","backlinks":[],"anchorLinks":[]},{"id":"why-a-note-cannot-be-found-by-the-symbol-it-is-about","type":"flow","character":null,"title":"why a note cannot be found by the symbol it is about","aliases":["empty anchor symbols","kb search misses symbol","file-single shape","note not findable by name","lane 2 tool mode only","sidecar symbol inventory"],"status":"active","updated":"2026-08-02T18:19:44.673Z","edits":10,"anchors":[{"path":"src/kb/write-guide.ts","hash":"sha256:ea58bd486a3b","state":"changed"},{"path":"src/kb/search.ts","hash":"sha256:51e1afe7535c","state":"changed"},{"path":"hooks/capture-payload.mjs","hash":"sha256:c29235b37e62","state":"changed"},{"path":"tests/kb-shape-parity.test.ts","hash":"sha256:ab4a2402accd","state":"changed"},{"path":"src/kb/cli.ts","hash":"sha256:a98db0290d25","state":"changed"},{"path":"src/kb/write.ts","hash":"sha256:38e7ca9a095a","state":"changed"},{"path":"src/kb/notes-index.ts","symbols":["buildKbNotesIndex","loadKbNotesIndex","saveKbNotesIndex","kbNotesIndexPath","KbNotesIndex","KB_NOTES_INDEX_VERSION","deriveRenames","stampCoversTerms"],"hash":"sha256:751df4c238dc","state":"fresh"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"CORRECTED 2026-08-01 (second pass — the first version of this note got the mechanism wrong; trust this paragraph over anything above it). A note's stored anchor symbols matter in HOOK mode only. Verified by running kbSearch both ways on `cmdSearch context` and reading carriers: lane 2 (resolveTermToSymbolFiles over the keeper's kb-notes.json sidecar, which holds a per-anchored-file symbol inventory — 35 of 47 files here, and it does contain cmdSearch for src/kb/cli.ts) is ENABLED in tool mode and DISABLED in hook mode at search.ts:488, because enabling it there produced false implants. So `kb search` can match a symbol a note never stored, while hook recall cannot. The shape gap was still real — file-single published no symbols field, so 2 of 44 notes stored any, and hook mode had nothing — but the earlier claim that the anchor channel is empty CORPUS-WIDE was wrong for tool mode. Beware attributing rank changes to this: after storing symbols on src/kb/cli.ts its note went from rank 2 to rank 1 in BOTH modes, but the summary was rewritten in the same write, so the cause is not isolated. Aliases have no such fallback in either mode: nothing derives them, so a note without them is reachable only by its exact title, and the capture prompt's inlined copy of the flow shape had silently lost the field.\n\n## Steps\n\n1. `src/kb/write-guide.ts` (`WRITE_GUIDE_SHAPES`, `missingFieldsWarning`) — canonical shapes + the post-write report naming what is missing\n2. `hooks/capture-payload.mjs` (`buildCapturePayload`) — the inlined SECOND copy agents actually read — where the drift happened\n3. `src/kb/write.ts` (`kbWrite`) — accepts and unions anchors[{path,symbols}] on file specs — capability was never the constraint\n4. `src/kb/search.ts` (`kbSearch`) — weights the anchor channel x2 for exactly these terms, and found it empty\n5. `tests/kb-shape-parity.test.ts` (`REQUIRED`) — pins the two copies so the drift cannot recur\n\n## Invariants\n\n- The anchor channel can only hold what the spec shape asks for — a matcher change cannot recover a field agents were never told to write.\n- file-single is the default and ~97% of volume, so anything missing from ITS shape is missing from the corpus.\n- Tool-mode (kb search) quality is invisible in the inject log: cli.ts logs inject-log only when flags.hook, so tool hits have never been recorded — one tool-source query exists in the entire history, a miss.\n- Two copies of a shape drift silently; the parity test is the only thing that makes it loud.\n- Findability checks REPORT, never reject: the capture prompt chains writes with && so a non-zero exit silences every note behind the failing one.\n- Tool-mode (kb search) quality is still invisible in the inject log: cli.ts logs it only when flags.hook, so tool hits have never been recorded.\n- Lane 2 (sidecar symbol inventory) is tool-mode ONLY — search.ts:488. Stored anchor symbols are the only symbol evidence hook mode has.\n- Aliases have no derived fallback anywhere; a note without them is reachable only by its exact title.\n- Two copies of a shape drift silently; tests/kb-shape-parity.test.ts is what makes it loud.","backlinks":[],"anchorLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches","how-a-note-s-freshness-gets-claimed-and-checked","how-an-agent-finds-out-it-under-captured","how-notebook-capture-fires-v5-trigger-timed","src-kb-search-ts-272e86f3","what-counts-as-the-query-for-notebook-recall","hooks-capture-payload-mjs-9f99e00d","src-kb-cli-ts-99b5d5ba"]},{"id":"where-the-required-note-shape-is-defined-and-how-it-reaches","type":"flow","character":null,"title":"where the required note shape is defined, and how it reaches every surface","aliases":["one note shape table","note-shape.mjs","required note fields","shape drift","hooks cannot import dist","NOTE_CHECKS","missingInSpec missingInNote","add a note requirement"],"status":"active","updated":"2026-08-02T18:19:44.664Z","edits":5,"anchors":[{"path":"hooks/note-shape.mjs","hash":"sha256:c42cfbd8820f","state":"changed"},{"path":"src/kb/write-guide.ts","hash":"sha256:bfd678a3e8b5","state":"changed"},{"path":"hooks/capture-payload.mjs","hash":"sha256:eff608418ff7","state":"changed"},{"path":"src/server/mcp.ts","hash":"sha256:427809766ada","state":"changed"},{"path":"src/kb/repair.ts","hash":"sha256:ce2b42070900","state":"changed"},{"path":"src/kb/cli.ts","hash":"sha256:a5bb3cf1046d","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"There is exactly ONE definition of what a note must contain — hooks/note-shape.mjs — and it lives in hooks/ rather than src/ because the capture hooks are plain .mjs that run straight from the package and never import from dist/; the TypeScript side reaches INTO hooks/ instead (the pattern lint.ts already uses with ignore.mjs), which is what lets one file serve the hook, the CLI and the MCP server. Adding a requirement is one NOTE_CHECKS entry and it reaches all five consumers at once: the write guide, the capture prompt's inlined shapes, the MCP kb_write description, the write-time warning, and kb repair's detection. Each entry carries TWO predicates on purpose — missingInSpec reads the JSON an agent just sent, missingInNote reads the folded note on disk; they cannot be collapsed, so they sit adjacent and a change to what 'missing' means has to be made in both, in view of each other. Verified this session: tsc's rootDir does NOT reject the cross-directory import (a .d.mts beside the .mjs supplies the types), and vitest imports the same file from both TS and .mjs test code.\n\n## Steps\n\n1. `hooks/note-shape.mjs` (`SPEC_SHAPES`, `NOTE_CHECKS`, `shapesBlock`, `requiredFieldsLine`, `checksForSpec`, `checksForNote`, `unanchoredSteps`, `stepsMissingAfterWrite`) — the single table plus its renderers\n2. `src/kb/write-guide.ts` (`WRITE_GUIDE_SHAPES`, `missingFieldsWarning`, `flowStepsWarning`) — renders the guide and the write-time warning from checksForSpec\n3. `hooks/capture-payload.mjs` (`buildCapturePayload`) — renders shapesBlock({compact:true}) inline — the copy that used to drift\n4. `src/server/mcp.ts` (`TOOL_DEFINITIONS`) — kb_write description injects requiredFieldsLine(); this copy never said aliases at all\n5. `src/kb/repair.ts` (`planRepairs`, `repairWorklist`) — runs missingInNote over the folded notebook\n\n## Invariants\n\n- Hooks NEVER import from dist/ — a shared table must live in hooks/ or the capture prompt cannot see it.\n- Renderings may differ in prose (compact drops it) but never in fields; tests/kb-shape-parity.test.ts asserts every required field appears in the example an agent copies.\n- A shipped `check` id is never removed — kb repair --json consumers filter by it; retire one by making its predicate always false.\n- missingInSpec and missingInNote read different shapes and cannot be merged; both live in the same entry so neither is edited alone.\n- Every write-time WARN is judged against the FOLDED note, never the record just sent — `op: put` appends and the fold merges, so a partial update omits fields it still has. Both call sites (src/kb/cli.ts and src/server/mcp.ts) load the folded note and must pass it to every warning; a warning that takes only the spec will misfire on updates.","backlinks":["hooks-capture-payload-mjs-9f99e00d","hooks-note-shape-mjs-d85ce294","src-kb-cli-ts-99b5d5ba","src-kb-repair-ts-a197bcce","src-kb-write-guide-ts-c9053885","src-server-mcp-ts-18031783"],"anchorLinks":["why-a-note-cannot-be-found-by-the-symbol-it-is-about","how-an-agent-finds-out-it-under-captured","how-notebook-capture-fires-v5-trigger-timed","hooks-capture-payload-mjs-9f99e00d","hooks-note-shape-mjs-d85ce294","how-the-moves-together-signal-reaches-gs-without-going-throu","how-to-wire-a-new-query-command-to-both-cli-and-mcp-surfaces","src-kb-cli-ts-99b5d5ba"]},{"id":"what-counts-as-the-query-for-notebook-recall","type":"flow","character":null,"title":"what counts as \"the query\" for notebook recall","aliases":["why was this note injected","note about a file I never mentioned","path match boost","harness telemetry in the prompt","grep pattern became the query","my shell command got injected"],"status":"active","updated":"2026-08-02T18:19:44.656Z","edits":5,"anchors":[{"path":"src/kb/search.ts","hash":"sha256:0f8e8b280da3","state":"changed"},{"path":"src/kb/cli.ts","hash":"sha256:c2ff1ee17d47","state":"changed"},{"path":"hooks/kb-recall.mjs","hash":"sha256:a82ef1040d11","state":"changed"},{"path":"hooks/recall-query.mjs","hash":"sha256:4a146b7ec842","state":"fresh"},{"path":"hooks/preguard-handler.mjs","hash":"sha256:f136ff422137","state":"fresh"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"The text the recall matcher scores is NOT what the user typed. Two distinct feeds prove it. (1) Every host wraps the user's words in editor/subagent telemetry, which is file- and symbol-rich and hijacks the path-name override in search.ts (+100, bypassing the rarity and suppression gates) — fixed 2026-07-29 in the HOOKS via recall-query.mjs, never in search.ts, because the override is opts.strongOnly-gated and tool-mode kb search must keep trusting a path the user typed literally. (2) OBSERVED 2026-07-29 in inject-log.jsonl: the PostToolUse nudge path also drives kb search --hook, so an AGENT's raw grep pattern lands in the log as a query and can inject — the record at 17:01:29Z has query 'rareCount |let rare = false' (a shell grep pattern, not a prompt) with implant:true against hooks-capture-payload-mjs. So an agent-term recall channel already exists in partial form; anyone measuring 'should we add grep terms as a signal' must subtract what the nudge already does.\n\n## Steps\n\n1. `hooks/kb-recall.mjs` (`recallQuery`) — UserPromptSubmit feed — strips harness wrappers BEFORE the 2000-char slice\n2. `hooks/recall-query.mjs` (`stripHarnessWrappers`) — shared prompt hygiene for all three hosts; named tags only, so real questions survive\n3. `hooks/preguard-handler.mjs` (`canonicalFindKey`) — the OTHER feed — wired on every Bash call, and the nudge path puts tool-call text into recall\n4. `src/kb/cli.ts` — --hook: strongOnly search, writes every decision to inject-log.jsonl (the evidence for both feeds)\n5. `src/kb/search.ts` (`kbSearch`) — scores whatever arrives; the path override treats any contained anchor path as the user naming that file\n\n## Invariants\n\n- inject-log.jsonl query strings are NOT all user prompts — some are agent tool-call text, so any corpus study over it must classify the feed first\n- stripping belongs in the hooks; search.ts stays feed-agnostic so tool mode keeps honouring literally-typed paths","backlinks":[],"anchorLinks":["why-a-note-cannot-be-found-by-the-symbol-it-is-about","hooks-kb-recall-mjs-bb2f72e8","hooks-preguard-handler-mjs-e53f8b7b","hooks-recall-query-mjs-6503796e","how-a-note-s-freshness-gets-claimed-and-checked","how-an-agent-finds-out-it-under-captured","how-notebook-capture-fires-v5-trigger-timed","how-the-co-change-signal-reaches-an-agent-that-never-runs-gs"]},{"id":"tests-kb-shape-parity-test-ts-afd06d3a","type":"file","character":"single","title":"tests/kb-shape-parity.test.ts","aliases":["anchors come from steps","TOOL_DEFINITIONS","required note fields","spec shape drift","note shape drift test","every surface renders from table","warning folded note test","write time warning contract","requiredFieldsLine assertion","repair-aliases drift guard","identityAliases field name pin","pagination contract test","repair-aliases text drift","kb_repair_aliases description mismatch"],"status":"active","updated":"2026-08-02T18:19:44.646Z","edits":5,"anchors":[{"path":"tests/kb-shape-parity.test.ts","symbols":["shapeBlock","REQUIRED","SPEC_SHAPES","NOTE_CHECKS","checksForSpec","requiredFieldsLine","missingFieldsWarning","flowStepsWarning","unanchoredSteps","shapesBlock","TOOL_DEFINITIONS","aliasRepairWorklist","USER_COMMANDS","REPAIR_ALIASES_COMMAND"],"hash":"sha256:614e291ace82","state":"fresh"}],"freshness":"fresh","dir":"tests","outLinks":[],"body":"Pins every consumer to hooks/note-shape.mjs so a required field cannot go missing from one surface again: each spec example must contain the fields its own checksForSpec demands, the write guide and capture prompt must both carry every example verbatim, the MCP kb_write description must contain requiredFieldsLine(), and a dedicated suite asserts no surface says a flow's anchors come from its steps. It also carries the write-time warning contracts (flowStepsWarning/missingFieldsWarning judge the fold, not the spec). A newer describe block, 'kb repair-aliases surfaces agree with each other and with the frozen field name', extends the same drift-guard idea to a field note-shape.mjs's SPEC_SHAPES never covers directly: identityAliases only appears in the repair-aliases worklist/MCP tool/USER_COMMANDS text, not in any spec an agent writes, so it pins those three surfaces to each other by hand (the exact 'identityAliases' string, the empty-notebook sentinel 'No file/flow notes to reconcile.', the offset/limit MCP schema props, and the 'no aliases at all' line distinguishing it from kb repair's own missing-identity-aliases check) rather than deriving them from a table the way SPEC_SHAPES lets the rest of this file do.","backlinks":[],"anchorLinks":["why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"tests-kb-search-write-test-ts-0c3c0c6d","type":"file","character":"single","title":"tests/kb-search-write.test.ts","aliases":["ranking contract test","stale outranks fresh","superseded hard tier","kb search unit tests","metadata write test","verified stamp test","kb write unit tests"],"status":"active","updated":"2026-08-02T18:19:44.638Z","edits":4,"anchors":[{"path":"tests/kb-search-write.test.ts","symbols":["kbSearch","kbWrite","renderCompactPage","fakeIndex","writeRepoFile","seedLesson","strongOnly"],"hash":"sha256:96be90d6f342","state":"changed"}],"freshness":"changed","dir":"tests","outLinks":[],"body":"Unit tests for kb search ranking and kb write. Holds two contract regressions worth knowing before editing either area: 'staleness LABELS but does not rank' asserts a stale note covering every query term outranks a fresher note covering fewer while a superseded note stays last (this test asserted the OPPOSITE order until 2026-07-30, so an inverted expectation here means freshness has crept back into the sort); and 'a metadata-only write does NOT re-verify the anchor' asserts a title-only write records an empty `verified` and no hash, while a write carrying a summary re-stamps. Both fixtures write real files and drift them, so they exercise live hashing rather than mocked anchor state.","backlinks":[],"anchorLinks":[]},{"id":"tests-kb-retrieval-live-test-ts-f5d387f6","type":"file","character":"single","title":"tests/kb-retrieval-live.test.ts","aliases":["retrieval regression tests","injection floor tests","calibration tests","single carrier exemptions","tier number assertion","retrieval test without notesIndex","admission contract test"],"status":"active","updated":"2026-08-02T18:19:44.629Z","edits":6,"anchors":[{"path":"tests/kb-retrieval-live.test.ts","symbols":["kbSearch","notesIndex","seedCorpus","touch","noteLine","strongOnly"],"hash":"sha256:1ecfff69d579","state":"changed"}],"freshness":"changed","dir":"tests","outLinks":[],"body":"Live retrieval tests over a real seeded notebook — the hook-mode admission contracts live here, so this is the file that tells you whether a ranking change is intentional or a regression. Two things to know before editing. First, most tests here call kbSearch WITHOUT notesIndex, which means convergence cannot fire and every hit is name-channel-only; a change that penalises name-only hits will fail tests that look unrelated (stemming, matcher repairs) for that reason alone rather than because stemming broke. Second, 'convergence stands alone only when the term is also rare' asserted the OPPOSITE contract until 2026-07-31 — it was named 'convergence bypasses the suppression gate' and its setup deliberately pushes a term out of the rare band with six body-only decoy notes so that convergence is the only thing that could admit it. That exact shape is now the junk case, so the test asserts both halves: common+converged stays suppressed, rare+converged still injects on a single carrier. If you are relaxing the rarity requirement, this test is the one that should stop you.","backlinks":[],"anchorLinks":[]},{"id":"tests-kb-fold-test-ts-363d2ac8","type":"file","character":"single","title":"tests/kb-fold.test.ts","aliases":["fold determinism test","alias cap regression","shuffled records fold identically","capIdentity test"],"status":"active","updated":"2026-08-02T18:19:44.612Z","edits":4,"anchors":[{"path":"tests/kb-fold.test.ts","symbols":["fold","stableStringify","capAliases","ALIAS_MAX","ALIAS_MAX_WORDS","put"],"hash":"sha256:8e41124f3672","state":"fresh"}],"freshness":"fresh","dir":"tests","outLinks":[],"body":"fold.ts unit tests. Added a case for fold(..., {capIdentity:false}): asserts the uncapped result is a strict superset of the capped one and includes aliases the cap would have dropped (reuses the same 5-write/30-alias fixture the existing cap test already builds).","backlinks":[],"anchorLinks":[]},{"id":"src-watcher-ts-0eb096ed","type":"file","character":"single","title":"src/watcher.ts","aliases":["watcher loop","keeper self-write loop","excluded dir watcher"],"status":"active","updated":"2026-08-02T18:19:44.604Z","edits":6,"anchors":[{"path":"src/watcher.ts","symbols":["startWatcher","isUnderExcludedDir","EXTENSION_TO_LANGUAGE","onNotebookRaw","BatchHandler"],"hash":"sha256:a2b29ceb0b4d","state":"fresh"}],"freshness":"fresh","dir":"src","outLinks":[],"body":"Debounced (400ms) recursive fs.watch wrapper that feeds the keeper two separate routes: notebook .raw/*.jsonl events go to onNotebookRaw, everything else is filtered to indexed extensions and goes to the code batch. The non-obvious hazard, verified here: .html and .md ARE both present in EXTENSION_TO_LANGUAGE, so the keeper's own writes under .coldstart/ (it regenerates notebook/index.html and re-renders derived .md on every notes refresh) used to clear the extension filter and re-enter the code batch as 'repo changed' - a self-feeding loop that re-saved the cache and regenerated the view about every 5s. Fixed in #92 by the isUnderExcludedDir guard, which mirrors the walker's hidden/excluded-dir rules and is shared with patch so the rule cannot drift. The .raw/*.jsonl route is checked BEFORE the extension filter, which is why real note writes still refresh the view.","backlinks":[],"anchorLinks":[]},{"id":"src-unwire-ts-aab82fa6","type":"file","character":"single","title":"src/unwire.ts","aliases":["unwire","deinit","leftover wiring","uninstall","repair-notes removal","init unwire symmetry","rmEmptyDirs","strip slash commands","no unwire tests","repair-aliases sweep"],"status":"active","updated":"2026-08-02T18:19:44.595Z","edits":4,"anchors":[{"path":"src/unwire.ts","symbols":["runUnwire","stripHooksConfig","unwireJsonMcp","removeFile","rmEmptyDirs"],"hash":"sha256:292d6038573c","state":"fresh"}],"freshness":"fresh","dir":"src","outLinks":[],"body":"The explicit reverse of init. Now sweeps THREE user-invoked commands (capture-notes, repair-notes, repair-aliases) across all three hosts using the same REPAIR_ALIASES_COMMAND constant init.ts exports — symmetric with how init writes them, verified live (init writes 2 command files per host, unwire removes both and prunes the now-empty skill dir).","backlinks":[],"anchorLinks":[]},{"id":"src-kb-write-guide-ts-c9053885","type":"file","character":"single","title":"src/kb/write-guide.ts","aliases":["symbols missing from file notes","empty anchor symbols","write guide shapes","missing aliases warning","under-indexed note","required note fields","symbols in file note","put is not overwrite","warning judges folded note","kb write guide","mcp cli parity","flow evidence warning"],"status":"active","updated":"2026-08-02T18:19:44.544Z","edits":14,"anchors":[{"path":"src/kb/write-guide.ts","symbols":["WRITE_GUIDE_SHAPES","flowEvidenceWarning","flowStepsWarning","writeGuideCli","writeGuideMcp","missingFieldsWarning","flowEvidenceCount"],"hash":"sha256:bfd678a3e8b5","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"Single source for the kb write spec guide and every write-time WARN, shared by the CLI (kb write, no spec -> guide) and MCP kb_write (parity: identical semantics, only the howto tail differs). flowEvidenceCount scans tmpdir capture markers from ALL THREE hosts (coldstart-kb-/coldstart-cursor-kb-/coldstart-codex-kb- prefixes) for the session's content-read set. This file NO LONGER OWNS THE SHAPES: WRITE_GUIDE_SHAPES is shapesBlock() from hooks/note-shape.mjs and missingFieldsWarning is a loop over checksForSpec(type), so what warns here and what kb repair detects on disk cannot disagree. THE RULE EVERY WARN HERE MUST FOLLOW, learned twice: judge the FOLDED note, never the record just sent. `op: put` appends a record and the note is the fold of the whole log (aliases/anchors union, summary/steps LWW), so a partial update legitimately omits fields it is not changing. flowStepsWarning was fixed for this first — it takes the folded note and delegates to stepsMissingAfterWrite. missingFieldsWarning had the identical defect four lines down and was fixed 2026-08-01: it now takes an optional `after` and a field counts as missing only when missingInSpec(spec) AND missingInNote(after). The AND matters — swapping outright to missingInNote would make the repair-only checks (flow-no-steps, flow-steps-unanchored, both missingInSpec:()=>false) start firing at write time and duplicate flowStepsWarning. With no `after` it falls back to the spec, which is exact for a create.\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — renders the guide and the write-time warning from the table","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed","where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"src-kb-session-worklist-ts-dc6104ba","type":"file","character":"single","title":"src/kb/session-worklist.ts","aliases":["capture coverage","under-capture reporting","worklist manifest reader","coverage denominator fresh notes","flow does not count as file note"],"status":"active","updated":"2026-08-02T18:19:44.526Z","edits":4,"anchors":[{"path":"src/kb/session-worklist.ts","symbols":["noteCoverage","specPaths","manifestPath","load"],"hash":"sha256:4e1e7af12a3b","state":"missing"}],"freshness":"missing","dir":"src/kb","outLinks":[],"body":"Reads the session worklist manifest that hooks/capture-payload.mjs drops in tmpdir and turns it into the coverage line `kb write` prints. noteCoverage(sid, spec) appends this write's paths to the manifest's `wrote` array, then reports done/outstanding. Two deliberate arithmetic choices: files whose note is already fresh are EXCLUDED from the denominator (counting them makes full coverage unreachable and the ratio meaningless, though they are still reported as 'N more already had a fresh note'), and specPaths() credits only file-single/file-hub — a flow does NOT count as a note for its step files, because a flow is not the per-file note rule 5 asks for. Everything is best-effort: no session, no manifest, a malformed one, or one older than 24h (a resumed session) all return null rather than throwing. The manifest lives in tmpdir and never in the repo, so it cannot be committed and needs no ignore rule; it is scratch state for one session, not a record, and nothing about it leaves the machine.","backlinks":[],"anchorLinks":["how-an-agent-finds-out-it-under-captured"]},{"id":"src-kb-search-ts-272e86f3","type":"file","character":"single","title":"src/kb/search.ts","aliases":["lane 2 anchor admission phantom evidence","tool mode vs hook mode search gates","notebook search precision","domain word rarity","anchor channel inflates df","hook mode rarity gate","ecommerce domain noun problem","rareMax vs minority threshold","hardEvidence flag"],"status":"active","updated":"2026-08-02T18:19:44.517Z","edits":19,"anchors":[{"path":"src/kb/search.ts","symbols":["kbSearch","KbSearchOptions","KbSearchHit","KbSearchResult","strongOnly","HOOK_MIN_CARRIERS","NAME_ONLY_MIN_DENSITY","rarityMax","isCodeShaped","wordHit","hookNameNorm","haystacksFor","resolveTermToAnchors","resolveTermToSymbolFiles","symbolTokens","absenceVerdict","renderSearchPage","renderCompactPage","gistLines","shouldImplantTop","stem","renderResultsPage"],"hash":"sha256:51e1afe7535c","state":"changed"},{"path":"hooks/capture-payload.mjs","hash":"sha256:cd323aa5c322","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"The notebook search engine, in two modes chosen by strongOnly (hook = precision-first admission gates; tool = BM25, no gates). HOOK-MODE RARITY (separate from the tool-mode lane-2 phantom evidence already noted here): df at L430 is document frequency across name+anchor+body COMBINED, so a term that is a widely-declared anchor symbol inflates its own df even when it never appears in prose. Two different thresholds use it: eligibility (`minority`, L510, df*2<=notes.length, ~50%) drops a term from scoring entirely if it fails; hardEvidence (`rareMax=ceil(N/10)`, L178/516/543) requires the stricter top-10% band before a symbol-convergence hit can admit a note alone, UNLESS the term is code-shaped (isCodeShaped, L278) which bypasses rarity outright. Risk: in a domain-concentrated codebase a real entity name (e.g. an ecommerce Order/Shipment declared as an anchor symbol on many file notes) can fail hardEvidence's rarity band via the SAME mechanism that correctly suppresses generic filler (run/status/write) -- notebook-wide df does not distinguish 'generic English' from 'domain-central but frequent'. Untested on this repo's own notebook (too small/self-referential); needs a real domain-heavy notebook (e.g. ARCHES) to size.","backlinks":[],"anchorLinks":["why-a-note-cannot-be-found-by-the-symbol-it-is-about","hooks-capture-payload-mjs-9f99e00d","how-a-note-s-freshness-gets-claimed-and-checked","how-an-agent-finds-out-it-under-captured","how-notebook-capture-fires-v5-trigger-timed","what-counts-as-the-query-for-notebook-recall","where-the-required-note-shape-is-defined-and-how-it-reaches"]},{"id":"src-kb-raw-log-ts-ba590d64","type":"file","character":"single","title":"src/kb/raw-log.ts","aliases":["anchor hash written here","appendRecord","raw log append","verified triggers hashing","note provenance stamp"],"status":"active","updated":"2026-08-02T18:19:44.501Z","edits":3,"anchors":[{"path":"src/kb/raw-log.ts","symbols":["appendRecord","readLog","listIds","rawPath","rawDir","notebookDir","KB_RAW_VERSION","AppendOptions","ReadLogResult"],"hash":"sha256:0815f155b48a","state":"fresh"}],"freshness":"fresh","dir":"src/kb","outLinks":[],"body":"Appends one JSON line per note record and is the ONLY producer of anchor hashes: for every path listed in a record's `verified`, appendRecord hashes that file at append time and writes the hash into the record's anchor (creating the anchor if absent). Agents never author hashes. It also stamps `v`, `ts`, and the git `head` as provenance, overriding any agent-supplied head. A record with an empty or absent `verified` carries no hash at all, which is what lets the fold keep a note's earlier verification intact.","backlinks":[],"anchorLinks":["how-a-note-s-freshness-gets-claimed-and-checked"]},{"id":"src-kb-freshness-ts-8278f01b","type":"file","character":"single","title":"src/kb/freshness.ts","aliases":["evidence changed","note freshness","stale note","is a note still valid","does freshness depend on git","branch switch note freshness"],"status":"active","updated":"2026-08-02T18:19:44.492Z","edits":3,"anchors":[{"path":"src/kb/freshness.ts","symbols":["hashFile","stampAnchors","freshnessLine","anchorsAllMissing","RenameMap"],"hash":"sha256:7a81ff09fde6","state":"fresh"}],"freshness":"fresh","dir":"src/kb","outLinks":[],"body":"The hash tripwire behind [fresh]/[evidence changed]. Verified 2026-07-24: freshness has NO git dependency whatsoever — grepping this file for 'head' returns zero matches. hashFile is a whole-file raw-byte SHA-256 (first 12 hex, never per-symbol) and stampAnchors compares each anchor's stored hash against the live file NOW, so an anchor's recorded `head` commit is never consulted here. Consequence worth knowing before assuming otherwise: note freshness is content-addressed, not commit-addressed, and therefore survives branch switches and would survive notes living outside git entirely. A missing file resolves through the keeper's rename map only when the destination's live content still equals the recorded hash, so a stale rename hint can never resurrect a note wrongly.","backlinks":[],"anchorLinks":[]},{"id":"src-kb-cli-ts-99b5d5ba","type":"file","character":"single","title":"src/kb/cli.ts","aliases":["flow decision one call","kb write decision flag","coverage line kb write","N of M files noted","warnings never fail write","exit code 3 candidates","kb verb dispatcher","exit code 3","kb write warnings order","repair-aliases verb","offset limit flags"],"status":"active","updated":"2026-08-02T18:19:44.475Z","edits":15,"anchors":[{"path":"src/kb/cli.ts","symbols":["cmdWrite","cmdSearch","runKb","recordFlowDecision","parseKbArgs","cmdLookup","cmdLint","requireNotebook","USAGE","missingFieldsWarning","flowStepsWarning"],"hash":"sha256:57f5ef7e46af","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"The kb verb dispatcher. New verb `repair-aliases [--offset N] [--limit 10] [--json]` calls planAliasRepair/aliasRepairWorklist from alias-repair.ts — pure read, paginated, never writes. Like `repair`, it deliberately does not call ensureKeeper (reads only the folded notebook).\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — exposes repair detection as a CLI verb","backlinks":[],"anchorLinks":["how-an-agent-finds-out-it-under-captured","what-counts-as-the-query-for-notebook-recall","where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about"]},{"id":"site-index-html-f8b5f3ae","type":"file","character":"single","title":"site/index.html","aliases":["meta keywords","JSON-LD structured data","og image","landing page marketing site","blog cards","featured posts","article-card","SEO"],"status":"active","updated":"2026-08-02T18:19:44.416Z","edits":10,"anchors":[{"path":"site/index.html","hash":"sha256:405d3b4d0b9b","state":"changed"}],"freshness":"changed","dir":"site","outLinks":[],"body":"The #blog section near the end features exactly TWO hand-picked article cards linking into site/blog/; they are hardcoded and do not read from blog.html, so adding or renaming a post silently leaves stale links here. Those cards are styled by .article-card in the sibling styles.css, NOT by docs.css which the blog pages themselves use.","backlinks":[],"anchorLinks":[]},{"id":"site-docs-css-54e94142","type":"file","character":"single","title":"site/docs.css","aliases":["ch unit measure bug","essay column alignment","figure wider than text","diagram overflows the column","svg figure","hand drawn diagram","feTurbulence","sketch style","figcaption monospace","prefers-color-scheme","measure","dark mode"],"status":"active","updated":"2026-08-02T18:19:44.406Z","edits":11,"anchors":[{"path":"site/docs.css","hash":"sha256:8b82bb1e4718","state":"changed"}],"freshness":"changed","dir":"site","outLinks":[],"body":"The shared stylesheet for BOTH non-landing surfaces: docs.html (sidebar reference layout, body.docs-page) and every blog page (body.essay-page). The landing page uses styles.css instead, so .article-card on index.html is NOT styled here. The blog section at the end scopes its OWN theme tokens to body.essay-page: light by default with a prefers-color-scheme dark override, which is why docs.html stays dark while the blog follows the reader's OS. --measure MUST stay an absolute length (680px) and never ch: ch resolves against each element's own font-size, so a 46px h1 and a 19px p computed different widths and margin-inline:auto then centred every child of .essay-article on a different left edge (fixed in #105). Two widths govern essay layout and they differ on purpose: `.essay-article > *` constrains every child to --measure, while `.essay-article > .wide` opts out to min(920px,100%) — that 240px gap is why figures visibly overhang the prose column. The FIGURES block (added #111) styles inline-SVG diagrams: the hand-drawn look is a seeded feTurbulence displacement applied per figure, and the filtered <g> must contain ONLY shapes because displaced text is unreadable. It also overrides `.essay-article figcaption`, whose base rule sets font-family:var(--mono) and rendered diagram captions as code comments.","backlinks":[],"anchorLinks":[]},{"id":"scripts-replay-recall-gates-mjs-6f8d13d2","type":"file","character":"single","title":"scripts/replay-recall-gates.mjs","aliases":["recall replay harness","measure recall outside coldstart","compare two builds","hook mode assertion","tool mode replay","noMissLog replay"],"status":"active","updated":"2026-08-02T18:19:44.397Z","edits":3,"anchors":[{"path":"scripts/replay-recall-gates.mjs","symbols":["kbSearch","loadKbNotesIndex","loadAll","arg","strongOnly","noMissLog","notesIndex"],"hash":"sha256:923c50687d2a","state":"changed"}],"freshness":"changed","dir":"scripts","outLinks":[],"body":"Replays a notebook's logged prompts through kbSearch and diffs two builds, so a recall change can be measured on a notebook that is NOT this repo's — the reason it exists is that coldstart's own notebook is ~44 notes about coldstart, where the junk cause the gates target barely occurs. Used by humans only: nothing imports it, it is invoked as `node scripts/replay-recall-gates.mjs --root <repo> --dist <coldstart>/dist [--mode hook|tool] [--out f.json]`, then `--compare before.json after.json`. Its reason for printing the options it used is a real incident: KbSearchOptions has NO `hook` field, so {hook:true} silently runs TOOL mode with convergence off, which voided an entire measurement — the header line is the assertion that the run is the mode you think. `--mode tool` exists because every admission gate in kbSearch is wrapped in `if (opts.strongOnly)` while the fold runs upstream of both modes, so an alias-side change can move `kb search` results while looking invisible in hook mode. Read-only on the target repo: it passes noMissLog so the replay does not pollute that repo's metrics.","backlinks":[],"anchorLinks":[]},{"id":"how-an-agent-finds-out-it-under-captured","type":"flow","character":null,"title":"how an agent finds out it under-captured","aliases":["capture coverage","under-capture reporting","N of M files noted","worklist manifest","capture coverage line"],"status":"active","updated":"2026-08-02T18:19:44.379Z","edits":5,"anchors":[{"path":"hooks/capture-payload.mjs","hash":"sha256:ea825a4f366c","state":"changed"},{"path":"src/kb/session-worklist.ts","hash":"sha256:4e1e7af12a3b","state":"missing"},{"path":"src/kb/cli.ts","hash":"sha256:0e915261a609","state":"changed"}],"freshness":"missing","dir":"hooks","outLinks":[],"body":"An agent's own note count is the one thing it cannot check while writing, because kb write sees one spec at a time and never saw the worklist — so the worklist is handed forward out-of-band, through a tmpdir file keyed by session id, and comes back as a ratio printed with each write. The import graph cannot see this link at all: hooks/capture-payload.mjs (an .mjs hook) and src/kb/session-worklist.ts (the TS CLI) never import each other and agree only on a filename template, tmpdir/coldstart-kb-worklist-<sid>.json. Change the name or the record shape on one side and coverage silently stops printing — there is no error, because every read is best-effort by design.\n\n## Steps\n\n1. `hooks/capture-payload.mjs` (`buildCapturePayload`, `recordWorklistManifest`, `worklistManifestPath`) — the one point every host passes through — writes the manifest (path, tier, needsNote) as a side effect of building the prompt\n2. `src/kb/session-worklist.ts` (`noteCoverage`, `specPaths`) — reads it back, records this write, computes done vs outstanding\n3. `src/kb/cli.ts` (`cmdWrite`) — prints the line under the write's own output, so it lands mid-Bash-block while the agent is still writing\n\n## Invariants\n\n- The manifest filename and record shape are a contract between an .mjs hook and TS source that never import each other — change both sides together.\n- The session id the agent passes to `kb write --session` must be the same sid the capture prompt was built with, or there is no manifest and coverage is silent.\n- Silence is a valid outcome (no session, no manifest, stale, malformed) — coverage must never fail a write.\n- The denominator counts only files that needed a note; already-fresh files are excluded so full coverage stays reachable.","backlinks":[],"anchorLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches","why-a-note-cannot-be-found-by-the-symbol-it-is-about","hooks-capture-payload-mjs-9f99e00d","how-notebook-capture-fires-v5-trigger-timed","src-kb-cli-ts-99b5d5ba","src-kb-search-ts-272e86f3","src-kb-session-worklist-ts-dc6104ba","what-counts-as-the-query-for-notebook-recall"]},{"id":"how-a-note-s-freshness-gets-claimed-and-checked","type":"flow","character":null,"title":"how a note's freshness gets claimed and checked","aliases":["freshness stamping","evidence changed label","anchor hash","verified field","note marked fresh wrongly"],"status":"active","updated":"2026-08-02T18:19:44.371Z","edits":2,"anchors":[{"path":"src/kb/write.ts","hash":"sha256:38e7ca9a095a","state":"changed"},{"path":"src/kb/raw-log.ts","hash":"sha256:0815f155b48a","state":"fresh"},{"path":"src/kb/search.ts","hash":"sha256:7de67121ff4b","state":"changed"}],"freshness":"changed","dir":"src/kb","outLinks":[],"body":"A note's freshness is a CLAIM the writer makes, not something derived from the note's content: `verified` in a write spec is what causes a file's live hash to be recorded, and read time only compares that recorded hash against the file now. Nothing re-reads the file to decide if a note is still true, so whoever writes decides what counts as verified — which is why a write that carries no knowledge must not stamp.\n\n## Steps\n\n1. `src/kb/write.ts` (`kbWrite`) — decides what goes in `verified` — the anchor path is added only when the spec carries knowledge implying a read (summary/facets/body); an explicit `verified` from the agent always wins\n2. `src/kb/raw-log.ts` (`appendRecord`) — the only place a hash is produced: for each `verified` path it hashes the file NOW and writes it into the record's anchor. The agent never writes hashes itself\n3. `src/kb/search.ts` (`kbSearch`) — read time — stampAnchors compares each stored anchor hash against the live file and labels the result; since 2026-07-30 that label does not affect rank\n\n## Invariants\n\n- a record with no `verified` carries no hash, and the fold preserves the note's previous hash — so a metadata-only edit cannot reset freshness\n- freshness has no git dependency: the comparison is hash-vs-file, and `head` is provenance only","backlinks":[],"anchorLinks":["why-a-note-cannot-be-found-by-the-symbol-it-is-about","src-kb-raw-log-ts-ba590d64","src-kb-search-ts-272e86f3","src-kb-write-ts-d5968d80","what-counts-as-the-query-for-notebook-recall","why-a-file-note-s-extra-anchors-can-never-carry-symbols"]},{"id":"hooks-trigger-mjs-36ac51eb","type":"file","character":"single","title":"hooks/trigger.mjs","aliases":["arm threshold","descent one quiet stop","synthesis counts as quiet","surge removed","cap fires inject","T_ARM","MIN_FILES","score threshold","arming","fresh note discount","arm threshold too high","T_ARM unreachable","only fires on commit","head-drift starves descent","armed false forever","quiet stops no capture","stop hook firing rate low","why no notes captured"],"status":"active","updated":"2026-08-02T18:19:44.362Z","edits":23,"anchors":[{"path":"hooks/trigger.mjs","symbols":["step","initialState","T_ARM","T_CAP","MIN_FILES","MIN_FILES_ARM","DESCENT_QUIET","SETTLE_ACTIVE_STOPS","MAX_CAPTURE_FILES"],"hash":"sha256:d5d41f6fd44c","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Pure capture state machine, no I/O or clock. score = uncaptured files x1 + settled edits x2 + ALL stops since the last fire; arm at T_ARM=10 requiring >=1 active stop and >=1 uncaptured file (MIN_FILES_ARM); fires descent (1 quiet stop, INJECT), cap@20 (INJECT), or headDrift (BLOCK) - the last two keep the >=2-file MIN_FILES floor. CORRECTION 2026-07-24: this note previously blamed T_ARM=10 being 'out of range for normal session size'. That diagnosis was WRONG and is retracted. The real cause of descent never firing (104 stops / 24 fires / 0 descent) was a regression - the score's stop term read activeStops, and once synthesis turns were reclassified as quiet they no longer incremented it, so a discussion session had NO score-growth term at all and froze at ~4. T_ARM=10 is reachable and unchanged. Two other tempting fixes are also replay-falsified: stopping head-drift from resetting activeStops (still 0 descent fires), and lowering T_ARM.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"hooks-recall-seen-mjs-27dd2674","type":"file","character":"single","title":"hooks/recall-seen.mjs","aliases":["recall dedup state","seen ids file","pointer page id parsing","recall dedup","seen note ids","dedup state file","kb search --seen","same note injected twice","repeated note injection","compaction resets recall","compaction reset","transcript shrink detection","tmpdir not slash tmp"],"status":"active","updated":"2026-08-02T18:19:44.354Z","edits":11,"anchors":[{"path":"hooks/recall-seen.mjs","symbols":["readSeen","writeSeen","idsInPage","seenArgs","seenPath","transcriptSize"],"hash":"sha256:5797d3a94eb2","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Per-session recall dedup state shared by all three recall hooks (kb-recall.mjs, cursor-kb-recall.mjs, codex-kb-recall.mjs each import readSeen/writeSeen/idsInPage/seenArgs) so their behaviour cannot drift; created 2026-07-30 after the dedup shipped Claude-only and Cursor/Codex kept re-showing notes. State lives at os.tmpdir()/coldstart-recall-seen-<sid>.json — deliberately NOT literal /tmp, which is reserved for the find_nudge state file the nudge handler reads back by an agreed literal path. The seen set resets when the transcript file SHRINKS (a compact) rather than on a clock, because after a compact the session id is unchanged but the context is gone, so a previously-shown note is genuinely absent again; a host that exposes no transcript path (ephemeral Codex runs) simply never resets, which is the safe direction. idsInPage parses ids back out of the RENDERED pointer page via the '-> open: .../<id>.md' line, so the hooks need no structured output from the CLI. Every function is fail-open: any error leaves dedup off rather than blocking recall. Verified E2E on all three hooks this session: inject -> silent -> transcript shrinks -> inject, and inject -> silent with no transcript path.","backlinks":[],"anchorLinks":[]},{"id":"hooks-recall-query-mjs-6503796e","type":"file","character":"single","title":"hooks/recall-query.mjs","aliases":["harness boilerplate in the query","inject-log truncates the query"],"status":"active","updated":"2026-08-02T18:19:44.346Z","edits":14,"anchors":[{"path":"hooks/recall-query.mjs","symbols":["recallQuery","stripHarnessWrappers","HARNESS_TAGS"],"hash":"sha256:4a146b7ec842","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"Shared prompt->query hygiene for all three recall hooks: stripHarnessWrappers removes HARNESS_TAGS (system-reminder, ide_opened_file, ide_selection, ide_diagnostics, task-notification, local-command-caveat/stdout/stderr, command-name/message/args, user-prompt-submit-hook, browser_instruction, environment_context, user_instructions) as well-formed pairs (4 nested passes) plus leftover lone tags, and recallQuery strips BEFORE slicing to maxChars so a 1.5KB <ide_selection> cannot eat the budget ahead of the real question. Only the NAMED tag set is stripped; user-pasted XML is left alone; fail-open returns the raw text. CORRECTION 2026-08-02: this note previously said the file HAD NEVER RUN IN PRODUCTION because the wired hook pointed at an npm install with no recall-query.mjs - that is now FALSE; the published @cstart/coldstart 2.2.11 install ships hooks/recall-query.mjs, so the stripping is live. The measured finding behind it still stands: with the caveat block left in, the word 'commands' from the boilerplate 'while running local commands' added +7.9 to src/init.ts and promoted it rank 4 -> rank 2, via the path-name override in src/kb/search.ts. Still true for analysis: the inject-log stores only query.slice(0,200), so replays of logged queries score a CLEANER string than production used and measured junk rates understate the live rate.","backlinks":[],"anchorLinks":["what-counts-as-the-query-for-notebook-recall"]},{"id":"hooks-preguard-handler-mjs-e53f8b7b","type":"file","character":"single","title":"hooks/preguard-handler.mjs","aliases":["preguard does not block grep","PreToolUse hook produces no output on Bash","matcher widened but handler narrow"],"status":"active","updated":"2026-08-02T18:19:44.337Z","edits":5,"anchors":[{"path":"hooks/preguard-handler.mjs","symbols":["handle"],"hash":"sha256:f136ff422137","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"PreToolUse handler wired by init.ts with matcher `Bash|mcp__coldstart__find`, so it runs on EVERY Bash call — but it is only a dedup guard for `coldstart find`, not an anti-grep mechanism: canonicalFindKey(cmd) returns null for any non-find command and the handler returns null immediately, so grep/rg/git-grep/find shell through untouched with no output. Anti-grep spiral coverage lives in the PostToolUse nudge-handler.mjs instead (fires on tool===\"Grep\" or Bash matching SEARCH_RE), i.e. coldstart reacts AFTER the grep is paid for, never before. Denies only an exact repeat of a term-set+flags already run successfully this session (state in /tmp/find_nudge_{sid}_{aid}.json, written by the PostToolUse hook); fail-open on any error.","backlinks":[],"anchorLinks":["what-counts-as-the-query-for-notebook-recall"]},{"id":"hooks-note-shape-mjs-d85ce294","type":"file","character":"single","title":"hooks/note-shape.mjs","aliases":["one note shape table","required note fields","NOTE_CHECKS","SPEC_SHAPES","shapesBlock","requiredFieldsLine","shape drift","hooks cannot import dist","add a note requirement","missingInSpec missingInNote"],"status":"active","updated":"2026-08-02T18:19:44.328Z","edits":2,"anchors":[{"path":"hooks/note-shape.mjs","symbols":["SPEC_SHAPES","NOTE_CHECKS","shapesBlock","requiredFieldsLine","checksForSpec","checksForNote","unanchoredSteps","stepsMissingAfterWrite","REPAIR_CONTRACT_VERSION"],"hash":"sha256:c42cfbd8820f","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"],"body":"THE frozen definition of what a notebook note must carry to be findable, and the only place the spec shapes are written down. SPEC_SHAPES holds one example string per spec type (file-single/file-hub/flow/lesson) rendered by shapesBlock({compact}) — compact drops the prose for the capture prompt, both emit the SAME examples. NOTE_CHECKS holds one entry per way a note ends up unfindable, each with TWO predicates: missingInSpec (the JSON just written) and missingInNote (the folded note). It lives in hooks/ and not src/ because the capture hooks never import from dist/; the TS side imports it across directories and tsc's rootDir does NOT object (types come from note-shape.d.mts beside it). Template literals here open with a newline so dedent() can strip the common prefix and keep RELATIVE indentation — that is what makes a JSON example's continuation lines line up under it.\n\n## Part of\n\n- [[where-the-required-note-shape-is-defined-and-how-it-reaches]] — the table every other surface renders from","backlinks":[],"anchorLinks":["where-the-required-note-shape-is-defined-and-how-it-reaches"]},{"id":"hooks-kb-recall-mjs-bb2f72e8","type":"file","character":"single","title":"hooks/kb-recall.mjs","aliases":["recall dedup","recall hook claude","UserPromptSubmit recall","pointer page injection","pending capture first","same note injected twice","seen ids file","compaction resets recall","transcript shrink detection","cursor codex no dedup","seen ids"],"status":"active","updated":"2026-08-02T18:19:44.318Z","edits":11,"anchors":[{"path":"hooks/kb-recall.mjs","symbols":["recallQuery","takePendingCapture","readSeen","writeSeen","idsInPage","seenArgs"],"hash":"sha256:a82ef1040d11","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"UserPromptSubmit recall hook for Claude Code: shells out to `kb search --hook --max 3`, delivers any pending capture FIRST, and injects a pointer page (title + gist + path) as hookSpecificOutput.additionalContext. It reads input.transcript_path and passes it with the session id to the shared dedup helpers, harvesting shown ids back out of the RENDERED page so no structured output is needed. CORRECTS this note's own earlier claims (same day): the dedup state handling NO LONGER lives here — it moved to hooks/recall-seen.mjs so the three recall hooks cannot drift — and dedup is NO LONGER Claude-only; cursor-kb-recall.mjs and codex-kb-recall.mjs were ported in the same PR and verified to behave identically.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed","how-the-co-change-signal-reaches-an-agent-that-never-runs-gs","what-counts-as-the-query-for-notebook-recall"]},{"id":"hooks-ignore-mjs-1a07e730","type":"file","character":"single","title":"hooks/ignore.mjs","aliases":["coldstartignore","ignored files still in
