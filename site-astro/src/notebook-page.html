 find","files that never get notes"],"status":"active","updated":"2026-08-02T18:19:44.300Z","edits":3,"anchors":[{"path":"hooks/ignore.mjs","symbols":["loadIgnore","compileIgnore","DEFAULT_IGNORES","patternToRegex"],"hash":"sha256:6b5fde7d5dc4","state":"fresh"}],"freshness":"fresh","dir":"hooks","outLinks":[],"body":"The .coldstartignore matcher: shipped DEFAULTS (json, lockfiles, build output, .env*, binaries) live here in code; the user file at .coldstart/.coldstartignore (personal — gitignored via a committed .coldstart/.gitignore) only adds or negates on top. Scope is notebook-only PERMANENTLY (owner decision 2026-07-17): it filters capture evidence and note surfacing, NEVER find/gs navigation.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"hooks-cursor-kb-elicit-mjs-151bef1e","type":"file","character":"single","title":"hooks/cursor-kb-elicit.mjs","aliases":["cursor capture","followup_message","loop_count guard"],"status":"active","updated":"2026-08-02T18:19:44.273Z","edits":3,"anchors":[{"path":"hooks/cursor-kb-elicit.mjs","symbols":["extractCursorEvidence","segmentStatsCursor","step","initialState","writePendingCapture","buildCapturePayload","worklistEntries","cursorRoot","loadIgnore","freshNotedSet","gitHead","logCaptureEvent"],"hash":"sha256:5d466a726425","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"Cursor stop/subagentStop capture — the FULL v5 trigger port. Processes only loop_count===0 turns (followup_message re-fires stop); blocking channel is {followup_message}; non-blocking fires write the same pending file that cursor-kb-recall delivers via beforeSubmitPrompt additional_context. LIVE-UNTESTED as of 2.2.0 — validated against stored real transcripts and hook-level tests only.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"hooks-codex-kb-recall-mjs-cd4df13f","type":"file","character":"single","title":"hooks/codex-kb-recall.mjs","aliases":["codex recall hook","recall hooks differ","per host verification","ephemeral codex no transcript","session id binding"],"status":"active","updated":"2026-08-02T18:19:44.263Z","edits":4,"anchors":[{"path":"hooks/codex-kb-recall.mjs","symbols":["recallQuery","readSeen","writeSeen","idsInPage","seenArgs"],"hash":"sha256:bf6aec34f7cd","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"Codex recall hook. Verified this session: its handler body is structurally DIFFERENT from kb-recall.mjs and cursor-kb-recall.mjs even though all three share recallQuery and recall-seen — it early-exits when there is no notebook, has no pending-capture delivery, and wraps its search call in a plain try rather than the nested-if the other two use. A scripted edit written against the Claude/Cursor shape silently no-ops here (that happened this session: the shared-import patch applied, the call-site patch did not, and only a grep caught it). Verify per-host after any change that touches all three. The sanitized session id is bound once at the top of the handler and reused by both the dedup call and the find_nudge arming block, which previously re-derived its own unsanitized copy. Codex ephemeral runs expose no rollout path, so transcript_path is often absent and the compaction reset simply never fires.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"hooks-codex-kb-elicit-mjs-9cb55b18","type":"file","character":"single","title":"hooks/codex-kb-elicit.mjs","aliases":["codex capture one shot","stop fires at exit","codex hook trust re-prompt"],"status":"active","updated":"2026-08-02T18:19:44.253Z","edits":3,"anchors":[{"path":"hooks/codex-kb-elicit.mjs","symbols":["extractCodexEvidence","buildCapturePayload","worklistEntries","logCaptureEvent","loadIgnore"],"hash":"sha256:28f2f4216da9","state":"changed"}],"freshness":"changed","dir":"hooks","outLinks":[],"body":"Codex capture is deliberately ONE-SHOT v5, not the trigger machine: Codex's Stop fires once at session exit (TUI) or by construction (codex exec), so there is nothing to time and no next prompt for pending delivery — blocking {decision:block} at the single Stop, with a session-cumulative offered-set marker for resumed threads. Updating shipped hook files changes their hash, so Codex re-prompts its trust gate once after every coldstart update. LIVE-UNTESTED as of 2.2.0.","backlinks":[],"anchorLinks":["how-notebook-capture-fires-v5-trigger-timed"]},{"id":"github-workflows-npm-publish-yml-af3dbc50","type":"file","character":"single","title":".github/workflows/npm-publish.yml","aliases":["npm publish workflow","release trigger","publish to npm ci"],"status":"active","updated":"2026-08-02T18:19:44.232Z","edits":2,"anchors":[{"path":".github/workflows/npm-publish.yml","hash":"sha256:cccb7702c319","state":"fresh"}],"freshness":"fresh","dir":".github/workflows","outLinks":[],"body":"Publishes the package to npm. Triggers on `release: types: [created]` — NOT on a push or a tag by itself, so a `gh release create` (or the GitHub UI 'create release' action) is what actually fires it, not `git push --tags` alone. It does NOT run the test suite before publishing (no `npm test` step) — checkout, `npm ci`, `npm run build`, then `npm publish --provenance --access public` reading `NODE_AUTH_TOKEN` from the `NPM_TOKEN` secret. `--access public` is required alongside `--provenance` or npm refuses to generate provenance for what it would otherwise create as a private/restricted scoped package.","backlinks":[],"anchorLinks":[]},{"id":"dockerfile-6651ddff","type":"file","character":"single","title":"Dockerfile","aliases":["docker build sandbox","ripgrep postinstall download","ignore-scripts"],"status":"active","updated":"2026-08-02T18:19:44.221Z","edits":8,"anchors":[{"path":"Dockerfile","hash":"sha256:6a07ad14a17d","state":"fresh"}],"freshness":"fresh","dir":".","outLinks":[],"body":"Exists ONLY so MCP directory build sandboxes (Glama) can boot the server and run the introspection exchange — it is not a supported way to run coldstart, which is repo-local and needs a repository a container does not have. Two deliberate choices that look like mistakes: `npm ci --ignore-scripts` is there because the sole postinstall in the tree is @vscode/ripgrep downloading a prebuilt binary from GitHub, which network-restricted sandboxes may block — coldstart resolves a searcher at runtime and degrades to git grep/grep/Node scan, and this session confirmed a clean install leaves @vscode/ripgrep with no bin/ directory while the server still builds and answers; and `.dockerignore` excludes node_modules so the later `COPY . .` cannot clobber the modules from the npm ci layer. `npm prune --omit=dev` after the build was verified safe (53 packages dropped, all six tools still returned).","backlinks":[],"anchorLinks":[]}]};</script>
<script>
(function(){
  "use strict";
  const notes = DB.notes;
  const byId = new Map(notes.map(n=>[n.id,n]));
  const fileNotes = notes.filter(n=>n.type==='file');
  const flowNotes = notes.filter(n=>n.type==='flow');
  const $ = s=>document.querySelector(s);
  const esc = s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // clipboard: navigator.clipboard is unreliable on file:// — fall back to execCommand
  function copyText(t){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));return;}
    }catch(e){}
    fallbackCopy(t);
  }
  function fallbackCopy(t){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}
  }
  const RANK={fresh:0,unverified:1,changed:2,missing:3};
  const isStale=n=>n.freshness==='changed'||n.freshness==='missing';

  let state = { lens:'files', q:'', selected:null, view:'notes', staleOnly:false, open:new Set() };

  // ---- header stats ----
  $('#repoName').textContent = DB.summary.repo;
  $('#sTotal').textContent = DB.summary.total;
  $('#ctFiles').textContent = fileNotes.length;
  $('#ctFlows').textContent = flowNotes.length;
  // Both link kinds, deduped the same way buildGraph does, so the header
  // stat and the graph hint can never disagree.
  const edgeKeys = new Set();
  for(const n of notes) for(const l of [...n.outLinks,...(n.anchorLinks||[])])
    if(byId.has(l)&&l!==n.id) edgeKeys.add(n.id<l?n.id+'|'+l:l+'|'+n.id);
  const edgeCount = edgeKeys.size;
  $('#sLinks').textContent = edgeCount;
  const fr = DB.summary.byFreshness;
  const freshPct = Math.round(100*(fr.fresh||0)/DB.summary.total);
  $('#sFresh').textContent = freshPct+'%';
  const mb = $('#meterBar');
  const morder=[['fresh','--fresh'],['changed','--changed'],['unverified','--unver'],['missing','--missing']];
  mb.innerHTML = morder.filter(([k])=>fr[k]).map(([k,v])=>
    `<i style="width:${100*fr[k]/DB.summary.total}%;background:var(${v})"></i>`).join('');

  // stale chip
  const staleCount = notes.filter(isStale).length;
  const chip=$('#staleChip');
  if(staleCount){
    chip.classList.remove('all-fresh');chip.classList.add('has-stale');
    $('#staleLbl').textContent=`${staleCount} need review`;
  }else{
    $('#staleLbl').textContent='All fresh';
  }

  // ---- filter helpers ----
  function matches(n,q){
    if(!q) return true;
    const hay=(n.title+' '+n.id+' '+n.aliases.join(' ')+' '+n.anchors.map(a=>a.path+' '+(a.symbols||[]).join(' ')).join(' ')).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
  }
  function passFilter(n){
    if(state.staleOnly && !isStale(n)) return false;
    return matches(n,state.q);
  }

  // ================= FILE TREE =================
  function buildTree(){
    const root={name:'',path:'',children:new Map(),notes:[],dir:true};
    for(const n of fileNotes){
      const path=n.anchors[0]?n.anchors[0].path:n.title;
      const segs=path.split('/');
      let cur=root;
      for(let i=0;i<segs.length-1;i++){
        const s=segs[i], p=segs.slice(0,i+1).join('/');
        if(!cur.children.has(s)) cur.children.set(s,{name:s,path:p,children:new Map(),notes:[],dir:true});
        cur=cur.children.get(s);
      }
      cur.notes.push(Object.assign({leaf:segs[segs.length-1]},n));
    }
    // compact single-child dir chains (VSCode style), never the root
    const compact=(node,isRoot)=>{
      for(const c of node.children.values()) compact(c,false);
      if(!isRoot){
        while(node.children.size===1 && node.notes.length===0){
          const only=[...node.children.values()][0];
          node.name = node.name+'/'+only.name;
          node.path = only.path; node.notes = only.notes; node.children = only.children;
        }
      }
    };
    compact(root,true);
    // rollups
    const roll=(node)=>{
      let worst='fresh',cnt=node.notes.length;
      for(const n of node.notes) if(RANK[n.freshness]>RANK[worst]) worst=n.freshness;
      for(const c of node.children.values()){roll(c); if(RANK[c.roll]>RANK[worst]) worst=c.roll; cnt+=c.count;}
      node.roll=worst; node.count=cnt;
    };
    roll(root);
    return root;
  }
  const TREE=buildTree();

  function nodeHasMatch(node){
    if(node.notes.some(passFilter)) return true;
    for(const c of node.children.values()) if(nodeHasMatch(c)) return true;
    return false;
  }
  function ancestorsOf(id){
    // dir paths that contain the selected file note
    const n=byId.get(id); if(!n||n.type!=='file') return new Set();
    const path=n.anchors[0]?n.anchors[0].path:n.title;
    const set=new Set(); const segs=path.split('/');
    for(let i=1;i<segs.length;i++) set.add(segs.slice(0,i).join('/'));
    return set;
  }
  const FOLDER_SVG='<svg class="ficon" viewBox="0 0 16 16"><path d="M2 4.5h5l1.5 1.5H14v6.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>';
  const FILE_SVG='<svg class="ficon" viewBox="0 0 16 16"><path d="M4 1.5h5L13 5v9a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 14V2a.5.5 0 0 1 1-.5z"/><path d="M9 1.5V5h4"/></svg>';

  function renderTreeNode(node,depth,active,out){
    const dirs=[...node.children.values()].filter(nodeHasMatch)
      .sort((a,b)=>a.name.localeCompare(b.name));
    const leaves=node.notes.filter(passFilter).sort((a,b)=>a.leaf.localeCompare(b.leaf));
    const pad=8+depth*15;
    for(const d of dirs){
      const open = active || state.open.has(d.path);
      const dimIdx=d.name.lastIndexOf('/');
      const nm = dimIdx>-1 ? `<span class="seg-dim">${esc(d.name.slice(0,dimIdx+1))}</span>${esc(d.name.slice(dimIdx+1))}` : esc(d.name);
      out.push(`<button class="row dir ${open?'open':''}" data-dir="${esc(d.path)}" style="padding-left:${pad}px">
        <svg class="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>${FOLDER_SVG}
        <span class="lbl">${nm}</span>
        <span class="badge">${d.count}</span>
        ${d.roll!=='fresh'?`<span class="dot ${d.roll}"></span>`:''}
      </button>`);
      if(open) renderTreeNode(d,depth+1,active,out);
    }
    for(const n of leaves){
      out.push(`<button class="row leaf" data-id="${esc(n.id)}" aria-current="${n.id===state.selected}" style="padding-left:${pad+21}px">
        ${FILE_SVG}
        <span class="lbl">${esc(n.leaf)}</span>
        ${n.character?`<span class="char" title="${esc(n.character)} note">${n.character[0].toUpperCase()}</span>`:''}
        <span class="dot ${n.freshness}"></span>
      </button>`);
    }
  }

  function renderFiles(){
    const active=!!(state.q||state.staleOnly);
    const out=[];
    renderTreeNode(TREE,0,active,out);
    $('#list').innerHTML = out.length?out.join(''):'<div class="empty-note">No file notes match.</div>';
  }

  // ================= FLOWS =================
  function renderFlows(){
    const list=flowNotes.filter(passFilter)
      .sort((a,b)=>b.anchors.length-a.anchors.length||a.title.localeCompare(b.title));
    if(!list.length){$('#list').innerHTML='<div class="empty-note">No flows match.</div>';return;}
    $('#list').innerHTML=list.map(n=>{
      const files=n.anchors.map(a=>a.path.split('/').pop());
      const shown=files.slice(0,4), extra=files.length-shown.length;
      return `<button class="flowcard" data-id="${esc(n.id)}" aria-current="${n.id===state.selected}">
        <div class="fc-top">
          <span class="dot ${n.freshness}"></span>
          <span class="fc-title">${esc(n.title)}</span>
        </div>
        <div class="fc-span">
          ${shown.map(f=>`<span class="fc-file">${esc(f)}</span>`).join('')}
          ${extra>0?`<span class="fc-more">+${extra} more</span>`:''}
        </div>
      </button>`;
    }).join('');
  }

  function renderList(){
    $('#treeTools').style.visibility = state.lens==='files' ? 'visible':'hidden';
    if(state.lens==='files') renderFiles(); else renderFlows();
  }

  // ---- markdown mini-renderer ----
  function mdInline(t){
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,(_,c)=>`<code>${c}</code>`);
    t=t.replace(/\[\[([^\]]+)\]\]/g,(_,id)=>{
      const ok=byId.has(id);
      return `<a class="wl${ok?'':' dead'}" ${ok?`data-goto="${esc(id)}"`:''} title="${esc(id)}">${ok?esc(byId.get(id).title):esc(id)}</a>`;
    });
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    return t;
  }
  function renderMd(src){
    const lines=src.split('\n');
    let html='',i=0;
    const flush=(buf,tag)=>buf.length?`<${tag}>${buf.join('')}</${tag}>`:'';
    while(i<lines.length){
      let ln=lines[i];
      if(/^#\s+/.test(ln)){i++;continue;}
      if(/^##\s+/.test(ln)){html+=`<h2>${mdInline(ln.replace(/^##\s+/,''))}</h2>`;i++;continue;}
      if(/^###\s+/.test(ln)){html+=`<h3>${mdInline(ln.replace(/^###\s+/,''))}</h3>`;i++;continue;}
      if(/^\s*[-*]\s+/.test(ln)){
        const buf=[];
        while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){buf.push(`<li>${mdInline(lines[i].replace(/^\s*[-*]\s+/,''))}</li>`);i++;}
        html+=flush(buf,'ul');continue;
      }
      if(/^\s*\d+\.\s+/.test(ln)){
        const buf=[];
        while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){buf.push(`<li>${mdInline(lines[i].replace(/^\s*\d+\.\s+/,''))}</li>`);i++;}
        html+=flush(buf,'ol');continue;
      }
      if(!ln.trim()){i++;continue;}
      const buf=[];
      while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])){buf.push(lines[i]);i++;}
      html+=`<p>${mdInline(buf.join(' '))}</p>`;
    }
    return html;
  }
  function anchorHtml(a){
    const parts=a.path.split('/'); const file=parts.pop();
    const dir=parts.length?parts.join('/')+'/':'';
    return `<div class="anchor">
      <div class="anchor-top">
        <span class="apath"><span class="p">${esc(dir)}</span>${esc(file)}</span>
        <span class="astate ${a.state}">${a.state}</span>
        <button class="copy" data-copy="${esc(a.path)}">copy</button>
      </div>
      ${(a.symbols&&a.symbols.length)?`<div class="syms">${a.symbols.map(s=>`<button class="sym" data-copysym="${esc(s)}" title="click to copy symbol">${esc(s)}</button>`).join('')}</div>`:''}
    </div>`;
  }
  function linkBtn(id){
    const n=byId.get(id);
    return `<button class="linkbtn" data-goto="${esc(id)}"><span class="kind ${n.type}">${n.type.toUpperCase()}</span><span>${esc(n.title)}</span></button>`;
  }
  function renderNote(id){
    const n=byId.get(id); if(!n) return;
    state.selected=id;
    // reveal once: persist the file's ancestor folders so they stay open
    // (and prior folders stay open too) — you can still collapse any by hand
    if(n.type==='file') for(const p of ancestorsOf(id)) state.open.add(p);
    const outs=n.outLinks.filter(l=>byId.has(l));
    const r=$('#reader');
    r.innerHTML=`<div class="reader-inner">
      <div class="eyebrow">
        <span class="kind ${n.type}">${n.type.toUpperCase()}${n.character?' · '+n.character:''}</span>
        <span class="sep">/</span><span class="id">${esc(n.id)}</span>
      </div>
      <h1 class="note-title">${esc(n.title)}</h1>
      <div class="metabar">
        <span class="pill ${n.freshness}"><span class="d"></span>${n.freshness}</span>
        <span class="mi"><b>${n.anchors.length}</b> anchor${n.anchors.length===1?'':'s'}</span>
        <span class="mi"><b>${n.edits}</b> edit${n.edits===1?'':'s'}</span>
        <span class="mi">updated <b>${esc((n.updated||'').slice(0,10))}</b></span>
      </div>
      <div class="sec-label">Anchors — verified code addresses</div>
      ${n.anchors.length?n.anchors.map(anchorHtml).join(''):'<div class="empty-note">No anchors.</div>'}
      ${n.aliases.length?`<details class="aliases" style="margin-top:14px">
        <summary><b>${n.aliases.length}</b> search aliases <span style="color:var(--faint)">— queries that should surface this note</span><span class="chv">›</span></summary>
        <div class="alias-cloud">${n.aliases.map(a=>`<span>${esc(a)}</span>`).join('')}</div>
      </details>`:''}
      <div class="sec-label">Note</div>
      <div class="md">${renderMd(n.body)}</div>
      <div class="links-grid">
        <div class="linkcol"><div class="sec-label">Links to (${outs.length})</div>
          ${outs.length?outs.map(linkBtn).join(''):'<div class="empty-note">No outgoing links.</div>'}</div>
        <div class="linkcol"><div class="sec-label">Referenced by (${n.backlinks.length})</div>
          ${n.backlinks.length?n.backlinks.map(linkBtn).join(''):'<div class="empty-note">Not referenced.</div>'}</div>
      </div>
    </div>`;
    r.scrollTop=0;
    // switch lens to match the note type so it's visible in the rail
    if(n.type==='flow'&&state.lens!=='flows') setLens('flows');
    else if(n.type==='file'&&state.lens!=='files') setLens('files');
    else renderList();
  }

  // ---- events ----
  $('#q').addEventListener('input',e=>{state.q=e.target.value;renderList();});
  $('.lenses').addEventListener('click',e=>{const b=e.target.closest('.lens');if(b)setLens(b.dataset.lens);});
  function setLens(l){
    state.lens=l;
    document.querySelectorAll('.lens').forEach(x=>x.setAttribute('aria-pressed',x.dataset.lens===l));
    renderList();
  }
  chip.addEventListener('click',()=>{state.staleOnly=!state.staleOnly;chip.setAttribute('aria-pressed',state.staleOnly);renderList();});
  $('#treeTools').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tt==='collapse'){state.open.clear();}
    else{ // expand all dirs
      const walk=nd=>{for(const c of nd.children.values()){state.open.add(c.path);walk(c);}};walk(TREE);
    }
    renderFiles();
  });
  document.addEventListener('click',e=>{
    const dir=e.target.closest('[data-dir]');
    if(dir){const p=dir.dataset.dir;state.open.has(p)?state.open.delete(p):state.open.add(p);renderFiles();return;}
    const row=e.target.closest('[data-id]');
    if(row){switchView('notes');renderNote(row.dataset.id);closeRail();return;}
    const goto=e.target.closest('[data-goto]');
    if(goto){switchView('notes');renderNote(goto.dataset.goto);return;}
    const cs=e.target.closest('[data-copysym]');
    if(cs){copyText(cs.dataset.copysym);cs.classList.add('copied');setTimeout(()=>cs.classList.remove('copied'),750);return;}
    const cp=e.target.closest('[data-copy]');
    if(cp){copyText(cp.dataset.copy);cp.textContent='copied';setTimeout(()=>cp.textContent='copy',900);return;}
  });

  // ---- view switching ----
  function switchView(v){
    state.view=v;
    $('#tabNotes').setAttribute('aria-pressed',v==='notes');
    $('#tabGraph').setAttribute('aria-pressed',v==='graph');
    $('#split').classList.toggle('graph-mode',v==='graph');
    $('#reader').style.display=v==='graph'?'none':'';
    $('#graphWrap').style.display=v==='graph'?'':'none';
    if(v==='graph') drawGraph();
  }
  $('#tabNotes').onclick=()=>switchView('notes');
  $('#tabGraph').onclick=()=>switchView('graph');
  function closeRail(){$('#split').classList.remove('rail-open');}
  $('#menuBtn').onclick=()=>$('#split').classList.toggle('rail-open');

  // ================= GRAPH =================
  let G=null;
  function buildGraph(){
    const linked=new Set(); const edges=[];
    const seen=new Set();
    const addEdge=(a,b,kind)=>{const key=(a<b?a+'|'+b:b+'|'+a);if(seen.has(key))return;seen.add(key);
      linked.add(a);linked.add(b);edges.push([a,b,kind]);};
    // kind 0 = a hand-typed [[wikilink]]; kind 1 = the two notes anchor the
    // same file. Wikilinks are added first so an explicit link is never
    // downgraded to the derived kind by the dedup above.
    for(const n of notes) for(const l of n.outLinks) if(byId.has(l)&&l!==n.id) addEdge(n.id,l,0);
    for(const n of notes) for(const l of (n.anchorLinks||[])) if(byId.has(l)&&l!==n.id) addEdge(n.id,l,1);
    const ids=[...linked]; const idx=new Map(ids.map((id,i)=>[id,i])); const N=ids.length;
    const nodes=ids.map((id,i)=>{const a=2*Math.PI*i/N;
      return {id,x:Math.cos(a)*260,y:Math.sin(a)*260,vx:0,vy:0,deg:0,type:byId.get(id).type,title:byId.get(id).title};});
    const E=edges.map(([a,b,k])=>[idx.get(a),idx.get(b),k]);
    for(const [a,b] of E){nodes[a].deg++;nodes[b].deg++;}
    for(let it=0;it<320;it++){
      const k=it<220?1:0.4;
      for(let i=0;i<N;i++){let fx=0,fy=0;
        for(let j=0;j<N;j++){if(i===j)continue;
          let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d2=dx*dx+dy*dy+0.01,d=Math.sqrt(d2);
          const rep=1600/d2; fx+=dx/d*rep; fy+=dy/d*rep;}
        fx-=nodes[i].x*0.012; fy-=nodes[i].y*0.012;
        nodes[i].vx=(nodes[i].vx+fx)*0.82; nodes[i].vy=(nodes[i].vy+fy)*0.82;}
      for(const [a,b] of E){let dx=nodes[b].x-nodes[a].x,dy=nodes[b].y-nodes[a].y,d=Math.sqrt(dx*dx+dy*dy)+0.01;
        const spring=(d-90)*0.02,ux=dx/d*spring,uy=dy/d*spring;
        nodes[a].vx+=ux;nodes[a].vy+=uy;nodes[b].vx-=ux;nodes[b].vy-=uy;}
      for(const nd of nodes){nd.x+=nd.vx*k;nd.y+=nd.vy*k;}
    }
    G={nodes,E,idx};
    const wl=edges.filter(e=>e[2]===0).length;
    $('#graphHint').textContent=`${N} linked notes · ${edges.length} links `+
      `(${wl} written as [[links]], ${edges.length-wl} dashed: the notes share a file). Click a node to open it.`;
  }
  let cam={x:0,y:0,s:1},hover=-1;
  function drawGraph(){
    if(!G) buildGraph();
    const cv=$('#graphCanvas'),wrap=$('#graphWrap'),dpr=window.devicePixelRatio||1;
    const W=wrap.clientWidth,H=wrap.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;
    const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    const xs=G.nodes.map(n=>n.x),ys=G.nodes.map(n=>n.y);
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=70;
    const s=Math.min((W-pad*2)/(maxX-minX||1),(H-pad*2)/(maxY-minY||1));
    cam.s=s;cam.x=W/2-(minX+maxX)/2*s;cam.y=H/2-(minY+maxY)/2*s;
    const T=(x,y)=>[x*cam.s+cam.x,y*cam.s+cam.y];
    ctx.clearRect(0,0,W,H);
    for(const [a,b,k] of G.E){const A=G.nodes[a],B=G.nodes[b],[ax,ay]=T(A.x,A.y),[bx,by]=T(B.x,B.y);
      const on=hover>-1&&(a===hover||b===hover);
      ctx.strokeStyle=on?'rgba(31,79,216,.55)':'rgba(105,116,138,.20)';ctx.lineWidth=on?1.8:1;
      ctx.setLineDash(k?[4,4]:[]);
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
    ctx.setLineDash([]);
    const cs=getComputedStyle(document.documentElement);
    const cFile=cs.getPropertyValue('--file').trim(),cFlow=cs.getPropertyValue('--flow').trim();
    G.nodes.forEach((n,i)=>{const[x,y]=T(n.x,n.y),r=Math.max(4,Math.min(13,4+n.deg*1.6)),isH=i===hover;
      ctx.beginPath();ctx.arc(x,y,r+(isH?2:0),0,7);ctx.fillStyle=n.type==='flow'?cFlow:cFile;
      ctx.globalAlpha=hover>-1&&!isH&&!G.E.some(([a,b])=>(a===hover&&b===i)||(b===hover&&a===i))?0.35:1;
      ctx.fill();if(isH){ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}ctx.globalAlpha=1;});
    G._T=T;
  }
  const cv=$('#graphCanvas');
  function pick(mx,my){if(!G||!G._T)return -1;let best=-1,bd=18*18;
    G.nodes.forEach((n,i)=>{const[x,y]=G._T(n.x,n.y),d=(x-mx)**2+(y-my)**2,r=Math.max(4,Math.min(13,4+n.deg*1.6))+4;
      if(d<r*r&&d<bd){bd=d;best=i;}});return best;}
  cv.addEventListener('mousemove',e=>{const rect=cv.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,p=pick(mx,my),tip=$('#graphTip');
    if(p!==hover){hover=p;drawGraph();}
    if(p>-1){const n=G.nodes[p];tip.style.opacity=1;tip.style.left=mx+'px';tip.style.top=my+'px';
      tip.innerHTML=`<div class="tk">${n.type} · ${n.deg} link${n.deg===1?'':'s'}</div>${esc(n.title)}`;cv.style.cursor='pointer';}
    else{tip.style.opacity=0;cv.style.cursor='default';}});
  cv.addEventListener('mouseleave',()=>{hover=-1;$('#graphTip').style.opacity=0;drawGraph();});
  cv.addEventListener('click',e=>{const rect=cv.getBoundingClientRect(),p=pick(e.clientX-rect.left,e.clientY-rect.top);
    if(p>-1){switchView('notes');renderNote(G.nodes[p].id);}});
  window.addEventListener('resize',()=>{if(state.view==='graph')drawGraph();});

  // ---- boot ----
  // pre-open the top two directory levels so the Files tree opens usefully
  (function preopen(node,depth){for(const c of node.children.values()){if(depth<2)state.open.add(c.path);preopen(c,depth+1);}})(TREE,0);
  // land on the richest FILE note; the Flows tab (badged) is one click away
  const seed=[...fileNotes].sort((a,b)=>(b.outLinks.length+b.backlinks.length)-(a.outLinks.length+a.backlinks.length))[0]
    || notes[0];
  renderList();
  if(seed) renderNote(seed.id);
})();
</script>
